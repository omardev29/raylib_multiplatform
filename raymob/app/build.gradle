plugins {
    id 'com.android.application'
}

// Updates a file during compilation
// Used to replace instances of 'com.raylib.raymob'
def updateFile(filePath, toReplace, replacement) {
    def file = file(filePath)
    def modifiedContent = file.text.replaceAll(toReplace, replacement)
    file.write(modifiedContent)
}

// Checks if one or more values in a set
// of properties in gradle.properties are true
def isAtLeastOnePropertyTrueForPrefix(String prefix) {
    def properties = project.properties
    return properties.any { key, value ->
        key.startsWith(prefix) && value == 'true'
    }
}

// Returns the hexadecimal code of the desired OpenGL version
// Used to retrieve the code to write in the AndroidManifest.xml
static def getGLVersionCode(String version) {
    def versionCodes = [
            'ES20': '0x00020000',
            'ES30': '0x00030000',
            'ES31': '0x00030001',
            'ES32': '0x00030002'
    ]
    if (!versionCodes.containsKey(version)) {
        throw new IllegalArgumentException("Version '${version}' is not valid. Valid versions are: ${versionCodes.keySet()}")
    }
    return versionCodes[version]
}

// AdMob can be removed from the build entirely — see [android.admob] enabled in
// raylib_multiplatform.toml. configure.py also forces this to false when
// "android" is not in [targets], since ads in a build that does not exist cost
// only the dependency, the AD_ID permission and a Data safety declaration.
def admobEnabled = Boolean.parseBoolean(project.properties['admob.enabled'] ?: 'true')

// Whichever AdmobBridge.java is actually compiled. preBuild rewrites its
// package like it does the other Java sources, so it has to be named once.
def admobBridgePath = (admobEnabled ? 'src/admob' : 'src/noadmob') + '/java/com/raylib/raymob/AdmobBridge.java'

android {
    namespace project.properties['app.application_id']

    // API 36 = Android 16. Google Play requires targetSdk >= 36 for every new
    // app and every update from 2026-08-31. compileSdk matches so the new APIs
    // and their lint rules are actually visible.
    compileSdk 36
    buildToolsVersion '36.0.0'

    // Pinned explicitly rather than left to AGP's default. NDK r28 is also what
    // gives 16 KB ELF page alignment by default, which Play requires alongside
    // the API 36 target.
    ndkVersion '28.2.13676358'

    sourceSets {
        main {
            // Generated from AndroidManifest.template.xml by tools/configure.py.
            // A permission is an element, not an attribute, so it cannot be
            // switched with a manifestPlaceholder — see the template.
            manifest.srcFile 'generated/AndroidManifest.xml'
            java.srcDir(admobEnabled ? 'src/admob/java' : 'src/noadmob/java')
        }
    }

    defaultConfig {
        // From raylib_multiplatform.toml via generated.properties. Parsed
        // explicitly: properties arrive as Strings and minSdk wants an Integer.
        minSdk Integer.parseInt(project.properties['app.min_sdk'] as String)
        targetSdk 36

        applicationId project.properties['app.application_id']
        versionCode Integer.parseInt(project.properties['app.version_code'])
        versionName project.properties['app.version_name']

        // Defining the application name label (to the resources)
        resValue "string", "app_name", project.properties['app.name']

        // Generates a build configuration based on the requested features in gradle.properties
        buildConfigField("boolean", "FEATURE_DISPLAY_KEEP_ON", project.properties['display.keep_on'] ?: "false")
        buildConfigField("boolean", "FEATURE_DISPLAY_IMMERSIVE", project.properties['display.immersive'] ?: "false")
        buildConfigField("boolean", "FEATURE_DISPLAY_INTO_CUTOUT", project.properties['display.into_cutout'] ?: "false")

        // AdMob ad-unit ids (from gradle.properties), exposed to Java via BuildConfig
        buildConfigField("String", "ADMOB_INTERSTITIAL_ID", "\"" + (project.properties['admob.interstitial_id'] ?: "ca-app-pub-3940256099942544/1033173712") + "\"")
        buildConfigField("String", "ADMOB_REWARDED_ID", "\"" + (project.properties['admob.rewarded_id'] ?: "ca-app-pub-3940256099942544/5224354917") + "\"")

        // Substitution variables for the manifest
        manifestPlaceholders = [
            'GL_VERSION_CODE': getGLVersionCode(project.properties['gl.version']) ?: "0x00020000",
            'APP_LIB_NAME': project.properties['app.native_library_name'] ?: "raymob",
            'APP_ORIENTATION': project.properties['app.orientation'] ?: "landscape",
            'APP_CATEGORY': project.properties['app.category'] ?: "DEFAULT",
            'REQUIRE_GYROSCOPE': project.properties['requirements.gyroscope'] ?: "false",
            'REQUIRE_ACCELEROMETER': project.properties['requirements.accelerometer'] ?: "false",
            'ADMOB_APP_ID': project.properties['admob.app_id'] ?: "ca-app-pub-3940256099942544~3347511713"
        ]

        // Give to CMake the name of the library
        externalNativeBuild {
            cmake {
                def nativeLibName = project.findProperty('app.native_library_name') ?: 'raymob'
                def glVersion = project.findProperty('gl.version') ?: 'ES20'

                arguments "-DPLATFORM=Android",
                          "-DBUILD_EXAMPLES=OFF",
                          "-DAPP_LIB_NAME=$nativeLibName",
                          "-DGL_VERSION=$glVersion"
            }
        }

        applicationVariants.all { variant ->
            // Change output names to the correct ones
            variant.outputs.all {
                outputFileName = outputFileName.replace("com.raylib.raymob", project.properties['app.application_id'])
                outputFileName = outputFileName.replace("raymob", project.properties['app.native_library_name'])
            }
        }

    }

// Execute the preBuild task before the compilation
    preBuild.doLast {
        // Copy resources from project root to Android assets/ directory
        def rootDir = new File(project.rootDir.parentFile, "resources")
        def destDir = new File(project.rootDir, "app/src/main/assets")

        println "=== Copying resources to assets ==="
        println "Source: ${rootDir.absolutePath}"
        println "Dest: ${destDir.absolutePath}"

        if (rootDir.exists()) {
            rootDir.eachFileRecurse() { f ->
                def relPath = f.canonicalPath.replace(rootDir.canonicalPath + File.separator, "")
                // Skip the resource pack. Android cannot read it — rres opens the
                // container with plain fopen(), and inside an APK there is no such
                // file — so the loose copies below are what the game actually
                // loads. Including it anyway would put every asset in the APK
                // twice, once in the clear and once encrypted for nobody.
                if (f.name.endsWith(".rres")) {
                    println "Skipped (unreadable on Android): $relPath"
                    return
                }
                def target = new File(destDir, relPath)
                if (f.directory) {
                    target.mkdirs()
                } else {
                    target.parentFile.mkdirs()
                    f.withInputStream { input ->
                        target.withOutputStream { output ->
                            output << input
                        }
                    }
                }
                println "Copied: $relPath"
            }
            println "=== Resources copied ==="
        } else {
            println "WARNING: resources/ not found"
        }

        // Modify the package name and library name in NativeLoader.java
        updateFile("src/main/java/com/raylib/raymob/NativeLoader.java", "package com.raylib.raymob;", "package " + project.properties['app.application_id'] + ";")
        updateFile("src/main/java/com/raylib/raymob/NativeLoader.java", "System.loadLibrary\\(\"raymob\"\\);", "System.loadLibrary\\(\"" + project.properties['app.native_library_name'] + "\"\\);")

        // Modify the package name and library name in other java classes
        updateFile("src/main/java/com/raylib/raymob/DisplayManager.java", "package com.raylib.raymob;", "package " + project.properties['app.application_id'] + ";")
        updateFile("src/main/java/com/raylib/raymob/SoftKeyboard.java", "package com.raylib.raymob;", "package " + project.properties['app.application_id'] + ";")
        updateFile(admobBridgePath, "package com.raylib.raymob;", "package " + project.properties['app.application_id'] + ";")

        // Modify the package name in proguard-rules.pro
        updateFile("proguard-rules.pro", "com.raylib.raymob", project.properties['app.application_id'])

        // Modify the library name in raymob C source
        // NOTE: the Android build compiles thirdparty/raymob (see app/src/main/cpp/CMakeLists.txt),
        // so the JNI class paths must be patched there
        updateFile("../../thirdparty/raymob/display.c", "com/raylib/raymob", project.properties['app.application_id'].replace(".", "/"))
        updateFile("../../thirdparty/raymob/soft_keyboard.c", "com/raylib/raymob", project.properties['app.application_id'].replace(".", "/"))

    }

    // Execute the postBuild task after the compilation
    gradle.buildFinished {

        // Restore the package name and library name in NativeLoader.java
        updateFile("src/main/java/com/raylib/raymob/NativeLoader.java", "package " + project.properties['app.application_id'] + ";", "package com.raylib.raymob;")
        updateFile("src/main/java/com/raylib/raymob/NativeLoader.java", "System.loadLibrary\\(\"" + project.properties['app.native_library_name'] + "\"\\);", "System.loadLibrary\\(\"raymob\"\\);")

        // Restore the package name and library name in other java classes
        updateFile("src/main/java/com/raylib/raymob/DisplayManager.java", "package " + project.properties['app.application_id'] + ";", "package com.raylib.raymob;")
        updateFile("src/main/java/com/raylib/raymob/SoftKeyboard.java", "package " + project.properties['app.application_id'] + ";", "package com.raylib.raymob;")
        updateFile(admobBridgePath, "package " + project.properties['app.application_id'] + ";", "package com.raylib.raymob;")

        // Restore the package name in proguard-rules.pro
        updateFile("proguard-rules.pro", project.properties['app.application_id'], "com.raylib.raymob")

        // Restore the library name in raymob C source
        updateFile("../../thirdparty/raymob/display.c", project.properties['app.application_id'].replace(".", "/"), "com/raylib/raymob")
        updateFile("../../thirdparty/raymob/soft_keyboard.c", project.properties['app.application_id'].replace(".", "/"), "com/raylib/raymob")

    }

    // Release signing for Google Play (AAB). The keystore is provided at build
    // time via environment variables (see the CI job / docs) and is NEVER
    // committed. If no keystore is provided, bundleRelease yields an unsigned
    // bundle (fine for local checks, but Play requires a signed AAB).
    signingConfigs {
        release {
            def ksPath = System.getenv("ANDROID_KEYSTORE_FILE")
            if (ksPath != null && !ksPath.isEmpty() && file(ksPath).exists()) {
                storeFile file(ksPath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: ""
                keyAlias System.getenv("ANDROID_KEY_ALIAS") ?: ""
                keyPassword System.getenv("ANDROID_KEY_PASSWORD") ?: ""
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            debuggable false
            jniDebuggable false
            pseudoLocalesEnabled false
            zipAlignEnabled true

            def ksPath = System.getenv("ANDROID_KEYSTORE_FILE")
            if (ksPath != null && !ksPath.isEmpty() && file(ksPath).exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        // AGP 8.13 requires JDK 17 to run; the language level follows so the
        // toolchain is one consistent story rather than 17-running-8.
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            // Resolved from the Android SDK ("cmake;3.31.6", installed in the
            // build image), NOT from PATH. Binding to whatever /opt/cmake
            // happens to be made the Android build break every time the
            // image's CMake was bumped.
            version '3.31.6'
        }
    }
buildFeatures {
        buildConfig true
        viewBinding true
    }
}

    // Add your project's dependencies here.
// This section is used to include external libraries or modules that your project relies on.
// These dependencies will be automatically downloaded and integrated into the build process.
// To add a new dependency, use the 'implementation' or 'api' keyword followed by the library's coordinate or name.

dependencies {
    // Google Mobile Ads SDK (AdMob). Only linked when AdMob is on: with it off
    // there is no ads code in the APK to link it to (see src/noadmob/java).
    //
    // An AAR compiled against a lower SDK is always fine under a higher
    // compileSdk, so this deliberately did NOT move with the API 36 bump:
    // keeping them in separate commits means a broken build can be bisected to
    // one or the other. 25.x exists when you want it.
    if (admobEnabled) {
        implementation 'com.google.android.gms:play-services-ads:24.9.0'
    }
}
