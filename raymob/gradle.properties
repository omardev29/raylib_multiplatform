# Gradle and AGP infrastructure only.
#
# Everything about YOUR GAME — name, application id, orientation, AdMob ids,
# required features — lives in raylib_multiplatform.toml at the repo root and
# arrives here through raymob/generated.properties, which settings.gradle loads.
#
# These four have to stay in this file because Gradle reads it during
# initialisation: org.gradle.jvmargs is needed before the daemon JVM starts, and
# the AndroidX flags before AGP is configured. Nothing generated exists that
# early.

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.nonTransitiveRClass=true
android.enableJetifier=false
# Required by the Google Mobile Ads SDK (AdMob)
android.useAndroidX=true
