# raylib_multiplatform — project configuration
#
# This file plus `src/` and `include/` is the whole of your side of the
# template. Everything else — CMake, Gradle, the Xcode spec, the 14-target CI —
# is generated or driven from here and you should not need to open it.
#
# Delete this file and the build still works, on defaults, with a warning.
# Change a value and `cmake --preset debug` regenerates everything that depends
# on it. Nothing generated is committed, so it cannot drift out of sync.

[project]
# Binary name, CMake target, Xcode scheme, artifact names. Letters, digits,
# `_` and `-` only — no spaces, because it becomes a filename on five OSes.
name = "ray_test"

# There is deliberately no `version` here. It comes from the git tag: `v1.2.3`
# becomes versionName 1.2.3 everywhere, and Android's versionCode is derived
# from it. An untagged build is 0.0.0-dev. One source, nothing to remember to
# bump twice.

[window]
title  = "Raylib is Multiplatform!"
width  = 800
height = 450
# "landscape" | "portrait" | "unspecified" — applied to Android and iOS at once.
# On desktop it only decides the initial window shape.
orientation = "landscape"

[targets]
# Which platforms to build. Groups expand and deduplicate; there is no
# precedence to reason about because there are no conflicts.
#   groups : all | desktop | mobile | linux | windows | apple | bsd | web | android
#   exact  : linux-x64 linux-arm64 linux-riscv64 windows-x64 windows-arm64
#            macos ios web android
#            freebsd-x64 freebsd-arm64 openbsd-x64 openbsd-arm64 netbsd-x64
#            linux-drm
#
# linux-drm is DRM/KMS: the game draws straight to the screen with no X11 and
# no Wayland, from a bare TTY. A Raspberry Pi, an arcade cabinet, a kiosk, or
# just developing from a console. It is NOT part of "all" on purpose — it needs
# libdrm on the build machine and /dev/dri on the machine that runs it, and
# nobody should get a target they cannot run by writing "all". Name it.
enabled  = ["all"]
# Subtracted from whatever `enabled` expanded to. Use it to keep a group and
# drop one member: enabled = ["all"], disabled = ["ios"].
disabled = []

[android]
# IRREVERSIBLE ON GOOGLE PLAY. Once an app is published under this id you can
# never change it — you would have to ship a new listing and lose your installs.
# Get it right before your first upload. CI refuses to build a tag while this
# still says com.example.*.
application_id = "com.example.raytest"

min_sdk = 24
# ES20 | ES30 | ES31 | ES32. Devices without the requested version are not
# offered your app on the Play Store.
gl_version = "ES30"
# How the Play Store files your app (android:appCategory):
#   game | audio | video | image | social | news | maps | productivity | accessibility
# This is NOT what puts the icon in the app drawer — that part is fixed and not
# yours to set, because an app without it installs and then appears nowhere.
category = "game"

[android.display]
keep_on     = true    # never sleep while playing
immersive   = true    # hide the system bars
into_cutout = true    # draw behind the notch

[android.permissions]
# What the app asks the system for. Every one of these is visible on your Play
# listing, so ask for nothing you do not use.
internet  = false   # android.permission.INTERNET — forced on when AdMob is enabled
vibration = false   # android.permission.VIBRATE  — needed by raymob's Vibrate()

[android.features]
# Hardware. true = the Play Store hides your app from devices that lack it.
# false still declares the sensor as optional, which is what you want unless
# the game is unplayable without it.
gyroscope     = false
accelerometer = false

[android.admob]
# false removes AdMob completely: no Google Mobile Ads dependency, no AD_ID
# permission, no SDK init at startup, and nothing to declare in Play's Data
# safety form. Your code does not change — the <admob.h> calls stay compilable
# and do nothing, exactly as they already do off Android.
#
# It also turns itself off when "android" is not in [targets], however you
# removed it: by name, or by leaving out a group like "mobile".
enabled = true

# Google's official TEST ids. Replace with your own before publishing. Clicking
# real ads from your own build is the fastest way to get an AdMob account
# suspended.
app_id          = "ca-app-pub-3940256099942544~3347511713"
interstitial_id = "ca-app-pub-3940256099942544/1033173712"
rewarded_id     = "ca-app-pub-3940256099942544/5224354917"

# NOT DONE YET: consent. Serving ads to users in the EEA or the UK requires a
# Google-certified CMP (the UMP SDK) since January 2024, and this template does
# not ship one. See "AdMob" in TECHNICAL.md before you publish with ads on.

[upx]
# Compress the shipped binary with UPX. Measured on this project: 847 KB down to
# 215 KB, a 74 % cut, and the compressed binary still passes the render gate.
#
# Groups expand and deduplicate exactly like [targets], and `disabled` is
# subtracted afterwards, so there is no precedence to reason about.
#   groups : all | linux | windows | bsd
#   exact  : linux-x64 linux-arm64 linux-riscv64 linux-drm
#            windows-x64 windows-arm64
#            freebsd-x64 freebsd-arm64 openbsd-x64 openbsd-arm64 netbsd-x64
#
# `all` here is NOT the fourteen. macOS and iOS are refused because the binary
# is code-signed and compressing it breaks the signature; Android because what
# ships is a .so inside an APK, which is already a zip, so compressing it makes
# the APK BIGGER; web because it is .wasm and the browser fetches it gzipped.
# Naming any of them is an error with the reason, not a silent no-op.
#
# WINDOWS IS AVAILABLE AND NOT ON BY DEFAULT, and that is deliberate: an
# unsigned .exe that has been UPX-packed is a shape Windows Defender associates
# with malware, and it gets quarantined on some machines and not others. If you
# sign your builds, turn it on and you get the same 70-odd per cent. If you do
# not, the download saving is not worth a fraction of your players being told
# your game is a virus.
#
# BSD is untested territory for this and is off by default for that reason
# alone: upx publishes no FreeBSD/OpenBSD/NetBSD build, so the VMs would have to
# install it from ports.
#
# THE DEFAULT IS EXACTLY THE TARGETS CI BOOTS. linux-x64 and linux-arm64 run on
# real runners of their own architecture, and every push starts the packed
# binary and checks it puts pixels on the screen — so if UPX ever produced a
# stub that does not launch, a push finds out. linux-riscv64 and linux-drm are
# cross-compiled and only checked statically: nothing ever executes them, so
# turning UPX on there would ship a binary whose launch nobody has observed.
# UPX supports riscv64 perfectly well; what is missing is the evidence, not the
# support. When riscv64 gets a native runner that boots the game, it belongs in
# this list.
enabled  = ["linux-x64", "linux-arm64"]
disabled = []

# Skip compression when the binary is bigger than this, in megabytes.
#
# UPX cannot pack a file past roughly 768 MB, and it does not decline politely
# when it happens: it exits non-zero, which fails the release of a game whose
# only problem is that it is large. The default leaves 168 MB of headroom, so
# what you get instead is a line in the log and an uncompressed binary that
# ships. Raise it if you have measured your own ceiling, lower it if you would
# rather not spend the packing minute on anything sizeable.
#
# To turn compression off entirely, empty `enabled` above. Setting this to 0 is
# rejected, because it says the wrong thing.
max_size_mb = 600

[linux]
# Which windowing backend Linux uses, and whether it talks to Wayland natively.
#
# backend  "glfw" (default) or "rgfw". GLFW is what the fourteen-target matrix
#          is tested against; RGFW is smaller and younger — and on Linux it is
#          X11-ONLY, so it cannot be combined with wayland = true. The
#          generator refuses that pair rather than letting the build pick one.
#
#          Neither key reaches the linux-drm target: DRM talks to the kernel
#          directly and has no windowing backend and no compositor at all.
# wayland  false (default) builds GLFW against X11, so on a Wayland desktop the
#          game runs through XWayland — an extra hop, and the reason fractional
#          scaling and per-monitor DPI misbehave there. true builds GLFW's
#          native Wayland backend instead, and needs libwayland-dev,
#          wayland-protocols and libxkbcommon-dev on the build machine.
#
#          Off here because raylib 6.0's Wayland path is the less travelled
#          one. raylib 6.2 turns it on upstream — flip this default when we
#          bump, and delete this paragraph.
#
#          One difference you WILL see, and it is Wayland's design and not a
#          bug: there is no window position. GetWindowPosition() and
#          SetWindowPosition() do not work, and GLFW logs a warning the first
#          time something asks. A game that remembers where its window was
#          cannot do that on Wayland, natively or otherwise.
backend = "glfw"
wayland = false

[windows]
# Which windowing backend Windows uses.
#
#   "glfw"   the default, and what raylib uses everywhere else. Mature, and it
#            is what the fourteen-target matrix is tested against.
#   "win32"  raylib 6.0's native Win32 backend: no GLFW at all, one dependency
#            fewer and a smaller .exe.
#   "rgfw"   RGFW, a single-header windowing library. Also no GLFW, also
#            smaller, and the same caveat as win32 applies.
#
# "win32" is a real option and a young one. It does not cover everything GLFW
# does — gamepads, multi-monitor, the clipboard and some keyboard cases are
# thinner — so it is right for a simple game and wrong as a default. Try it,
# measure the .exe, and keep it only if nothing you use is missing.
backend = "rgfw"

[ios]
# Same warning as Android: this is your App Store identity.
bundle_id = "com.example.raytest"
deployment_target = "15.6"

[ios.settings]
# Raw Xcode build settings, copied verbatim into the generated XcodeGen spec.
# For a device build you will need something like:
#   DEVELOPMENT_TEAM = "ABCDE12345"
#   CODE_SIGN_STYLE  = "Automatic"

[icon]
# One square PNG, 1024x1024 recommended. EVERY platform's icon comes out of this
# one file: every Android density, the round variant, the adaptive foreground,
# the Play Store asset, the iOS AppIcon, and the multi-resolution .ico that gets
# embedded into the Windows .exe.
#
# Deliberately NOT in resources/: everything in there is packed into
# resources.rres and shipped with the game, and your launcher icon is a build
# input, not a game asset.
source = "branding/icon.png"
# Behind the adaptive icon on Android 8+. Hex, or "" to use the source image
# as its own background.
adaptive_background = "#3DDC84"

[raylib]
# Modules you do not use, to shrink the binary. rcore and rlgl are mandatory
# and are not listed on purpose.
#   rshapes | rmodels | raudio
# rtextures and rtext cannot be disabled: the asset layer and the CI render
# gate are built on them, and rres calls into both.
# NOTE: this does not affect iOS, which links a prebuilt xcframework.
disabled_modules = []

[dev]
# Local development only — the `debug` preset. CI builds `release`/`web` and is
# unaffected by anything in this section.
# clang | gcc | mingw | msvc | default
#
# mingw looks for x86_64-w64-mingw32-gcc before plain `gcc`, which is what makes
# it work from MSYS2. Plain "gcc" on Windows is how you pick up a stray compiler
# from a Git-for-Windows shell and end up with a build that asks for X11.
compiler = "clang"
linker   = "auto"    # auto | mold | lld | default
#
# WHAT EACH ONE CAN ACTUALLY DO, because "faster linker" is not the whole story:
#
#   auto     try the fast ones, keep the first that LINKS, fall back to the
#            system one. It never fails a build — it is a speed setting, and a
#            speed setting that can stop a build is worse than a slow build.
#   mold     Linux and the BSDs only. mold emits ELF and nothing else; run
#            `mold --help` and the list is elf32-i386, elf64-x86-64 and so on,
#            with no PE/COFF and no Mach-O. Asking for it on Windows or macOS
#            is refused here rather than at the linker, which used to fail with
#            a message about `ld` that never said the word mold.
#   lld      everywhere, IF the toolchain can reach it. GCC's -fuse-ld=lld wants
#            an `ld.lld` on PATH and not just `lld`, and MSYS2 ships one without
#            the other — so the build checks by linking a test program instead
#            of trusting that the binary exists.
#   default  whatever the platform uses. On macOS that is Apple's ld, which is
#            already fast, so this is what `auto` settles on there.

[web]
# How much memory the WebAssembly module is allowed.
#
# memory  Megabytes reserved at startup (Emscripten's TOTAL_MEMORY). 64 is
#         enough for a menu and a handful of textures. A game that loads a
#         tile atlas and a few tracks wants more, and the failure mode is
#         specific: the tab dies with "Cannot enlarge memory arrays".
# grow    Let it grow past `memory` instead of aborting. It costs a little
#         speed on every heap access — every pointer goes through a bounds
#         check that cannot be hoisted — so a game that knows its ceiling is
#         better off raising `memory` and leaving this off.
memory = 64
grow   = false

# backend  What raylib talks to in the browser. THE COMPILER IS EMSCRIPTEN IN
#          ALL THREE CASES — that is not what this chooses. It chooses whether
#          there is a layer between raylib and the browser, and it is the same
#          question [windows] backend and [linux] backend answer for their
#          platforms.
#
#   glfw        raylib calls GLFW, and Emscripten emulates GLFW in JavaScript
#               (that is what -sUSE_GLFW=3 links). The path raylib has shipped
#               for years and the one every web example on the internet is
#               built with. THE DEFAULT.
#   emscripten  raylib calls the browser through Emscripten's own API, with
#               nothing in between. New in raylib 6.0
#               (platforms/rcore_web_emscripten.c). One layer less and no
#               JavaScript shim to download.
#   rgfw        REFUSED, and not out of caution: RGFW's web backend calls
#               emscripten_sleep, which needs -sASYNCIFY, and this framework
#               deliberately has none — the browser owns the frame loop through
#               emscripten_set_main_loop precisely so that it does not. It
#               builds fine and then dies in the tab with "Please compile your
#               program with async support". Found by opening it in a real
#               browser; see .github/workflows/web-backends.yml.
#
#          BOTH OF THESE ARE VERIFIED IN A BROWSER, not just built: the boot
#          job in web-backends.yml opens each one in headless Chromium and
#          screenshots the canvas. For `emscripten` that mattered more than
#          usual — raylib 6.0 ships the backend and never wired it into the
#          build, so it took four local patches to compile at all.
#
#          WHY NOT `emscripten` BY DEFAULT YET, having read both backends: they
#          implement the same functions and stub out the same ones — monitor
#          enumeration and SetGamepadMappings, neither of which means anything
#          in a browser. Where they differ is in unfinished detail, and it is
#          in the one raylib calls new: rcore_web_emscripten.c carries
#          `TODO: keyCodes should be mapped to raylib/GLFW3 Key values` and
#          `TODO: Add char codes`, so key constants are not guaranteed to be
#          the ones raylib documents, and drop-files is `TODO: Implement GLFW3
#          alternative for drop callback`. The GLFW path has none of those.
#
#          Upstream is going the same way — rcore_web.c itself carries
#          `TODO: Replace GLFW-web by Emscripten?` — so this is an option now
#          and a default later, once the keyboard mapping is finished.
backend = "glfw"


# --- [input] ----------------------------------------------------------------
#
# deadzone  How much of an analogue stick's travel reads as zero, 0..0.95.
#           Sticks drift as they wear, so 0 means a character that walks on its
#           own on a controller that has seen some use; too much and the stick
#           feels dead before it moves. 0.2 is the value most engines settle on.
#
#           It rescales rather than clipping: just past the dead zone the stick
#           reads a little above zero, not a sudden 0.2. Without that, every
#           character starts moving at a fifth of full speed.
#
#           Keyboard and d-pad are unaffected — they are on or off and have no
#           travel to ignore. rmp::input::set_deadzone() changes it at runtime,
#           which is what a settings slider does.
[input]
deadzone = 0.2

[ui]
# rmp::ui — the interface layer. Nothing here is required: with all four at
# their defaults a menu is still three lines of code.
#
# theme      "dark" or "light". Only which one the app starts with — an
#            in-game appearance setting is rmp::ui::set_theme(theme_light()).
# font       "" uses the font built into raylib: no asset, no licence, works on
#            all fourteen targets. It is a pixel font, so its scale is rounded
#            to a whole number and it stays sharp instead of going blurry.
#            Point it at a .ttf in resources/ for something less retro.
# font_size  In DESIGN units, i.e. at the [window] resolution above. The UI
#            scales it from there, so this is a size you pick once.
# scale      0 = automatic, derived from [window] and the real window size.
#            Set a number to pin it (an "interface size" option would do this).
# max_elements  Ceiling on the UI tree; it is what sizes the layout arena.
#            512 is plenty for menus and HUDs — Clay's own default of 8192
#            would reserve megabytes for three buttons.
theme        = "dark"
font         = ""
font_size    = 20
scale        = 0
max_elements = 512

[resources]
# Obfuscation, not security: the password ends up inside the binary. It exists
# so casual unpacking of your assets is inconvenient, nothing more.
rres_password = "raylib-template"

[deploy]
# Ship a LICENSES.txt next to the binary, with the full notice of everything
# vendored — raylib, Clay, rres and whatever comes later. Generated from the
# licence files in thirdparty/, so adding a dependency updates it and forgetting
# to add one is a build error.
#
# Turn it off ONLY if your game already gives the credits inside it: a credits
# scene satisfies the same licences, and a loose .txt next to the executable is
# then just noise. On by default, because most games do not have that scene.
licenses = true

[deploy.itch]
# Leave empty to skip publishing. The API key is a GitHub secret
# (BUTLER_API_KEY), never here.
user = ""
game = ""

[deploy.firebase]
# Runs the debug APK on real hardware. Needs the GCP_SA_KEY secret and a Blaze
# billing account. Empty = skip.
project_id = ""
device     = "model=MediumPhone.arm,version=33,locale=en,orientation=portrait"
