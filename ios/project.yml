# XcodeGen spec for the iOS target (generate the .xcodeproj with `xcodegen`).
#
#   brew install xcodegen
#   cd ios && xcodegen generate
#   xcodebuild -project ray_test.xcodeproj -scheme ray_test \
#       -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
#
# This scaffold is best-effort: it wires the game sources + rres + the pinned
# raylib-iOS fork (raylib.xcframework) + the bundled ANGLE frameworks. Iterate
# on a Mac with Xcode; device builds additionally need a signing team.

name: ray_test
options:
  bundleIdPrefix: com.example
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "15.6"

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "15.6"

targets:
  ray_test:
    type: application
    platform: iOS
    deploymentTarget: "15.6"
    sources:
      - path: ../src
      - path: ../include
      # Folder reference (not a group): the whole directory is copied into the
      # bundle as `resources/`, so RESOURCES_PATH="./resources/" resolves once
      # the app chdir's to its bundle (see IOS_FUNCS in include/raylib_multi.h).
      # Without this the app builds and boots but every LoadTexture returns 0x0.
      - path: ../resources
        type: folder
        buildPhase: resources
    dependencies:
      - framework: ../thirdparty/raylib-ios/raylib.xcframework
        embed: false
      - framework: ../thirdparty/raylib-ios/deps/ANGLE/libEGL.xcframework
        embed: true
      - framework: ../thirdparty/raylib-ios/deps/ANGLE/libGLESv2.xcframework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.raytest
        PRODUCT_NAME: ray_test
        # Info.plist is generated by Xcode from these keys
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchStoryboardName: ""
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIRequiredDeviceCapabilities: arm64
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        # raylib iOS backend
        GCC_PREPROCESSOR_DEFINITIONS:
          - PLATFORM_IOS
          - GRAPHICS_API_OPENGL_ES3
          # Escaped quotes so RESOURCES_PATH expands to a real string literal
          - RESOURCES_PATH=\"./resources/\"
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        CLANG_CXX_LIBRARY: libc++
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/../include
          - $(SRCROOT)/../tests
          - $(SRCROOT)/../thirdparty/raylib-ios/src
          - $(SRCROOT)/../thirdparty/raylib-ios/projects/Xcode26/raylib/bridge
          - $(SRCROOT)/../thirdparty/rres
          - $(SRCROOT)/../thirdparty/raymob
