# macOS and iOS.
#
# Reusable (`workflow_call`) — called from ci.yml.
#
# Both jobs pin the runner image AND select Xcode explicitly. `macos-latest`
# moved from macOS 15 to macOS 26 within a few months, taking the default Xcode
# with it, which is exactly the kind of drift an iOS build trips over first.

name: Apple

on:
  workflow_call:
    inputs:
      project_name:
        required: true
        type: string
      targets:
        description: 'JSON array of enabled target ids (from [targets] in the config)'
        required: true
        type: string
      # Everything below is a pin the weekly canary floats to find out what is
      # about to break. Defaults match FROZEN_VERSIONS.md, but ci.yml always
      # passes explicit values read from there, so this file is never the
      # source of truth.
      runner:
        required: false
        default: macos-26
        type: string
      xcode_version:
        description: 'Exact version, or "latest" for the newest installed'
        required: false
        default: '26.6'
        type: string
      ninja_version:
        required: false
        default: '1.13.2'
        type: string
      ninja_sha256:
        description: 'Empty skips verification — required when a version floats'
        required: false
        default: 'c99048673aa765960a99cf10c6ddb9f1fad506099ff0a0e137ad8960a88f321b'
        type: string
      xcodegen_version:
        required: false
        default: '2.46.0'
        type: string
      xcodegen_sha256:
        required: false
        default: '4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806'
        type: string

permissions:
  contents: read

# A caller cannot override a callee's `env:`, but a callee's `env:` can read its
# own inputs — so this keeps every `$XCODE_VERSION` in the steps below working
# untouched while making the values overridable from outside.
env:
  XCODE_VERSION: ${{ inputs.xcode_version }}
  NINJA_VERSION: ${{ inputs.ninja_version }}
  NINJA_MAC_SHA256: ${{ inputs.ninja_sha256 }}
  XCODEGEN_VERSION: ${{ inputs.xcodegen_version }}
  XCODEGEN_SHA256: ${{ inputs.xcodegen_sha256 }}

jobs:
  macos:
    if: contains(fromJSON(inputs.targets), 'macos')
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Select Xcode
        run: |
          set -euo pipefail
          if [ "$XCODE_VERSION" = "latest" ]; then
            # Canary mode: whatever the runner image ships today.
            APP=$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | sort -V | tail -1)
          else
            APP="/Applications/Xcode_${XCODE_VERSION}.app"
          fi
          if [ ! -d "$APP" ]; then
            echo "FAIL: Xcode ${XCODE_VERSION} is not installed on this runner. Available:"
            find /Applications -maxdepth 1 -name 'Xcode*.app'
            echo "Update the 'xcode' pin in thirdparty/FROZEN_VERSIONS.md."
            exit 1
          fi
          sudo xcode-select -s "$APP/Contents/Developer"
          xcodebuild -version
          # A contract line the canary's triage greps for. Deliberately not a
          # regex over `xcodebuild -version` output, which would work today and
          # break silently the day Apple reformats it. The key matches the pin
          # name in FROZEN_VERSIONS.md so the diff lines up.
          echo "CANARY_OBSERVED xcode=$(xcodebuild -version | head -1 | awk '{print $2}')"
          echo "runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"

      # `brew install ninja` was a network call to an unversioned formula whose
      # macOS requirements move on Homebrew's schedule, not ours.
      - name: Install Ninja (pinned)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/ninja-mac.zip \
            "https://github.com/ninja-build/ninja/releases/download/v${NINJA_VERSION}/ninja-mac.zip"
          if [ -n "$NINJA_MAC_SHA256" ]; then
            echo "${NINJA_MAC_SHA256}  /tmp/ninja-mac.zip" | shasum -a 256 -c -
          else
            echo "::warning::ninja sha256 not pinned; observed $(shasum -a 256 /tmp/ninja-mac.zip | cut -d' ' -f1)"
          fi
          unzip -o -q /tmp/ninja-mac.zip -d /usr/local/bin
          chmod +x /usr/local/bin/ninja
          ninja --version

      # Universal binary: the runners are Apple Silicon, so an arm64-only build
      # left every Intel Mac user with nothing.
      - name: Configure
        run: cmake --preset release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build --preset release

      - name: Pack resources (AES rres)
        run: cmake --build build --target pack_resources

      - name: Test (static) — binary is a universal Mach-O with both slices
        run: |
          set -e
          BIN=build/${{ inputs.project_name }}
          test -f "$BIN" || { echo "FAIL: $BIN not found"; exit 1; }
          test -x "$BIN" || { echo "FAIL: $BIN not executable"; exit 1; }
          file "$BIN"
          file "$BIN" | grep -qi "Mach-O" || { echo "FAIL: not a Mach-O binary"; exit 1; }
          lipo -info "$BIN"
          lipo -info "$BIN" | grep -q "arm64"  || { echo "FAIL: no arm64 slice"; exit 1; }
          lipo -info "$BIN" | grep -q "x86_64" || { echo "FAIL: no x86_64 slice"; exit 1; }
          echo "PASS: universal Mach-O (arm64 + x86_64)"

      - name: Package
        run: |
          mkdir -p package/resources
          # LICENSES.txt: the full notice of everything vendored, generated by
          # tools/configure.py from the licence files in thirdparty/. Absent
          # when [deploy] licenses = false, which is why this is not a hard cp.
          if [ -f cmake/generated/LICENSES.txt ]; then
            cp cmake/generated/LICENSES.txt package/
          fi
          cp build/${{ inputs.project_name }} package/
          cp resources/resources.rres package/resources/
          cd package && zip -r ../macos-build.zip .

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: macos-build
          path: macos-build.zip
          retention-days: 7

  ios:
    if: contains(fromJSON(inputs.targets), 'ios')
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive

      - name: Select Xcode
        run: |
          set -euo pipefail
          if [ "$XCODE_VERSION" = "latest" ]; then
            # Canary mode: whatever the runner image ships today.
            APP=$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | sort -V | tail -1)
          else
            APP="/Applications/Xcode_${XCODE_VERSION}.app"
          fi
          if [ ! -d "$APP" ]; then
            echo "FAIL: Xcode ${XCODE_VERSION} is not installed on this runner. Available:"
            find /Applications -maxdepth 1 -name 'Xcode*.app'
            echo "Update the 'xcode' pin in thirdparty/FROZEN_VERSIONS.md."
            exit 1
          fi
          sudo xcode-select -s "$APP/Contents/Developer"
          xcodebuild -version
          # A contract line the canary's triage greps for. Deliberately not a
          # regex over `xcodebuild -version` output, which would work today and
          # break silently the day Apple reformats it. The key matches the pin
          # name in FROZEN_VERSIONS.md so the diff lines up.
          echo "CANARY_OBSERVED xcode=$(xcodebuild -version | head -1 | awk '{print $2}')"
          echo "runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"

      # raylib_multiplatform.toml becomes gradle.properties, the XcodeGen spec,
      # the launcher icons and the CMake config. CMake runs this itself, but
      # Gradle and XcodeGen never invoke CMake, so they need it spelled out.
      - name: Generate configuration
        # No --require-icons: the iOS app icon is a copy of the 1024px source,
        # not a resize, so it needs no image library — and macOS runners have
        # none. Only the Android mipmaps need Pillow.
        run: python3 tools/configure.py

      # ios/project.yml hard-codes .../projects/Xcode26/raylib/bridge in its
      # header search path. That is upstream's folder name and the submodule is
      # pinned to a commit, so the path cannot move underneath us — but it WILL
      # break the day the submodule is bumped past a reorganisation. This turns
      # that into an obvious red step with an instruction, instead of a wall of
      # "IOSBridge.h not found" from clang.
      - name: Guard — the raylib-iOS bridge is where project.yml expects
        run: |
          BRIDGE=thirdparty/raylib-ios/projects/Xcode26/raylib/bridge/IOSBridge.h
          if [ ! -f "$BRIDGE" ]; then
            echo "FAIL: $BRIDGE is gone — the fork reorganised its projects/ layout."
            echo "Update HEADER_SEARCH_PATHS in ios/project.yml. Found instead:"
            find thirdparty/raylib-ios/projects -name '*.h' | head -20
            exit 1
          fi
          echo "PASS: bridge header present"

      - name: Build raylib.xcframework (device + simulator)
        run: |
          cd thirdparty/raylib-ios/projects/scripts
          chmod +x build-ios-xcframework.sh
          ./build-ios-xcframework.sh

      - name: Install XcodeGen (pinned)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/xcodegen.zip \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          if [ -n "$XCODEGEN_SHA256" ]; then
            echo "${XCODEGEN_SHA256}  /tmp/xcodegen.zip" | shasum -a 256 -c -
          else
            echo "::warning::xcodegen sha256 not pinned; observed $(shasum -a 256 /tmp/xcodegen.zip | cut -d' ' -f1)"
          fi
          unzip -o -q /tmp/xcodegen.zip -d /tmp/xcodegen-dist
          # Keep the bin/ + share/ layout: xcodegen resolves its SettingPresets
          # relative to the binary, so a bare copy of bin/xcodegen breaks.
          echo "/tmp/xcodegen-dist/xcodegen/bin" >> "$GITHUB_PATH"
          /tmp/xcodegen-dist/xcodegen/bin/xcodegen --version

      - name: Generate Xcode project
        run: cd ios && xcodegen generate

      # Explicit derived-data path so the .app has one known location, instead
      # of being hunted for with `find` across ~/Library/Developer.
      - name: Build app (simulator, no signing)
        run: |
          cd ios
          xcodebuild -project ${{ inputs.project_name }}.xcodeproj -scheme ${{ inputs.project_name }} \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ./dd \
            CODE_SIGNING_ALLOWED=NO build

      - name: Test (static) — xcframework + .app bundle exist
        run: |
          set -e
          test -d thirdparty/raylib-ios/raylib.xcframework || { echo "FAIL: raylib.xcframework missing"; exit 1; }
          APP=ios/dd/Build/Products/Debug-iphonesimulator/${{ inputs.project_name }}.app
          test -d "$APP" || { echo "FAIL: $APP not built"; ls -R ios/dd/Build/Products || true; exit 1; }
          test -x "$APP/${{ inputs.project_name }}" || { echo "FAIL: app binary missing"; exit 1; }
          file "$APP/${{ inputs.project_name }}" | grep -qi "Mach-O" || { echo "FAIL: not Mach-O"; exit 1; }

          # `simctl install` says "Missing bundle ID" both for a malformed
          # bundle and for a simulator that failed to boot, which is not a
          # useful distinction at 2am. Rule out the bundle here, where the
          # error can actually name the problem.
          test -f "$APP/Info.plist" || { echo "FAIL: no Info.plist in the .app"; ls -la "$APP"; exit 1; }
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist") \
            || { echo "FAIL: Info.plist has no CFBundleIdentifier"; plutil -p "$APP/Info.plist"; exit 1; }
          echo "bundle id: $BUNDLE_ID"

          # The assets fix: resources/ must actually be inside the bundle.
          test -d "$APP/resources" || { echo "FAIL: resources/ not copied into the .app"; ls -la "$APP"; exit 1; }
          ls "$APP/resources"

          echo "APP_PATH=$APP"   >> "$GITHUB_ENV"
          echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"
          echo "PASS: iOS artifact checks ($APP)"

      # Runtime coverage. Until now iOS only proved a Mach-O file existed on
      # disk — the app was never once started. The simulator on these runners is
      # Apple Silicon with real Metal, and the app links ANGLE (ES3 over Metal),
      # which is what makes this possible at all; plain GL ES in the simulator
      # is dead.
      #
      # DISABLED by default. Set the repository variable IOS_SIMULATOR_TEST=true
      # to turn it back on.
      #
      # It is gated rather than deleted, and gated rather than made
      # continue-on-error, on purpose. `continue-on-error` is what let this step
      # report green through two separate failures, which is the exact defect
      # this pipeline exists to remove — a disabled test is honest, a lying test
      # is not.
      #
      # What is actually wrong: the simulator on macos-26 will not come up.
      # `simctl bootstatus` ends at Status=4294967295 (-1) and the install then
      # fails with IXErrorDomain code=13 "Missing bundle ID" — which is
      # misleading, because the bundle is fine. The static step above proves it:
      # Info.plist is present, CFBundleIdentifier reads back as
      # com.example.raytest, and the build log shows
      # `CpResource ... ray_test.app/resources`.
      #
      # Already ruled out: the missing GNU `timeout` on macOS (fixed), and
      # first-boot Data Migration from `simctl create` (now reusing a pre-baked
      # device, which boots in 1m22s instead of 4m14s — and still ends at -1).
      # Next thing to try is driving it through `xcodebuild test` with a real
      # test target rather than raw simctl.
      - name: Test (runtime) — boot in the iOS Simulator
        if: vars.IOS_SIMULATOR_TEST == 'true'
        run: |
          set -euo pipefail
          # Use a simulator the runner image already created, rather than
          # `simctl create`. A freshly created device runs first-boot Data
          # Migration, which took over four minutes and then ended in
          # Status=4294967295 — after which `simctl install` fails with a
          # misleading "Missing bundle ID". The pre-baked devices are already
          # migrated and boot in seconds.
          UDID=$(xcrun simctl list devices available -j | jq -r '
            first(.devices | to_entries[]
                  | select(.key | test("iOS"))
                  | .value[]
                  | select(.isAvailable and (.name | test("iPhone")))
                  | .udid)')
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            echo "FAIL: no available iPhone simulator on this runner"
            xcrun simctl list devices available
            exit 1
          fi
          echo "simulator: $UDID"
          xcrun simctl list devices available | grep -m1 "$UDID" || true

          trap 'xcrun simctl shutdown "$UDID" >/dev/null 2>&1 || true' EXIT
          xcrun simctl boot "$UDID" || true      # already-booted is not an error
          xcrun simctl bootstatus "$UDID" -b

          xcrun simctl install "$UDID" "$APP_PATH"
          echo "installed $BUNDLE_ID"

          # No `timeout` here: macOS does not ship GNU coreutils, so `timeout`
          # is simply not a command and the step dies with "command not found"
          # before simctl ever runs. Background the launch and poll instead.
          #
          # SIMCTL_CHILD_* forwards the variable into the app process. Without
          # the frame budget the app never exits — UIKit owns the run loop.
          : > /tmp/sim.log
          SIMCTL_CHILD_RAY_TEST_MAX_FRAMES=60 \
            xcrun simctl launch --console-pty "$UDID" "$BUNDLE_ID" >/tmp/sim.log 2>&1 &
          LAUNCH_PID=$!

          # 240s ceiling, but exit as soon as the app says it is done.
          for _ in $(seq 1 120); do
            grep -q "RAY_TEST_DONE_FRAMES" /tmp/sim.log && break
            kill -0 "$LAUNCH_PID" 2>/dev/null || break
            sleep 2
          done
          kill "$LAUNCH_PID" 2>/dev/null || true
          wait "$LAUNCH_PID" 2>/dev/null || true

          echo "--- simulator log ---"; cat /tmp/sim.log
          # texture=0x0 means the app booted but its assets are not in the
          # bundle — which is exactly what this test caught the first time
          # it ran, so assert the dimensions, not just the marker.
          grep -q "RAY_TEST_BOOT_OK assets_failed=0 " /tmp/sim.log \
            || { echo "FAIL: boot marker missing or assets not in the .app bundle"; exit 1; }
          grep -q "RAY_TEST_RENDER_OK" /tmp/sim.log || { echo "FAIL: render marker missing (blank frame?)"; exit 1; }
          echo "PASS: iOS simulator boot + render"

      - name: Package .app
        run: |
          set -e
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" ios-app-simulator.zip
          ls -la ios-app-simulator.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ios-raylib-xcframework
          path: thirdparty/raylib-ios/raylib.xcframework
          retention-days: 7

      # The release used to ship only the xcframework — a library, not the game.
      # This is the simulator build of the app itself; it is unsigned and NOT
      # installable on a device (that needs an Apple developer account).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ios-app-simulator
          path: ios-app-simulator.zip
          retention-days: 7
