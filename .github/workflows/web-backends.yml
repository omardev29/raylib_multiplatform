# Every [web] backend, built and checked that it is really the one asked for.
#
# WHY THIS IS ITS OWN WORKFLOW. raylib 6.0 offers three ways to reach the
# browser and the .toml can pick any of them, but the difference between them is
# invisible in the artefact list: all three produce a .html, a .js and a .wasm of
# roughly the same size, and all three boot. A build that silently fell back to
# GLFW would look exactly like a build that did what it was told — which is the
# same shape of bug as [linux] backend = "rgfw" with wayland = true quietly
# producing an X11 binary.
#
# So this does not test that web works — ci.yml does that. It tests that the
# CHOICE works, by looking for the fingerprint each backend leaves behind.
#
# Manual, and on changes to the files that can break it. It is not in the fast
# lane: three Emscripten builds cost more than the risk of a web-backend
# regression between two pushes that touch neither.

name: Web backends

on:
  workflow_dispatch:
  push:
    paths:
      - 'thirdparty/raylib/cmake/LibraryConfigurations.cmake'
      - 'CMakeLists.txt'
      - 'tools/configure.py'
      - 'raylib_multiplatform.toml'
      - '.github/workflows/web-backends.yml'

permissions:
  contents: read

jobs:
  backends:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    container:
      # The same digest every other container job pins. tools/versions_check.sh
      # fails if any two workflows disagree, or if this one drifts from
      # thirdparty/FROZEN_VERSIONS.md — so it cannot quietly become a different
      # emsdk from the one ci.yml builds with.
      image: 'ghcr.io/omardev29/raylib-build@sha256:a3b5bc2190612d99000e2048ef36e315b9a97f8dc9cca25e3e66dc96e604b670'
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # expect_define  what rcore.c must have compiled with
          # expect_glfw    whether Emscripten's GLFW-in-JavaScript shim should
          #                be linked. It is the whole point of the choice: if
          #                "emscripten" still pulls the shim in, the build did
          #                not do what the config said.
          - backend: glfw
            expect_define: PLATFORM_WEB
            expect_glfw: 'yes'
          - backend: emscripten
            expect_define: PLATFORM_WEB_EMSCRIPTEN
            expect_glfw: 'no'
          - backend: rgfw
            expect_define: PLATFORM_WEB_RGFW
            expect_glfw: 'no'
    steps:
      - name: Build image manifest
        run: cat /etc/raylib-build-image.json

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Select the backend
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, os
          want = os.environ["BACKEND"]
          p = pathlib.Path("raylib_multiplatform.toml")
          lines = p.read_text().splitlines()
          section = None
          changed = False
          for i, line in enumerate(lines):
              stripped = line.strip()
              if stripped.startswith("[") and "]" in stripped:
                  section = stripped[1:stripped.index("]")]
              elif section == "web" and re.match(r"^backend\s*=", stripped):
                  lines[i] = f'backend = "{want}"'
                  changed = True
          assert changed, "no [web] backend line to set — did the .toml change shape?"
          p.write_text("\n".join(lines) + "\n")
          PY
          python3 tools/configure.py --check
        env:
          BACKEND: ${{ matrix.backend }}

      - name: Configure
        run: cmake --preset web 2>&1 | tee configure.log

      # The CMake message is the cheap half of the check, and on its own it
      # proves only that our branch ran — not that raylib compiled with it.
      - name: The configure step said the right thing
        run: |
          set -euo pipefail
          grep -q "WEB BACKEND" configure.log || {
            echo "FALLA: no WEB BACKEND line in the configure output"; exit 1; }
          grep "WEB BACKEND" configure.log

      - name: Build
        run: cmake --build --preset web

      # The half that cannot be faked: what rcore.c was actually compiled with.
      # compile_commands.json is generated by the preset, so this reads the real
      # command line rather than re-deriving what it should have been.
      - name: raylib really compiled with ${{ matrix.expect_define }}
        run: |
          set -euo pipefail
          DB=build/web/compile_commands.json
          test -f "$DB" || { echo "FALLA: no $DB"; exit 1; }
          CMD=$(python3 - "$DB" <<'PY'
          import json, sys
          db = json.load(open(sys.argv[1]))
          for entry in db:
              if entry["file"].endswith("rcore.c"):
                  print(entry.get("command") or " ".join(entry["arguments"]))
                  break
          else:
              raise SystemExit("no rcore.c entry in compile_commands.json")
          PY
          )
          echo "$CMD" | tr ' ' '\n' | grep -E '^-D(PLATFORM|GRAPHICS)' | sort || true
          if ! echo "$CMD" | grep -q -- "-D${{ matrix.expect_define }}"; then
            echo "FALLA: rcore.c was not compiled with -D${{ matrix.expect_define }}"
            echo "       [web] backend = ${{ matrix.backend }} did not reach raylib."
            exit 1
          fi
          # And that it is not compiled with a SECOND platform define, which is
          # how a stale cache announces itself.
          COUNT=$(echo "$CMD" | tr ' ' '\n' | grep -cE '^-DPLATFORM_(WEB|DESKTOP|DRM|ANDROID|MEMORY)' || true)
          if [ "$COUNT" -ne 1 ]; then
            echo "FALLA: $COUNT platform defines on rcore.c, expected exactly 1"; exit 1
          fi
          echo "  ok    -D${{ matrix.expect_define }}, and it is the only one"

      # The GLFW shim is the thing you are choosing to keep or drop, so it is
      # the thing worth asserting. Emscripten emits the shim's symbols into the
      # .js glue when -sUSE_GLFW=3 is linked, and leaves them out when it is not.
      - name: The GLFW shim is ${{ matrix.expect_glfw == 'yes' && 'linked' || 'absent' }}
        run: |
          set -euo pipefail
          NAME=$(python3 tools/configure.py --print-name)
          JS="build/web/${NAME}.js"
          test -s "$JS" || { echo "FALLA: no $JS"; exit 1; }
          if grep -qE '_glfw|GLFW_' "$JS"; then FOUND=yes; else FOUND=no; fi
          echo "  GLFW symbols in the glue: $FOUND (expected ${{ matrix.expect_glfw }})"
          if [ "$FOUND" != "${{ matrix.expect_glfw }}" ]; then
            echo "FALLA: expected the GLFW shim to be ${{ matrix.expect_glfw }}."
            if [ "${{ matrix.expect_glfw }}" = "no" ]; then
              echo "       backend = ${{ matrix.backend }} is supposed to talk to the"
              echo "       browser without it, so linking it means -sUSE_GLFW=3 is"
              echo "       still being passed — see RMP_WEB_GLFW_FLAG in CMakeLists.txt."
            fi
            exit 1
          fi

      # Not a gate, a measurement. The reason to drop GLFW is size and one less
      # layer, and this is where that claim becomes a number instead of a hope.
      - name: Sizes
        run: |
          set -euo pipefail
          NAME=$(python3 tools/configure.py --print-name)
          cd build/web
          printf '%-12s %10s %10s %10s\n' backend wasm js html
          printf '%-12s %10s %10s %10s\n' "${{ matrix.backend }}" \
            "$(stat -c%s "$NAME.wasm")" "$(stat -c%s "$NAME.js")" "$(stat -c%s "$NAME.html")"
