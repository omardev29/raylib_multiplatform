# Orchestrator. This is the only workflow you normally read or edit.
#
#   push / pull_request  ->  fast lane: Linux x64, Web, Android, Windows x64
#                            (none at all with [ci] on_push = false in the .toml)
#   tag v*               ->  all 17 targets, then Release and itch.io
#   workflow_dispatch    ->  either, via the `full` input
#
# Why a fast lane: the full matrix spends about an hour of BSD QEMU and macOS
# runner time. Paying that on every commit means either a slow loop or (much
# worse) people learning to ignore CI. The subset below covers the four targets
# that catch most regressions, in about ten minutes.
#
# Every platform lives in its own `_*.yml` reusable workflow. Three things
# routinely go wrong when splitting workflows this way, so they are worth
# stating once:
#
#   1. Workflow-level `env` does NOT cross the `workflow_call` boundary. That is
#      why PROJECT_NAME is passed as an input to every leaf instead of being an
#      `env` here — otherwise the leaves silently build paths like `.exe` off an
#      empty string.
#   2. Called workflows get no secrets unless you say `secrets: inherit`. Miss it
#      and the signing / butler / GCP steps all quietly take their "not
#      configured, skipping" branch and the pipeline looks green.
#   3. `concurrency` belongs HERE and nowhere else. Repeat it in the leaves and
#      the parent and its children start cancelling each other.

name: CI

on:
  # BEGIN generated by tools/configure.py from [ci] on_push: edit the .toml, not this block
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'LICENSE']
  # END generated from [ci] on_push
  workflow_dispatch:
    inputs:
      full:
        description: 'Build all 17 targets (default: fast lane only)'
        type: boolean
        default: false
      targets:
        description: 'Only this group or target, e.g. drm or macos (blank = every enabled target)'
        type: string
        default: ''
      image_digest:
        description: 'Override the build image, e.g. ghcr.io/…@sha256:… (blank = the pinned one)'
        type: string
        default: ''

# Superseded runs on a branch are wasted minutes, but a tag build is a release
# artifact — never cancel one of those out from under itself.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  # Single source of truth for everything the leaves need to agree on.
  config:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      # Everything downstream agrees on these. The project's own values come
      # from raylib_multiplatform.toml, so there is no second place to rename.
      project_name: ${{ steps.o.outputs.project_name }}
      # 'true' in the framework's own repository, 'false' in a game made with
      # `rmp new`. This file is the same in both, byte for byte; what a game
      # does not have -- the framework's tests, examples and lint gates -- is
      # skipped by this, never by an edit to a copy.
      framework: ${{ steps.o.outputs.framework }}
      targets: ${{ steps.o.outputs.targets }}
      families: ${{ steps.o.outputs.families }}
      bsd_matrix: ${{ steps.o.outputs.bsd_matrix }}
      build_image: ${{ steps.o.outputs.build_image }}
      full: ${{ steps.o.outputs.full }}
      version: ${{ steps.o.outputs.version }}
      itch_user: ${{ steps.o.outputs.itch_user }}
      itch_game: ${{ steps.o.outputs.itch_game }}
      firebase_project: ${{ steps.o.outputs.firebase_project }}
      firebase_device: ${{ steps.o.outputs.firebase_device }}
      # The Apple and Windows pins, straight out of thirdparty/FROZEN_VERSIONS.md
      # via --print-pins. They are outputs rather than defaults in the callees
      # because a `default:` in a reusable workflow is a second place a version
      # lives, and versions_check.sh cannot compare a number it does not know
      # about -- which is how xcode, ninja and mesa drifted out of the frozen
      # block's reach in the first place.
      macos_runner: ${{ steps.o.outputs.macos_runner }}
      xcode: ${{ steps.o.outputs.xcode }}
      ninja_mac: ${{ steps.o.outputs.ninja_mac }}
      ninja_mac_sha256: ${{ steps.o.outputs.ninja_mac_sha256 }}
      xcodegen: ${{ steps.o.outputs.xcodegen }}
      xcodegen_sha256: ${{ steps.o.outputs.xcodegen_sha256 }}
      windows_runner: ${{ steps.o.outputs.windows_runner }}
      mesa: ${{ steps.o.outputs.mesa }}
      mesa_sha256: ${{ steps.o.outputs.mesa_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - id: o
        env:
          # The one place the image pin lives. Bump it from the run summary of
          # the raylib-build-image repo. Pinned by DIGEST, never by tag: a tag
          # can be moved, so `:latest` would let an unrelated rebuild silently
          # change what every Linux job compiles with.
          PINNED_IMAGE: 'ghcr.io/omardev29/raylib-build@sha256:271bb12e4c57208969c55e95d6dcf00822677472d256d5b44a247d8b3c11c02f'
          OVERRIDE: ${{ inputs.image_digest }}
          # Through the environment and never interpolated into the script: this
          # one is a free-text box on a web page, and `${{ }}` inside a `run:`
          # is string substitution before bash ever sees it.
          ONLY: ${{ inputs.targets }}
        run: |
          set -euo pipefail
          echo "build_image=${OVERRIDE:-$PINNED_IMAGE}" >> "$GITHUB_OUTPUT"
          # Asking for one family means you want that family built, so it
          # implies the full lane -- otherwise `-f targets=drm` would resolve to
          # drm and then be filtered out again by every `inputs.full` gate.
          if [ "${{ github.ref_type }}" = "tag" ] || [ "${{ inputs.full }}" = "true" ] || [ -n "${ONLY:-}" ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

          # The framework, or a game. Anything but those two words stops the
          # run here: a job gated on a value nobody checked is a job that
          # quietly never runs.
          MODE=$(python3 tools/rmp.py --mode)
          case "$MODE" in
            framework) echo "framework=true" >> "$GITHUB_OUTPUT" ;;
            game) echo "framework=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "FAIL: tools/rmp.py --mode said '$MODE', not framework or game"; exit 1 ;;
          esac
          echo "mode: $MODE"

          # A game's tag is a release, and a release under a placeholder id is
          # one nobody can take back: Google Play keeps an application id
          # forever, and `rmp new` writes com.example.* ids. `rmp deploy`
          # refuses them before it tags; this refuses a tag pushed by hand.
          # The framework's own demo keeps com.example.raytest on purpose: no
          # store ever gets it, and every game starts from it.
          if [ "${{ github.ref_type }}" = "tag" ] && [ "$MODE" = game ]; then
            python3 tools/configure.py --check --strict-release
          fi

          # Read once here, so every leaf gets the same answer and no workflow
          # has to learn to parse TOML.
          # --only narrows; it can never add. configure.py rejects a name that
          # is not a target or a group, and rejects one whose targets are all
          # switched off in the .toml, so a workflow input cannot build
          # something the project has turned off.
          # ${NARROW:+"$NARROW"} and not a bare $NARROW: the flag is either one
          # argument or NO argument, and an unquoted empty variable is the only
          # spelling of "no argument" a shell has -- which is also SC2086, now
          # that the image ships shellcheck and actionlint runs it. The :+ form
          # says the same thing without the warning: nothing at all when unset,
          # exactly one quoted word when set.
          NARROW=""
          if [ -n "${ONLY:-}" ]; then NARROW="--only=${ONLY}"; fi
          {
            echo "project_name=$(python3 tools/configure.py --print-name)"
            echo "targets=$(python3 tools/configure.py --print-targets ${NARROW:+"$NARROW"})"
            echo "families=$(python3 tools/configure.py --print-families ${NARROW:+"$NARROW"})"
            echo "bsd_matrix=$(python3 tools/configure.py --print-matrix bsd ${NARROW:+"$NARROW"})"
            python3 tools/configure.py --print-deploy
            # The pins the Apple and Windows jobs build with. They live in
            # thirdparty/FROZEN_VERSIONS.md and are read ONCE, here, so that
            # `_apple.yml` and `_windows.yml` carry no version of their own --
            # a default in a callee is a second source of truth that nothing
            # compares against the first one.
            python3 tools/configure.py --print-pins
          } >> "$GITHUB_OUTPUT"
          python3 tools/configure.py --print-targets ${NARROW:+"$NARROW"} | sed 's/^/targets: /'

  # Cheap, fast, and catches the class of mistake that otherwise only shows up
  # on a tag: a typo'd input name in a reusable workflow, or pins that have
  # drifted apart across files.
  lint:
    needs: config
    runs-on: ubuntu-24.04
    # 15, not 10: the unit tests, the layout test and the render check are
    # instrumented by ASan and UBSan now (several times slower), and the gcc
    # build of the unit tests follows them. It took 5m25s before that.
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    # In a game made with `rmp new` this job is actionlint, the configuration,
    # the pins, the licences and a software-rendered frame. Every other step
    # is the framework checking itself -- its tests, its gates over its own
    # sources -- and is gated on `framework`: a game does not carry those files.
    #
    # In the image, like every other Linux job. It used to be a bare runner that
    # apt-got raylib's dependencies, pip-installed clang and downloaded
    # actionlint — three chances for a bad network day to fail a job that only
    # reads files. See CLAUDE.md: a Linux job downloads nothing.
    container:
      image: ${{ needs.config.outputs.build_image }}
    defaults:
      run:
        # Container jobs default to `sh -e {0}`, which has no `pipefail`.
        shell: bash
    steps:
      - name: Build image manifest
        run: cat /etc/raylib-build-image.json

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The checkout belongs to the runner's user and this container runs as
      # root, and git answers nothing about a repository somebody else owns
      # until it is told the folder is safe. rmp new reads the framework's
      # index, and so do its tests.
      - name: git trusts the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: actionlint
        run: |
          set -euo pipefail
          # actionlint runs shellcheck over every `run:` block IF shellcheck is
          # on PATH, and SAYS NOTHING when it is not -- so the day the image
          # loses it, this step keeps printing PASS having checked half of what
          # it used to. That is the RAY_TEST_BOOT_OK failure mode again: a gate
          # that cannot fail. Assert the dependency instead of hoping for it.
          command -v shellcheck >/dev/null || {
            echo "FAIL: shellcheck is not on PATH, so actionlint would silently"
            echo "       skip every shell check in every run: block. It ships in"
            echo "       the build image; if this fired, the image drifted."
            exit 1; }
          shellcheck --version | sed -n '2p'
          # No file arguments: actionlint finds .github/workflows itself. An
          # explicit glob breaks the moment an extension stops being used —
          # `*.yaml` matched nothing once build.yaml was split up, and the shell
          # passed the literal pattern straight through as a filename.
          actionlint -color
          echo "PASS: actionlint clean (with shellcheck)"

      # What actionlint cannot see: it reads one file at a time, so a reusable
      # workflow asking for a permission its caller does not grant sails past
      # it — and GitHub answers that with a startup_failure, a run with zero
      # jobs and no logs to read.
      - name: The workflows agree with each other
        if: needs.config.outputs.framework == 'true'
        run: bash tools/workflow_check.sh

      # No dependency step: the image has raylib's X11/GL/Wayland headers, ninja,
      # and the pinned clang tooling. That step existed because this job used to
      # run on a bare runner and `cmake --preset debug` died on GLFW's
      # find_package(X11).

      - name: Generate configuration
        run: python3 tools/configure.py

      # clang-format and clang-tidy come from the image, at the version
      # FROZEN_VERSIONS.md declares — versions_check.sh below is what makes the
      # two agree, and it fails if the image drifts from the pin. A different
      # patch version of clang-format reformats files that were already correct,
      # which would fail this job for a reason unrelated to the change.
      - name: The clang tooling the image carries
        if: needs.config.outputs.framework == 'true'
        run: |
          set -euo pipefail
          clang-format --version
          clang-tidy --version | head -2

      - name: Pinned versions agree
        run: bash tools/versions_check.sh

      # configure.py decides what gets built at all, and its versionCode
      # arithmetic has a consequence that cannot be taken back: Google Play
      # refuses an upload whose code is not higher than the last one, forever.
      # Everything else in tests/ checks the code that runs after this script.
      - name: tools/configure.py
        if: needs.config.outputs.framework == 'true'
        # discover, not the file directly: running the file executes
        # unittest.main() at whatever line it happens to be on, so anything
        # defined after it is silently not collected. The image carries
        # clang-tidy and cppcheck, so the tests of their rules may not skip here.
        env:
          RMP_REQUIRE_CLANG_TIDY: "1"
          RMP_REQUIRE_CPPCHECK: "1"
        run: python3 -m unittest discover -s tests -p 'configure_test.py' -v

      # `rmp` itself: every command's page, the push and deploy refusals
      # against a real git, the launchers under every shell the image has.
      - name: rmp itself
        if: needs.config.outputs.framework == 'true'
        run: python3 -m unittest discover -s tests -p 'rmp_test.py' -v

      # tools/binary_check.py judges what the Windows and macOS jobs ship, on
      # runners where nothing else would notice a DLL the player lacks or a
      # macOS the player does not have. Its readers are tested here against
      # binaries built byte by byte, the shapes that were shipped broken among
      # them, so the gate is seen red before it is trusted green.
      - name: The binary readers
        if: needs.config.outputs.framework == 'true'
        run: python3 -m unittest discover -s tests -p 'binary_check_test.py' -v

      # tools/size_budget.txt, on every push: well-formed, a line for every
      # binary an enabled target ships, the packed column exactly where [upx]
      # packs. Every release job holds its binary to its line; this notices a
      # missing line before the full matrix does. A game has no budget until
      # it commits one, and this says so instead of failing.
      - name: Every shipped binary has a size budget
        run: python3 tools/size_check.py --check-file

      # The reader behind those steps, against files made here: a byte over
      # the budget, a stale line, a missing one, a malformed one, a CI log.
      - name: The size budget's reader
        if: needs.config.outputs.framework == 'true'
        run: python3 -m unittest discover -s tests -p 'size_check_test.py' -v

      # Time, input and randomness enter through a seam so that headless tests
      # can replace them. One stray GetFrameTime() in the wrong file is enough
      # to make a test flaky, and a flaky test teaches everyone to ignore red.
      # Two grep rules over src/rmp/: nothing reads the clock, input or
      # randomness on its own, and no shadowed raylib type is written without
      # `::`. The second one exists because it cost a link error on exactly one
      # of the seventeen targets.
      - name: The seam holds
        if: needs.config.outputs.framework == 'true'
        run: bash tools/seam_check.sh

      # Two promises in one compile, per public header: it works when included
      # ALONE, and it reaches the .toml values. The second is what lets the user
      # never type #include <rmp/config.h> — and it is the kind of promise that
      # breaks silently, because a new header that forgets it just hands
      # somebody an undefined macro in a file that looks like every other file.
      - name: Every public header stands alone
        if: needs.config.outputs.framework == 'true'
        run: bash tools/header_check.sh

      # What each public header costs to include, in preprocessed lines against
      # the budget written inside this same image. <memory> was allowed into
      # the headers on purpose and measured; a header that quietly starts
      # pulling <functional> or <regex> into every game is what this catches.
      - name: No public header grew past its budget
        if: needs.config.outputs.framework == 'true'
        run: bash tools/header_cost_check.sh

      # No owning raw pointer under include/rmp/ or src/rmp/: new, delete,
      # malloc and free are allowed in exactly two files, both speaking
      # raylib's C loader contract. And no raylib Load*/Unload* outside the six
      # files that own what it makes, in the framework and the examples: a
      # LoadTexture goes inside the rmp::Texture that frees it. Both lists only
      # shrink.
      - name: The framework owns nothing by hand
        if: needs.config.outputs.framework == 'true'
        run: bash tools/ownership_check.sh

      # No raw pointer and no C string in a declaration a game can name: clang
      # reads every public header's AST, and a `T *` or a `const char *` in a
      # public return, parameter, field or alias fails with its file and line.
      # detail and private ones are listed in tools/pointer_ratchet.txt with
      # their reasons, and that list only shrinks. The image has clang, so a
      # skip here would be a green that read nothing: RMP_REQUIRE_CLANG.
      - name: The public API holds no raw pointer
        if: needs.config.outputs.framework == 'true'
        env:
          RMP_REQUIRE_CLANG: "1"
        run: |
          python3 tools/pointer_check.py
          python3 -m unittest discover -s tests -p 'pointer_check_test.py' -v

      # The Linux jobs have GNU everything, so they are exactly the wrong place
      # to notice that a script only works with GNU everything. `mapfile` was in
      # the tree and would have died on every Mac — bash 4 against macOS's 3.2 —
      # and nothing here would have said so. The macOS job runs `rmp test
      # config` under /bin/bash 3.2 now, but that stage reaches only the
      # scripts it calls; this reads all of them.
      - name: The scripts run off GNU too
        if: needs.config.outputs.framework == 'true'
        run: bash tools/portable_check.sh

      # `A && B || C` is not if/then/else: when A succeeds and B fails, C runs
      # as well. shellcheck's SC2015 only sees a couple of degenerate shapes,
      # and every occurrence this repository has shipped was of a shape it says
      # nothing about -- it was written, fixed, and then written again in seven
      # more places. actionlint above does not catch it; this does.
      - name: No `A && B || C`
        if: needs.config.outputs.framework == 'true'
        run: bash tools/shell_pattern_check.sh

      # clang-tidy checks the names it parsed, and it parses one branch of
      # every #if: web, iOS, Android and Windows code is invisible to it. It
      # cannot see `foo_.x` (a use, not a declaration), nor a constant called
      # PI, which is raylib's macro, nor `#if APP_X` after APP_X was renamed --
      # not an error but 0. This reads every branch as text.
      - name: Names follow the convention
        if: needs.config.outputs.framework == 'true'
        run: bash tools/naming_check.sh

      # The style guide's rules that clang-tidy cannot see, over every #if
      # branch as text: no C cast (one sat in the Android branch of an example,
      # where no Linux lint run reaches), no NULL, no TODO, nothing newer than
      # NetBSD's GCC 10.5 in what a game compiles, no user-defined literal, and
      # `++i` where the old value is not read.
      - name: Style holds where clang-tidy cannot see
        if: needs.config.outputs.framework == 'true'
        run: bash tools/style_check.sh

      # A `git add -A` once committed 78 files of a CMake build directory, and
      # they went unnoticed for sessions because .gitignore listed `build/` and
      # the directory was called `build-memory/`. Ignore rules do not apply to
      # what git already tracks, so the index is what has to be checked.
      - name: The repository tracks sources, not build output
        if: needs.config.outputs.framework == 'true'
        run: bash tools/repo_check.sh

      # Every vendored component, down to what raylib bundles, has a licence we
      # can ship under, its notice is where THIRD_PARTY_LICENSES.md says it is,
      # and every copy we altered is marked -- the zlib licence requires that
      # and the README used to say the opposite. Copyleft and unknown fail.
      - name: Every licence is known and every alteration marked
        run: python3 tools/license_db.py --check

      # doctest. No window, no GPU, milliseconds.
      #
      # Twice: once in declaration order, once shuffled with a fixed seed. A
      # suite whose answer depends on the order it runs in is hiding state that
      # leaks between cases, and this caught one -- a raycast that broke
      # distance ties by object pointer, so the winner depended on where malloc
      # had put things, which depended on what had run before it.
      #
      # Under ASan and UBSan, like every Debug build of the framework, and
      # RMP_REQUIRE_SANITIZERS makes a configure that could not instrument it
      # fail instead of warning: a gate that quietly stopped instrumenting is
      # a gate that passes by not looking.
      - name: Unit tests
        if: needs.config.outputs.framework == 'true'
        env:
          RMP_REQUIRE_SANITIZERS: "1"
        run: |
          set -euo pipefail
          # RMP_WERROR: a warning in the framework or its tests is an error
          # here, as it is in `rmp test unit`.
          cmake --preset debug -DBUILD_TESTS=ON -DRMP_WERROR=ON > /dev/null
          cmake --build --preset debug --target unit_test > /dev/null
          # The locale tests and the audio device tests skip where they cannot
          # run -- on a laptop that is honest, here it would be a gate that
          # passes by not looking. Both are required in this job: the locales
          # are built from tests/fixtures/locale/, and the device is miniaudio's
          # null backend, which the image has.
          bash tools/test_locales.sh build/test-locales
          export LOCPATH="$PWD/build/test-locales"
          export RMP_REQUIRE_TEST_LOCALES=1
          export RMP_REQUIRE_AUDIO_DEVICE=1
          ./build/debug/unit_test
          ./build/debug/unit_test --order-by=rand --rand-seed=1337 --test-suite-exclude="audio: device"

      # The same unit tests built with AddressSanitizer and UndefinedBehavior-
      # Sanitizer, every report fatal. A test asserts what it can see, and UB
      # is what it cannot: the LDtk reader reached its first review with a
      # signed overflow, float casts past INT_MAX and a read off the end of a
      # vector, every one under a passing test. The step above is that, with
      # clang; this is the second compiler, gcc, which the script pins.
      - name: Unit tests under ASan and UBSan
        if: needs.config.outputs.framework == 'true'
        run: |
          set -euo pipefail
          export LOCPATH="$PWD/build/test-locales"
          export RMP_REQUIRE_TEST_LOCALES=1
          bash tools/sanitize_check.sh

      # The headless UI layout assertions: four resolutions, no window, no GPU,
      # and the thing phases 1-4 of the UI architecture are gated on. It was
      # CONFIGURED in this job (the clang-tidy step's preset turns
      # BUILD_UI_TESTS on so the file gets a real compile_commands.json entry)
      # and never built or run -- so for four phases it ran on developer
      # machines only. StagesAgreeWithLintTest in tests/rmp_test.py is what
      # stops a stage of `rmp test` existing in one place and not the other.
      - name: UI layout tests (headless)
        if: needs.config.outputs.framework == 'true'
        env:
          RMP_REQUIRE_SANITIZERS: "1"
        run: |
          set -euo pipefail
          cmake --preset debug -DBUILD_UI_TESTS=ON > /dev/null
          cmake --build --preset debug --target ui_layout_test > /dev/null
          ./build/debug/ui_layout_test

      # A game's own tests: tests/game/, built with its src/ into game_test and
      # run with no window -- `rmp test unit` in a game. `rmp new` writes one,
      # for the main menu; a game that deletes the folder has none, and this
      # says so instead of failing. The framework always has it: it is the copy
      # every game starts from, run here against the demo game in src/.
      - name: The game's own tests (tests/game/)
        run: |
          set -euo pipefail
          if ! compgen -G 'tests/game/*.cpp' > /dev/null; then
            if [ "$(python3 tools/rmp.py --mode)" = framework ]; then
              echo "FAIL: tests/game/ has no test, and every game is made from it"
              exit 1
            fi
            echo "  skip  no tests/game/*.cpp: this game has no tests of its own"
            exit 0
          fi
          cmake --preset debug -DBUILD_TESTS=ON > /dev/null
          cmake --build --preset debug --target game_test > /dev/null
          ./build/debug/game_test

      # raylib's SOFTWARE renderer: no GPU, no window, no display server, and
      # therefore the same pixels on every operating system — there is no
      # driver in between to differ. That is what turns the frame hash from a
      # note into an assertion: the other render gates only prove that
      # SOMETHING was drawn, this one proves the same thing was drawn.
      #
      # It needs none of the X11 packages installed above, which is the point.
      #
      # WHY IT LIVES IN THE LINT JOB, which is a fair thing to ask: this job is
      # in the FAST LANE, so the golden hash is checked on every push instead of
      # only on the twenty-minute matrix. A pixel-identity gate that runs twice
      # a week is not a gate. The oddity was that it was the ONLY place software
      # rendering was used at all — the five BSDs and macOS now run it too, in
      # their own jobs, which is where it earns the most: those targets used to
      # prove only that they compile.
      #
      # Through tools/render_check.sh, which is the SAME script the five BSD
      # jobs, the macOS job and `rmp test render` run. This step used to be a
      # second copy of the assertion, and the copy was weaker: it checked
      # RENDER_OK and the hash but not RAY_TEST_BOOT_OK and not
      # RAY_TEST_DONE_FRAMES, so a process that died on its way out passed here
      # and failed on FreeBSD. One assertion, one place.
      #
      # A Debug build, so the framework's is instrumented, and a LeakSanitizer
      # report at exit fails it. In a game it is whatever [dev] sanitize says,
      # [] unless the game asked: RMP_REQUIRE_SANITIZERS requires what the
      # .toml lists, and nothing more.
      - name: Render (software, no GPU)
        env:
          RMP_REQUIRE_SANITIZERS: "1"
        run: |
          set -euo pipefail
          sh tools/render_check.sh Ninja "" "$(python3 tools/configure.py --print-name)"

      # Formatting first: it is instant, and an unformatted file makes every
      # other diff in the pull request unreadable.
      - name: Everything we own is formatted
        if: needs.config.outputs.framework == 'true'
        run: |
          set -euo pipefail
          FAILED=0
          for f in $(find include src tests examples \( -name '*.h' -o -name '*.cpp' -o -name '*.c' \) \
                       | grep -v generated | sort); do
            clang-format "$f" | diff -q "$f" - >/dev/null || { echo "  unformatted  $f"; FAILED=1; }
          done
          [ "$FAILED" -eq 0 ] || { echo "FAIL: run \`rmp fmt\` and commit the result."; exit 1; }
          echo "PASS: clang-format clean"

      # clang-tidy needs a compile database, so the project is CONFIGURED here
      # but never built -- the database is a by-product of configuring and
      # costs a couple of seconds.
      # src/, tests/ and examples/ -- examples with their own .clang-tidy:
      # the framework's names and every bug-finding check, without the
      # modernize/readability ones. Against build/lint, a configure-only
      # preset, and failing on any file that has no compile command, because
      # clang-tidy would otherwise guess its flags. Same script as `rmp lint`.
      - name: clang-tidy
        if: needs.config.outputs.framework == 'true'
        run: bash tools/lint.sh

      # The second static analyser: cppcheck reads src/rmp with its own value
      # flow, not clang's, and found what clang-tidy had let through -- a
      # struct nothing used, an unsigned count tested for `<= 0`. Zero
      # findings; what is not a bug is suppressed inline with its reason, and
      # a suppression that matches nothing fails too. It ships in the image,
      # so a missing cppcheck here is a failure, not a skip.
      - name: cppcheck
        if: needs.config.outputs.framework == 'true'
        env:
          RMP_REQUIRE_CPPCHECK: "1"
        run: bash tools/cppcheck_check.sh

  # examples/ is documentation with code in it, and documentation rots quietly.
  # It already has, twice: the header unification removed the `inlining` macro
  # and one example kept using it for weeks; and then this job ran
  # `g++ -fsyntax-only` for months over six games of which four did not work —
  # a ball that never moved, a formation that never marched. A file that parses
  # is not a game that plays. So every example is BUILT and BOOTED here, under
  # raylib's software renderer, with the same boot and render gate the game
  # passes, and a screenshot of each one is uploaded to be looked at.
  #
  # Its own job, on its own runner, for two reasons: it is the check most likely
  # to grow (there is no reason not to write more examples), and nobody wants it
  # on the critical path of the build they are waiting for. It also keeps it off
  # developers' machines — `rmp test` does not run it by default. In the pinned
  # image like every other Linux job, so the compiler is the one CI ships with.
  examples:
    needs: config
    if: needs.config.outputs.framework == 'true'
    runs-on: ubuntu-24.04
    # 25, not 15: every example is a Debug build of the framework, so every
    # boot runs under ASan and UBSan, and the desktop smoke below builds raylib
    # once more with GLFW. It took 2m22s uninstrumented; locally the
    # instrumented `rmp test examples` takes about three times as long.
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.config.outputs.build_image }}
    defaults:
      run:
        shell: bash
    # Every build in this job is a Debug build of the framework, instrumented
    # by [dev] sanitize; one that could not be is a failure here, not a
    # warning in a log.
    env:
      RMP_REQUIRE_SANITIZERS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The examples include <rmp/app.h>, which pulls in the generated
      # rmp/config.h.
      - name: Generate configuration
        run: python3 tools/configure.py

      # Shape, build, boot: the script asserts the count of examples it found
      # against the count it built and the count it ran, so a glob that stops
      # matching cannot look like a folder where everything passes.
      - name: Build and boot every example (software renderer)
        run: bash tools/examples_build.sh

      # The game on a real window system: GLFW over X11 on Xvfb, Mesa's
      # llvmpipe for GL -- the libraries LeakSanitizer would report if they
      # kept memory at exit, which is where a suppression in
      # cmake/sanitizer_hooks.c would have to be proven. Every other boot in
      # CI is raylib's software renderer, which links none of them.
      - name: Smoke on X11 and Mesa (xvfb)
        run: xvfb-run -a ./rmp test smoke

      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: example-screenshots
          path: build/examples-check/screenshots/
          if-no-files-found: warn

  # Every game starts as `rmp new`, and what it copies is a list in
  # tools/rmp.py. A file a game needs and the list leaves out is a game that
  # does not build -- and the framework never notices, because the framework
  # has the file. So a game is made from this commit, here, and has to pass
  # what its own CI runs: actionlint, the workflows agreeing with each other,
  # and its `rmp test` -- the configuration, a frame drawn in software, a boot.
  rmp_new:
    needs: config
    if: needs.config.outputs.framework == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.config.outputs.build_image }}
    defaults:
      run:
        shell: bash
    env:
      GAME: /tmp/ci_game
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: rmp new
        run: |
          set -euo pipefail
          # The checkout belongs to another user than the container's root,
          # and git answers nothing about such a repository until it is told
          # the folder is safe. `rmp new` reads the framework's index.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./rmp new "$GAME"
          cd "$GAME"
          test "$(python3 tools/rmp.py --mode)" = game || { echo "FAIL: the game says it is the framework"; exit 1; }
          # The framework's own things stay behind. tests/rmp_test.py checks
          # the whole tree; these are the ones that would change what the
          # game's CI does.
          for f in tests/configure_test.py examples CLAUDE.md .claude .clang-tidy \
                   LICENSE tools/naming_check.sh .github/workflows/canary.yml; do
            if [ -e "$f" ]; then echo "FAIL: $f reached the game"; exit 1; fi
          done
          case "$(git ls-files -s thirdparty/raylib-ios)" in
            "160000 "*) echo "  ok    raylib-iOS is a submodule, pinned" ;;
            *) echo "FAIL: thirdparty/raylib-ios is not a gitlink in the game"; exit 1 ;;
          esac
          case "$(git ls-files -s rmp)" in
            "100755 "*) echo "  ok    rmp is executable in the game's index" ;;
            *) echo "FAIL: rmp is not executable in the game's index"; exit 1 ;;
          esac

      - name: The game's workflows lint clean
        working-directory: ${{ env.GAME }}
        run: |
          set -euo pipefail
          actionlint -color
          bash "$GITHUB_WORKSPACE/tools/workflow_check.sh" "$GAME"
          echo "PASS: the game's workflows"

      - name: rmp test, in the game
        working-directory: ${{ env.GAME }}
        run: |
          set -euo pipefail
          ./rmp test config
          # The presets a game gets all configure in it -- `lint` asks for the
          # tests and examples a game does not have, and stopped at "No
          # SOURCES given to target" until the targets were guarded.
          cmake --preset lint > /dev/null
          # A game has no golden frame: the boot, the pixels and a clean exit.
          OUT=$(./rmp test render 2>&1) || { printf '%s\n' "$OUT"; exit 1; }
          printf '%s\n' "$OUT"
          printf '%s\n' "$OUT" | grep -q "no golden hash" || {
            echo "FAIL: the game compared a golden frame it should not have"; exit 1; }
          xvfb-run -a -s "-screen 0 1280x720x24" ./rmp test smoke

      # The game's own tests, both ways. The one rmp new writes builds with
      # the game's src/ and passes -- under `rmp test unit` and under the step
      # of the game's own CI that runs it, read out of the game's ci.yml. With
      # tests/game/ deleted both have nothing to run and say so, and the lint
      # preset still configures.
      - name: The game's own tests, with tests/game/ and without
        working-directory: ${{ env.GAME }}
        run: |
          set -euo pipefail
          STEP=$(python3 - <<'PY'
          import yaml
          lint = yaml.safe_load(open(".github/workflows/ci.yml"))["jobs"]["lint"]
          (step,) = [s for s in lint["steps"] if s.get("name") == "The game's own tests (tests/game/)"]
          print(step["run"])
          PY
          )
          RAN='^\[doctest\] test cases: *[1-9][0-9]* \| *[1-9][0-9]* passed \| *0 failed'
          OUT=$(./rmp test unit 2>&1) || { printf '%s\n' "$OUT"; exit 1; }
          printf '%s\n' "$OUT" | grep -Eq "$RAN" || {
            printf '%s\n' "$OUT"; echo "FAIL: rmp test unit ran no test of the game"; exit 1; }
          OUT=$(bash -c "$STEP" 2>&1) || { printf '%s\n' "$OUT"; exit 1; }
          printf '%s\n' "$OUT" | grep -Eq "$RAN" || {
            printf '%s\n' "$OUT"; echo "FAIL: the game's CI ran no test of the game"; exit 1; }
          echo "  ok    tests/game/ runs, under rmp test unit and in the game's CI"
          mv tests/game /tmp/ci_game_tests
          OUT=$(./rmp test unit 2>&1) || { printf '%s\n' "$OUT"; exit 1; }
          printf '%s\n' "$OUT" | grep -q 'skip  nothing matches tests/game/' || {
            printf '%s\n' "$OUT"; echo "FAIL: rmp test unit did not say there was nothing"; exit 1; }
          OUT=$(bash -c "$STEP" 2>&1) || { printf '%s\n' "$OUT"; exit 1; }
          printf '%s\n' "$OUT" | grep -q 'skip  no tests/game' || {
            printf '%s\n' "$OUT"; echo "FAIL: the game's CI did not say there was nothing"; exit 1; }
          cmake --preset lint > /dev/null
          mv /tmp/ci_game_tests tests/game
          echo "PASS: a game's tests run when it has them, and nothing asks when it has none"

      # The way out of the framework, followed as documented: the recipe at the
      # top of examples/plain_c/src/main.c, read out of that file and run in a
      # copy of the game, then the game's own render check -- built, booted,
      # its asset found, a frame drawn, a clean exit. The recipe once stopped
      # CMake at "No SOURCES given to target: rmp", and nothing ran it.
      - name: A game in plain C, made the way examples/plain_c says
        run: |
          set -euo pipefail
          EXAMPLE="$GITHUB_WORKSPACE/examples/plain_c/src/main.c"
          RECIPE=$(sed -n 's|^//     \(rm src/main\.cpp .*\)$|\1|p' "$EXAMPLE")
          test -n "$RECIPE" || { echo "FAIL: no recipe at the top of $EXAMPLE"; exit 1; }
          cp -r "$GAME" /tmp/ci_game_c
          cd /tmp/ci_game_c
          echo "  $RECIPE"
          sh -c "$RECIPE"
          cp "$EXAMPLE" src/
          # The recipe takes tests/game/ with the scenes it tests.
          test ! -e tests/game || { echo "FAIL: the recipe left tests/game/ behind"; exit 1; }
          OUT=$(./rmp test render 2>&1) || { printf '%s\n' "$OUT"; exit 1; }
          printf '%s\n' "$OUT" | tail -5
          # And its release: the example's main() moves into the executable's
          # folder itself, and only when resources/ is there -- so it starts
          # from another folder and from the project folder alike.
          sh tools/shipped_check.sh Ninja "" "$(python3 tools/configure.py --print-name)"

      # [ci] on_push writes the push and pull_request triggers of a game's
      # ci.yml, and nothing else in it. Turned off in the game made above: its
      # configure.py rewrites the block (outside GitHub Actions -- inside, every
      # run only compares), the file is the framework's outside the markers,
      # the workflows still lint and --check passes. Then the red, on every
      # commit: the framework's ci.yml put back under that .toml is refused, at
      # the line of the .toml that says so.
      - name: "[ci] on_push = false, in the game"
        working-directory: ${{ env.GAME }}
        run: |
          set -euo pipefail
          sed -i 's/^on_push = true$/on_push = false/' raylib_multiplatform.toml
          grep -qx 'on_push = false' raylib_multiplatform.toml || {
            echo "FAIL: the game's .toml has no 'on_push = true' line to turn off"; exit 1; }
          env -u GITHUB_ACTIONS python3 tools/configure.py > /dev/null
          CHANGED=$(git diff --name-only | tr '\n' ' ')
          if [ "$CHANGED" != ".github/workflows/ci.yml raylib_multiplatform.toml " ]; then
            echo "FAIL: on_push = false changed [$CHANGED], not the .toml and ci.yml alone"; exit 1
          fi
          BLOCK='/# BEGIN generated by tools\/configure.py from \[ci\] on_push/,/# END generated from \[ci\] on_push/d'
          if ! diff <(sed "$BLOCK" "$GITHUB_WORKSPACE/.github/workflows/ci.yml") \
                    <(sed "$BLOCK" .github/workflows/ci.yml); then
            echo "FAIL: the game's ci.yml differs from the framework's outside the generated block"
            exit 1
          fi
          if grep -qE '^  pull_request:|^    branches:' .github/workflows/ci.yml; then
            echo "FAIL: on_push = false left a branch or pull_request trigger in ci.yml"; exit 1
          fi
          actionlint -color
          bash "$GITHUB_WORKSPACE/tools/workflow_check.sh" "$GAME"
          python3 tools/configure.py --check
          cp "$GITHUB_WORKSPACE/.github/workflows/ci.yml" .github/workflows/ci.yml
          if OUT=$(python3 tools/configure.py --check 2>&1); then
            echo "FAIL: --check passed a ci.yml whose triggers the .toml does not ask for"; exit 1
          fi
          printf '%s\n' "$OUT" | grep -q 'raylib_multiplatform.toml:[0-9]*: on_push = false' || {
            printf '%s\n' "$OUT"; echo "FAIL: the refusal does not point at [ci] on_push"; exit 1; }
          echo "  ok    a ci.yml the .toml does not ask for is refused at its line"
          git checkout -- raylib_multiplatform.toml .github/workflows/ci.yml
          echo "PASS: [ci] on_push writes the triggers, and nothing else"

  # The documentation lives in its own repository, omardev29/rmp-docs, and
  # documents one commit of this one. Here it is checked against THIS commit:
  # every page's gates, every name it links, every C and C++ block it shows
  # compiled against these headers, every .toml block through this
  # configure.py. On a push it only warns -- an API change lands here first
  # and the docs follow it. On a tag it is strict, and the release needs it:
  # a version whose documentation lies is not released.
  docs:
    needs: config
    if: needs.config.outputs.framework == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.config.outputs.build_image }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Public: no token of ours, and nothing written back.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: omardev29/rmp-docs
          path: rmp-docs
          persist-credentials: false

      # The compile tier compiles with the flags the framework's build gives
      # an example, read from the configure-only lint preset's database.
      - name: Configure
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 tools/configure.py
          cmake --preset lint > /dev/null

      - name: The docs, against this commit
        id: docs
        continue-on-error: ${{ github.ref_type != 'tag' }}
        run: python3 rmp-docs/tools/build.py check --framework "$GITHUB_WORKSPACE" --tier compile

      - name: Say so when they do not pass
        if: steps.docs.outcome == 'failure'
        run: |
          echo "::warning title=docs::rmp-docs does not pass against this commit; a tag of it would not be released. The step above says which page and why."

  linux:
    needs: config
    if: contains(fromJSON(needs.config.outputs.families), 'linux')
    uses: ./.github/workflows/_linux.yml
    with:
      project_name: ${{ needs.config.outputs.project_name }}
      build_image: ${{ needs.config.outputs.build_image }}
      full: ${{ needs.config.outputs.full == 'true' }}
      targets: ${{ needs.config.outputs.targets }}
    permissions:
      contents: read
      packages: read

  web:
    needs: config
    if: contains(fromJSON(needs.config.outputs.families), 'web')
    uses: ./.github/workflows/_web.yml
    with:
      project_name: ${{ needs.config.outputs.project_name }}
      build_image: ${{ needs.config.outputs.build_image }}
    permissions:
      contents: read
      packages: read

  windows:
    needs: config
    if: contains(fromJSON(needs.config.outputs.families), 'windows')
    uses: ./.github/workflows/_windows.yml
    with:
      project_name: ${{ needs.config.outputs.project_name }}
      full: ${{ needs.config.outputs.full == 'true' }}
      targets: ${{ needs.config.outputs.targets }}
      runner: ${{ needs.config.outputs.windows_runner }}
      framework: ${{ needs.config.outputs.framework == 'true' }}
      mesa_version: ${{ needs.config.outputs.mesa }}
      mesa_sha256: ${{ needs.config.outputs.mesa_sha256 }}

  android:
    needs: config
    if: contains(fromJSON(needs.config.outputs.families), 'android')
    uses: ./.github/workflows/_android.yml
    with:
      build_image: ${{ needs.config.outputs.build_image }}
    permissions:
      contents: read
      packages: read
    secrets: inherit

  apple:
    needs: config
    if: needs.config.outputs.full == 'true' &&
        contains(fromJSON(needs.config.outputs.families), 'apple')
    uses: ./.github/workflows/_apple.yml
    with:
      project_name: ${{ needs.config.outputs.project_name }}
      targets: ${{ needs.config.outputs.targets }}
      framework: ${{ needs.config.outputs.framework == 'true' }}
      runner: ${{ needs.config.outputs.macos_runner }}
      xcode_version: ${{ needs.config.outputs.xcode }}
      ninja_version: ${{ needs.config.outputs.ninja_mac }}
      ninja_sha256: ${{ needs.config.outputs.ninja_mac_sha256 }}
      xcodegen_version: ${{ needs.config.outputs.xcodegen }}
      xcodegen_sha256: ${{ needs.config.outputs.xcodegen_sha256 }}

  bsd:
    needs: config
    # Never called with an empty matrix: an empty `include` is a hard error in
    # GitHub Actions, not a skip.
    if: needs.config.outputs.full == 'true' &&
        contains(fromJSON(needs.config.outputs.families), 'bsd')
    uses: ./.github/workflows/_bsd.yml
    with:
      project_name: ${{ needs.config.outputs.project_name }}
      matrix: ${{ needs.config.outputs.bsd_matrix }}

  # Optional: runs the debug APK in Firebase Test Lab. Skips with a warning when
  # vars.FIREBASE_PROJECT / secrets.GCP_SA_KEY are absent, which is the default.
  firebase:
    needs: [config, android]
    if: needs.config.outputs.full == 'true' &&
        contains(fromJSON(needs.config.outputs.families), 'android')
    uses: ./.github/workflows/_firebase.yml
    with:
      project_id: ${{ needs.config.outputs.firebase_project }}
      device: ${{ needs.config.outputs.firebase_device }}
    secrets: inherit

  # ---------------------------------------------------------------------------
  # Release. Tag builds only, and only when every target actually succeeded.
  #
  # `always()` is required so this job is evaluated even though some upstreams
  # may have been skipped — but `always()` also makes `needs` stop gating on its
  # own, so every dependency has to be re-asserted by hand below. Forgetting one
  # means it silently stops blocking the release.
  #
  # The test is "did not fail", not "succeeded": a family the user turned off in
  # [targets] reports `skipped`, and demanding success would mean disabling any
  # platform silently disables releases too.
  #
  # examples, rmp_new and docs are the framework's own; a game skips them. Skipped
  # passes ONLY in a game: in the framework a skipped job is one that did not
  # run, and a release it did not check.
  # ---------------------------------------------------------------------------
  release:
    needs: [config, lint, examples, rmp_new, docs, linux, web, windows, android, apple, bsd]
    if: >
      always() &&
      github.ref_type == 'tag' &&
      needs.lint.result == 'success' &&
      (needs.examples.result == 'success' ||
       (needs.config.outputs.framework == 'false' && needs.examples.result == 'skipped')) &&
      (needs.rmp_new.result == 'success' ||
       (needs.config.outputs.framework == 'false' && needs.rmp_new.result == 'skipped')) &&
      (needs.docs.result == 'success' ||
       (needs.config.outputs.framework == 'false' && needs.docs.result == 'skipped')) &&
      needs.linux.result != 'failure'   && needs.linux.result != 'cancelled' &&
      needs.web.result != 'failure'     && needs.web.result != 'cancelled' &&
      needs.windows.result != 'failure' && needs.windows.result != 'cancelled' &&
      needs.android.result != 'failure' && needs.android.result != 'cancelled' &&
      needs.apple.result != 'failure'   && needs.apple.result != 'cancelled' &&
      needs.bsd.result != 'failure'     && needs.bsd.result != 'cancelled'
    uses: ./.github/workflows/_release.yml
    with:
      project_name: ${{ needs.config.outputs.project_name }}
    permissions:
      contents: write

  itch:
    needs: [config, release]
    if: always() && github.ref_type == 'tag' && needs.release.result == 'success'
    uses: ./.github/workflows/_itch.yml
    with:
      version: ${{ needs.config.outputs.version }}
      project_name: ${{ needs.config.outputs.project_name }}
      build_image: ${{ needs.config.outputs.build_image }}
      itch_user: ${{ needs.config.outputs.itch_user }}
      itch_game: ${{ needs.config.outputs.itch_game }}
    # packages: read because _itch.yml now runs in the build image, for butler.
    # A called workflow cannot hold a permission the CALLER does not grant, and
    # the failure for that is a startup_failure with no jobs and the message
    # "Error calling workflow" — actionlint does not check across files, so
    # nothing local catches it.
    permissions:
      contents: read
      packages: read
    secrets: inherit
