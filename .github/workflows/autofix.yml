# When the canary breaks, try to fix it — on the platform that broke.
#
# The point of running the agent on the failing family's own runner is that it
# can compile and test in-session instead of guessing. An agent on Ubuntu
# reasoning about an Xcode failure is writing fiction; the same agent on
# macos-26 can run `xcodebuild` and see.
#
#   Apple              macos-26, natively — GitHub's macOS runners have no Docker
#   Linux/Web/Android  ubuntu-24.04, using tools/dev_shell.sh against the pinned
#                      image. The image has neither node nor bun, so the action
#                      itself cannot run inside the container.
#   BSD                ubuntu-24.04, semi-blind. It proposes; the PR validates.
#
# Two guardrails are structural rather than instructions, which is what makes
# this safe to leave running:
#
#   1. GITHUB_TOKEN cannot push changes to .github/workflows at all. That is a
#      hard limit the agent cannot argue its way past, and it is why every
#      floating pin was moved into thirdparty/FROZEN_VERSIONS.md first — so the
#      fix has somewhere legal to land.
#   2. tools/versions_check.sh fails the PR if a version was bumped in one place
#      and not the other. It was written to stop humans leaving the docs lying;
#      it turns out to be exactly the check that stops an agent doing it.
#
# The remaining risk is prompt injection through the build log the agent reads,
# so permissions are the minimum that lets it open a draft PR, and nothing more.

name: autofix

on:
  workflow_run:
    workflows: [canary]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Canary run id to fix (workflow_run only fires from the default branch, so this is the only way to test)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  plan:
    if: >
      github.repository == 'omardev29/raylib_multiplatform' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read       # downloading an artifact from the canary's run
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Fetch the canary report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: canary-report
          path: report
          run-id: ${{ inputs.run_id || github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - id: plan
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib
          rep = json.loads(pathlib.Path("report/canary-report.json").read_text())
          # Entries already in known-breakage.md are filtered out upstream, so
          # a repeat of something we decided not to chase does not reopen a PR
          # every Monday.
          rows = rep.get("fix_matrix", [])
          print(f"matrix={json.dumps({'include': rows}, separators=(',', ':'))}")
          print(f"any={'true' if rows else 'false'}")
          PY
          cat report/canary-report.json

  fix:
    needs: plan
    # An empty matrix is a hard error in Actions, not a skip.
    if: needs.plan.outputs.any == 'true'
    strategy:
      fail-fast: false
      # One agent per broken family. A job has exactly one `runs-on`, so Apple
      # and Linux failing in the same week needs one job each.
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: write         # push the autofix branch
      pull-requests: write    # open the draft PR
      actions: read
    env:
      # The `secrets` context is not available in a job-level `if:`, so the
      # presence check has to happen at step level through env.
      HAS_KEY: ${{ (secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '') && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: canary-report
          path: report
          run-id: ${{ inputs.run_id || github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: No API key configured
        if: env.HAS_KEY != 'true'
        run: |
          echo "::warning::autofix is wired up but has no credentials."
          echo "Add ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN as a repository secret to enable it."
          echo "The canary report is still attached to the canary run."
          {
            echo "## autofix skipped"
            echo
            echo "No \`ANTHROPIC_API_KEY\` / \`CLAUDE_CODE_OAUTH_TOKEN\` secret."
            echo "Broken family: \`${{ matrix.family }}\` (\`${{ matrix.key }}\`)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attempt a fix
        id: agent
        if: env.HAS_KEY == 'true'
        uses: anthropics/claude-code-action@a874e9ecd7bb36efdad65429c6b35815f5a08f10  # v1.0.210
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch_prefix: autofix/
          # --allowedTools is not optional here, and its absence does not look
          # like a failure. Without it the SDK runs with default permissions,
          # which in a non-interactive session means every tool that would have
          # prompted is denied: the first real run burned 32 turns and $1.25,
          # reported `"is_error": false`, and produced no branch, no PR and no
          # complaint — just `"permission_denials_count": 18` buried in the
          # result JSON.
          #
          # WebFetch and WebSearch are left out deliberately. The agent reads a
          # build log it did not write, so the one capability worth withholding
          # is the one that could carry anything it finds back out.
          # show_full_output was on for exactly one run (31890557261) to find out
          # where the agent's answers were going. They were going nowhere: it
          # was replying in prose and the action discards the SDK's final
          # message. Hence autofix-verdict.md below. Do not leave that setting
          # on — the repo is public and it prints the whole transcript.
          #
          # --model: the action defaults to Sonnet, and this job only ever runs
          # when something is already broken across a platform matrix — a few
          # times a year, on a diagnosis nobody is watching. Capability is worth
          # more than the token price here. Roughly 2.5x the per-token cost of
          # the default, against runs that have been costing about a dollar.
          claude_args: >-
            --max-turns 40
            --model claude-opus-5
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash,TodoWrite,NotebookEdit"
          prompt: |
            The weekly canary for this raylib template failed. You are running on
            ${{ matrix.runner }}, the same platform that broke, so you can build and
            test the change rather than guessing at it.

            Read `report/canary-report.json` first. It leads with a
            frozen-versus-observed version delta — that delta is almost always the
            cause, and the error lines below it are the symptom.

            Check each delta entry's `source`. `measured` means the runner really
            reported that version. `requested` means the job died before it could
            say, so the value is only what the canary asked for — and a `requested`
            value that looks impossible usually means someone was testing the
            pipeline by hand, not that anything is broken.

            Fix ONLY the `${{ matrix.family }}` family. Breakage key: `${{ matrix.key }}`.

            You may edit:
              - thirdparty/FROZEN_VERSIONS.md  (this is where every floating pin lives)
              - .github/workflows/_${{ matrix.family }}.yml
              - tools/ and the platform's own build files

            You may NOT edit:
              - .github/workflows/ci.yml, canary.yml or autofix.yml
              - anything to do with releases or code signing
              - src/ or include/, which belong to whoever uses this template

            You could not commit a change under .github/workflows even if you tried:
            GITHUB_TOKEN is refused there without the `workflows` permission. That is
            deliberate. If the only real fix is a workflow edit, do not fake one —
            describe it in the PR body and stop.

            Before committing, run:
              bash tools/versions_check.sh
            It fails if a version was bumped in one place and not the other. On Linux,
            Web and Android you can reproduce the CI toolchain exactly with
            `tools/dev_shell.sh <command>`; on macOS build natively, there is no Docker.

            Open a DRAFT pull request. In the body state: what moved, what you changed,
            what you verified, and what you could not verify. If you are not confident,
            say so plainly — a draft PR that says "this is a guess, here is why" is
            useful; one that overstates its confidence is worse than nothing.

            If the failure looks like a flake rather than a real break, do not invent a
            fix. Say so and propose adding it to `.github/known-breakage.md` instead.

            Whatever you conclude, leave it in a FILE. Do not answer in prose: this
            action discards your final message, so anything you only say is thrown
            away and the run looks identical to one that never happened.

            If you are NOT opening a PR — flake, out of scope, the fix is a workflow
            edit you are not allowed to make, or you simply could not work it out —
            write `autofix-verdict.md` in the repository root before you finish:

              # <one line: why there is no PR>
              What I found, what I ruled out, and what I would do next.

            Do not commit it. A later step picks it up and puts it on the job summary.
            Writing that file is the minimum acceptable outcome of this run.

      # The action hides the SDK's output on purpose, so a credential problem
      # and a genuine "the agent could not fix it" look identical from the log:
      # both are just "Claude execution failed". Observed once already — the SDK
      # initialised and returned is_error after 234 ms at $0, which is not a
      # task failure at all. This step is here so the next person does not have
      # to re-derive that.
      - name: Why the agent failed
        if: failure() && steps.agent.outcome == 'failure'
        run: |
          {
            echo "## The agent did not complete"
            echo
            echo "Family \`${{ matrix.family }}\`, key \`${{ matrix.key }}\`."
            echo
            echo "The canary report is still attached to the canary run, so nothing is lost —"
            echo "the diagnosis is there whether or not the agent ran."
            echo
            echo "A **fast** failure (a second or two, \$0 cost, one turn) is almost never the"
            echo "task. In order of likelihood:"
            echo
            echo "1. \`CLAUDE_CODE_OAUTH_TOKEN\` has expired. They are not permanent —"
            echo "   re-mint with \`claude setup-token\` and update the secret."
            echo "2. The account behind the token has hit its usage limit."
            echo "3. The token was pasted from the wrong place (a session key is not an"
            echo "   OAuth token)."
            echo
            echo "To see the real reason, add \`show_full_output: true\` to the *Attempt a fix*"
            echo "step and re-run. Take it back out afterwards: it prints the whole SDK"
            echo "transcript into a log that anyone who can read the repo can read."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::Agent did not complete — see the job summary. Check the token before assuming the fix was impossible."

      # A green "Attempt a fix" does not mean a fix was attempted.
      #
      # The SDK reports success as long as the session ran to completion, so a
      # run that was denied every tool it needed still exits 0. That is exactly
      # what happened the first time this worked: 32 turns, $1.25, is_error
      # false, nothing on the remote. Check for the artefact, not the exit code.
      - name: Did the agent produce anything?
        if: steps.agent.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # for the `gh pr list` below
        run: |
          set -euo pipefail
          # checkout left the token in the remote URL, so this is authenticated.
          branches=$(git ls-remote --heads origin 'autofix/*' || true)
          if [ -n "$branches" ]; then
            echo "Branch pushed:"
            echo "$branches"
            # A branch with no PR behind it is the signature of one specific
            # repository setting, not of anything the agent did wrong. Measured
            # with a probe job holding exactly these permissions: the push
            # succeeds, and `gh pr create` comes back with "GitHub Actions is
            # not permitted to create or approve pull requests".
            if [ -z "$(gh pr list --state open --head "${branches%%$'\n'*}" --json number -q '.[].number' 2>/dev/null)" ]; then
              {
                echo "## Branch pushed, but no pull request"
                echo
                echo "The agent got its work onto the remote and could not open a PR for it."
                echo
                echo "That is almost certainly **Settings → Actions → General → Workflow"
                echo "permissions → \"Allow GitHub Actions to create and approve pull"
                echo "requests\"**, which is off by default. \`GITHUB_TOKEN\` is refused the"
                echo "\`createPullRequest\` mutation while it is, no matter what"
                echo "\`permissions:\` this workflow asks for."
                echo
                echo "The branch is there either way — open the PR by hand, or tick the box"
                echo "and re-run."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::Branch pushed but no PR — check 'Allow GitHub Actions to create and approve pull requests'."
            fi
            exit 0
          fi

          # No branch is not the same as nothing to say. The agent is asked to
          # write its reasoning to autofix-verdict.md when it decides against a
          # PR — a file, not a reply, because this action discards the SDK's
          # final message and a spoken answer would go nowhere.
          if [ -f autofix-verdict.md ]; then
            echo "No PR, but the agent left a verdict:"
            cat autofix-verdict.md
            {
              echo "## The agent decided not to open a PR"
              echo
              cat autofix-verdict.md
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## The agent ran and said nothing"
            echo
            echo "Family \`${{ matrix.family }}\`, key \`${{ matrix.key }}\`. No \`autofix/*\`"
            echo "branch on the remote, and nothing written to this summary either — so"
            echo "the session produced no output at all, which is a different thing from"
            echo "deciding there was nothing to fix. It was asked to write that decision"
            echo "here precisely so the two would stop looking alike."
            echo
            echo "The likely cause is tool permissions, not the task. The SDK denies any"
            echo "tool that would have prompted, and reports the session as a success"
            echo "regardless; look for \`permission_denials_count\` in the *Attempt a fix*"
            echo "step output. If it is non-zero, \`--allowedTools\` in \`claude_args\` is"
            echo "missing something the agent needed."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::Agent completed without opening a PR — see the job summary."
