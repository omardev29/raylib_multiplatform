# Web (Emscripten) build plus a headless-browser boot/render test.
#
# Reusable (`workflow_call`) — called from ci.yml.
#
# The build runs inside the frozen image (pinned emsdk). The test does NOT: it
# needs Playwright's Chromium, which is pinned by the committed lockfile
# instead, and running it on the hosted runner keeps the image from growing a
# browser it would otherwise carry into every other job.

name: Web

on:
  workflow_call:
    inputs:
      project_name:
        required: true
        type: string
      build_image:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ inputs.build_image }}
    defaults:
      run:
        # Container jobs default to `sh -e {0}`, which has no `pipefail`;
        # `set -euo pipefail` dies with "Illegal option". Be explicit.
        shell: bash
    steps:
      - name: Build image manifest
        run: cat /etc/raylib-build-image.json

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Configure
        run: cmake --preset web

      - name: Build
        run: cmake --build --preset web

      - name: Test (static) — web artifacts exist and are non-empty
        run: |
          set -e
          cd build/web
          for f in ${{ inputs.project_name }}.html ${{ inputs.project_name }}.js \
                   ${{ inputs.project_name }}.wasm ${{ inputs.project_name }}.data; do
            test -s "$f" || { echo "FAIL: $f missing or empty"; exit 1; }
            echo "ok: $f ($(stat -c%s "$f") bytes)"
          done
          echo "PASS: web artifact checks"

      - name: Package
        run: |
          cd build/web
          zip -r ../../web-build.zip \
            ${{ inputs.project_name }}.html ${{ inputs.project_name }}.js \
            ${{ inputs.project_name }}.wasm ${{ inputs.project_name }}.data

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: web-build
          path: web-build.zip
          retention-days: 7

  boot-test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download web artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: web-build
          path: web

      - name: Unpack web build
        run: |
          cd web
          unzip -o web-build.zip
          ls -la

      # Pinned via the committed package-lock.json. The Chromium build is keyed
      # to the Playwright version, so `npm ci` pins the browser too.
      - name: Install Playwright + Chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Serve and boot + render test (headless Chromium)
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
        run: |
          python3 -m http.server 8000 --directory web &
          SRV=$!
          sleep 3
          node .github/scripts/web_boot_test.js "http://localhost:8000/${{ inputs.project_name }}.html"
          rc=$?
          kill $SRV 2>/dev/null || true
          exit $rc

      # A failed render check is much easier to diagnose with the actual frame
      # in front of you than from a ratio in a log line.
      - name: Upload canvas capture on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: web-canvas-capture
          path: /tmp/web_canvas.png
          if-no-files-found: ignore
          retention-days: 7
