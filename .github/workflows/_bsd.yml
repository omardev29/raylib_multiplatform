# FreeBSD, OpenBSD and NetBSD, built in QEMU VMs on a hosted Linux runner.
#
# Reusable (`workflow_call`) — called from ci.yml on full runs only.
#
# These are the least frozen jobs in the pipeline and honestly so: the VM images
# and the BSD package mirrors are both rolling, and there is no snapshot service
# for either. They compile the sample and check the binary format; they never
# open a window.

name: BSD

on:
  workflow_call:
    inputs:
      project_name:
        required: true
        type: string
      matrix:
        description: 'JSON matrix, already filtered by [targets]. Never empty: ci.yml
          skips this workflow entirely when no BSD target is enabled, because an
          empty `include` is a hard error rather than a skip.'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    # Guard against the VM-readiness step hanging forever (cross-platform-actions #158).
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Built by tools/configure.py from [targets]. The OS versions live in the
      # matrix so the canary can float them without touching this file.
      #
      # Deliberately absent, and why:
      #   FreeBSD riscv64 — FreeBSD publishes no riscv64 binary packages, so
      #     cmake/X11 cannot be installed. RISC-V is covered by linux-riscv64.
      #   NetBSD arm64    — the pkgsrc binaries for 10.1/arm64 are built against
      #     newer libs than the base image ships and pkg_add cannot reconcile
      #     the cascade; building from source under QEMU is impractical.
      #   OpenBSD/NetBSD riscv64 — cross-platform-actions publishes no image.
      matrix: ${{ fromJSON(inputs.matrix) }}
    defaults:
      run:
        shell: cpa.sh {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # On the RUNNER, before the VM exists: none of the FreeBSD, OpenBSD or
      # NetBSD images ship Python, so CMake inside the VM cannot generate this
      # itself. cross-platform-actions rsyncs the workspace in before each
      # step, so what is written here is what the VM builds with, and the
      # CMake hook degrades to "use what is already generated".
      - name: Generate configuration
        shell: bash
        run: python3 tools/configure.py

      - name: Start ${{ matrix.os }} ${{ matrix.version }} (${{ matrix.arch }}) VM
        # v1.4.0. This used to pin an untagged master commit for the AMX fix
        # behind the NetBSD boot failures on Intel-AMX runners (issue #158);
        # that fix shipped in v1.3.0, so we are back on a real release.
        uses: cross-platform-actions/action@faa0c6197e94aacf1c5956460152c8380d3560a5  # v1.5.0
        with:
          operating_system: ${{ matrix.os }}
          version: ${{ matrix.version }}
          architecture: ${{ matrix.arch }}
          memory: 6G
          cpu_count: 2

      - name: Install deps + build inside the VM
        run: |
          set -e
          pwd; ls -la
          EXTRA_CMAKE=""
          GENERATOR="Ninja"
          case "${{ matrix.os }}" in
            freebsd)
              sudo pkg install -y cmake ninja git pkgconf \
                libX11 libXrandr libXi libXcursor libXinerama libglvnd mesa-libs ;;
            openbsd)
              sudo pkg_add cmake ninja git pkgconf
              # CMake cannot auto-detect the archiver for OpenBSD's clang; set
              # both CMAKE_AR and the compiler-specific CMAKE_C_COMPILER_AR.
              EXTRA_CMAKE="-DCMAKE_AR=/usr/bin/ar -DCMAKE_RANLIB=/usr/bin/ranlib \
                -DCMAKE_C_COMPILER_AR=/usr/bin/ar -DCMAKE_C_COMPILER_RANLIB=/usr/bin/ranlib" ;;
            netbsd)
              # NetBSD base has pkg_add (no pkgin by default); point it at the
              # pkgsrc binary packages for this release/arch. The pkgsrc binaries
              # are built against newer curl/nghttp2 than the base image ships and
              # pkg_add refuses to upgrade installed packages in place, so drop the
              # old curl/nghttp2 first so the new ones install cleanly. Skip git
              # (not needed to build; sources are already synced). NOTE: pkgsrc's
              # 'ninja' package is an IRC client, not the build tool, so build
              # with GNU make + the "Unix Makefiles" generator instead.
              # pkgsrc dirs use their own arch names (arm64 -> aarch64); uname -m
              # does not match, so map explicitly.
              case "${{ matrix.arch }}" in
                x86-64) PKG_ARCH="amd64" ;;
                arm64)  PKG_ARCH="aarch64" ;;
                *)      PKG_ARCH="$(uname -m)" ;;
              esac
              sudo /usr/sbin/pkg_delete curl nghttp2 2>/dev/null || true
              sudo env PKG_PATH="https://cdn.NetBSD.org/pub/pkgsrc/packages/NetBSD/$PKG_ARCH/${{ matrix.version }}/All/" \
                /usr/sbin/pkg_add cmake pkgconf gmake
              GENERATOR="Unix Makefiles"
              # CMake can't auto-detect the archiver on NetBSD either; point it
              # at the base ar/ranlib.
              EXTRA_CMAKE="-DCMAKE_MAKE_PROGRAM=/usr/pkg/bin/gmake \
                -DCMAKE_AR=/usr/bin/ar -DCMAKE_RANLIB=/usr/bin/ranlib \
                -DCMAKE_C_COMPILER_AR=/usr/bin/ar -DCMAKE_C_COMPILER_RANLIB=/usr/bin/ranlib" ;;
          esac
          rm -rf build
          cmake -B build -G "$GENERATOR" -DCMAKE_BUILD_TYPE=Release -DPRODUCTION_BUILD=ON $EXTRA_CMAKE
          cmake --build build
          # Static test: the binary exists, is executable, and has the ELF magic
          # (portable check with od; `file` is not always present on the BSDs).
          BIN=build/${{ inputs.project_name }}
          test -f "$BIN" || { echo "FAIL: $BIN not found"; exit 1; }
          test -x "$BIN" || { echo "FAIL: $BIN not executable"; exit 1; }
          test -s "$BIN" || { echo "FAIL: $BIN empty"; exit 1; }
          MAGIC=$(od -An -tx1 -N4 "$BIN" | tr -d ' \n')
          [ "$MAGIC" = "7f454c46" ] || { echo "FAIL: not an ELF (magic=$MAGIC)"; exit 1; }
          echo "PASS: static binary checks ($(wc -c < "$BIN") bytes)"

          # --- and now RUN it -------------------------------------------------
          #
          # These five targets used to prove only that they COMPILE, which is a
          # much weaker claim than it sounds. The segfault at shutdown in phase
          # 3 -- releasing GPU handles after CloseWindow() -- compiled perfectly
          # on all fourteen and was caught by a runtime test on Linux. Nothing
          # here would have noticed.
          #
          # raylib 6.0's software renderer is what makes running possible at
          # all: PLATFORM=Memory rasterises into a plain buffer, so there is no
          # GPU, no window, no display server and nothing to install in a VM
          # that has none of those. It is a second build of raylib, and that is
          # what it costs -- worth it for the difference between "it linked" and
          # "it started, drew a frame, and shut down cleanly".
          # Boot it under the software renderer. In a file, and the LAST thing
          # this script does: it gets truncated on its way into the VM. See the
          # note at the top of tools/render_check.sh -- three CI rounds.
          sh tools/render_check.sh "$GENERATOR" "$EXTRA_CMAKE" "${{ inputs.project_name }}"



      # The VM script has to have run all the way to its last line. See the note
      # where the marker is written: a shell that stops early and exits 0 turns
      # this whole job into a green that proves nothing, and it has happened.
      - name: The VM script reached its end
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f build/.rmp-render-complete ]; then
            echo "FALLA: the build step reported success but did not reach its last line."
            echo "       Something stopped it early and the shell exited 0 anyway."
            echo "       Look at the end of the previous step's output for where it stops."
            exit 1
          fi
          echo "  ok    the VM script ran to completion"

      # The cpa.sh shell syncs the VM filesystem back to the runner after each
      # step, so build/ is available here. This step runs on the RUNNER (shell:
      # bash overrides the job's cpa.sh default) to package + upload the artifact.
      - name: Package BSD artifact
        shell: bash
        run: |
          set -e
          test -f build/${{ inputs.project_name }} || { echo "FAIL: binary not synced back from VM"; exit 1; }
          mkdir -p package/resources
          # LICENSES.txt: the full notice of everything vendored, generated by
          # tools/configure.py from the licence files in thirdparty/. Absent
          # when [deploy] licenses = false, which is why this is not a hard cp.
          if [ -f cmake/generated/LICENSES.txt ]; then
            cp cmake/generated/LICENSES.txt package/
          fi
          cp build/${{ inputs.project_name }} package/
          cp -r resources package/
          # UPX, if [upx] asked for this target. Off by default on BSD: upx
          # publishes no FreeBSD/OpenBSD/NetBSD build, so the script's download
          # finds nothing and says so rather than failing.
          bash tools/upx_pack.sh "${{ matrix.target }}" "build/${{ inputs.project_name }}" || true
          cd package && zip -r "../bsd-${{ matrix.os }}-${{ matrix.arch }}-build.zip" .

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: bsd-${{ matrix.os }}-${{ matrix.arch }}-build
          path: bsd-${{ matrix.os }}-${{ matrix.arch }}-build.zip
          retention-days: 7
