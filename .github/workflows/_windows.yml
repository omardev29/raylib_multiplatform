# Windows targets: x64 (native, with a real render test) and ARM64 (MSVC cross).
#
# Reusable (`workflow_call`) — called from ci.yml.
#
# The x64 job renders for real. Hosted Windows runners have no GPU, so GLFW
# could not create a GL context and the render loop faulted immediately after
# boot; the old test tolerated that crash, which meant every render regression
# passed CI in silence. Mesa's software rasteriser is staged next to the
# executable so the SHIPPED binary gets a genuine WGL context on REAL Windows —
# no emulation and no translation layer in the way.

name: Windows

on:
  workflow_call:
    inputs:
      project_name:
        required: true
        type: string
      full:
        description: 'false = fast lane (x64 only)'
        required: false
        default: true
        type: boolean
      targets:
        description: 'JSON array of enabled target ids (from [targets] in the config)'
        required: true
        type: string
      # True in the framework's own repository, false in a game made with
      # `rmp new`, which has no examples/ to compile and no framework to make
      # another game from. Required, so no caller can forget to say which.
      framework:
        required: true
        type: boolean
      # Floated by the weekly canary; every caller passes the values from
      # thirdparty/FROZEN_VERSIONS.md via `configure.py --print-pins`. No
      # defaults, on purpose: a default is a second copy of a pinned number,
      # and versions_check.sh can only compare the copies it knows about.
      runner:
        required: true
        type: string
      mesa_version:
        description: 'Exact version, or "latest" to resolve the newest release'
        required: true
        type: string
      mesa_sha256:
        description: 'Empty skips verification — required when the version floats'
        required: true
        type: string

permissions:
  contents: read

# A caller cannot override a callee's `env:`, but a callee's `env:` can read its
# own inputs — so the steps below keep using $MESA_VERSION unchanged.
env:
  MESA_VERSION: ${{ inputs.mesa_version }}
  MESA_SHA256: ${{ inputs.mesa_sha256 }}

jobs:
  x64:
    if: contains(fromJSON(inputs.targets), 'windows-x64')
    runs-on: ${{ inputs.runner }}
    defaults:
      run:
        # `runs-on` is an expression, so nothing can infer the platform any
        # more — actionlint was shellchecking these PowerShell steps as bash.
        shell: pwsh
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The icon. Windows keeps it INSIDE the .exe: tools/configure.py makes an
      # .ico out of [icon] source and the resource compiler embeds it -- with
      # Pillow, and without Pillow it skips that in silence, because an icon
      # must never fail a developer's build. The image carries Pillow and this
      # runner is not the image, so it is installed here, at the version and
      # with the hashes FROZEN_VERSIONS.md pins (pip refuses any other wheel),
      # and configure.py runs with it before CMake does. CMake's own run of it
      # may find a Python without Pillow; that one leaves the .ico alone.
      - name: Pillow (pinned), and the icon it makes
        run: |
          $ErrorActionPreference = "Stop"
          $frozen = "thirdparty/FROZEN_VERSIONS.md"
          $ver = (Select-String -Path $frozen -Pattern '^pillow +(\S+)').Matches[0].Groups[1].Value
          $hashes = @(Select-String -Path $frozen -Pattern '^pillow_sha256_\S+ +([0-9a-f]{64})' |
                      ForEach-Object { $_.Matches[0].Groups[1].Value })
          if (-not $ver -or $hashes.Count -eq 0) { throw "no pillow pin in $frozen" }
          $req = Join-Path $env:RUNNER_TEMP "pillow-requirements.txt"
          Set-Content -Path $req -Value ("pillow==$ver " + (($hashes | ForEach-Object { "--hash=sha256:$_" }) -join " "))
          python -m pip install --disable-pip-version-check --no-deps --only-binary=:all: --require-hashes -r $req
          python tools/configure.py
          $src = (python tools/configure.py --print-config | ConvertFrom-Json).config.icon.source
          if ((Test-Path $src) -and -not (Test-Path cmake/generated/app_icon.rc)) {
            Write-Host "FAIL: [icon] source $src exists and configure.py made no app_icon.rc"; exit 1
          }
          Write-Host "icon: $src -> $(@(Get-ChildItem cmake/generated/app_icon.*).Name -join ', ')"

      - name: Configure
        run: cmake --preset release

      # The compiler that builds the shipped .exe is whichever one CMake finds
      # first on the runner's PATH -- today the runner's MinGW GCC, which moves
      # with the runner image and is pinned by nobody. Read back from the cache,
      # because that is what the build used, so a compiler-specific failure can
      # at least be correlated after the fact.
      - name: Record the compiler
        run: |
          $ErrorActionPreference = "Stop"
          $cxx = (Select-String -Path build/release/CMakeCache.txt -Pattern '^CMAKE_CXX_COMPILER:[A-Z]+=(.+)$').Matches[0].Groups[1].Value
          Write-Host "compiler: $cxx"
          & $cxx --version | Select-Object -First 1

      - name: Build
        run: cmake --build --preset release

      # The lint job compiles every example with GCC. This one covers the
      # compiler most likely to disagree, and it exists for one claim in
      # particular: that a user can drop to Clay's own macros from their game
      # code. Those macros are designated initialisers inside a for-loop block,
      # which is the shape MSVC has historically been fussiest about, so the
      # claim gets checked here instead of assumed.
      #
      # /Zs is syntax-only: no objects, no linking, seconds. The MSVC
      # environment is imported into this step only, so nothing after it sees a
      # changed PATH.
      - name: Examples still compile (MSVC)
        if: inputs.framework
        run: |
          # The runner's pwsh wrapper turns a non-zero exit from a native command
          # into a terminating error. Here that would abort on the first bad
          # example instead of reporting all of them, so $LASTEXITCODE is checked
          # by hand below.
          $PSNativeCommandUseErrorActionPreference = $false
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          # MSVC floats with the runner image too; this is the one step on
          # this job that uses it, so this is where it is recorded.
          $vs = & $vswhere -latest -products * -property catalog_productDisplayVersion
          $tools = Get-Content "$(& $vswhere -latest -products * -property installationPath)\VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt"
          Write-Host "MSVC: Visual Studio $vs, toolset $tools"
          $vcvars = & $vswhere -latest -products * -find "VC\Auxiliary\Build\vcvarsall.bat" | Select-Object -First 1
          if (-not $vcvars) { throw "vcvarsall.bat not found" }
          cmd /c "`"$vcvars`" x64 >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { Set-Item -Path "env:$($matches[1])" -Value $matches[2] }
          }
          # The same list the `rmp` library carries in CMakeLists.txt, plus the
          # bare thirdparty root that rmp/math.h needs for <raylib-cpp/*.hpp>.
          # tests/configure_test.py checks this list against the others.
          $dirs = @("include", "thirdparty\raylib\src", "thirdparty\rres",
                    "thirdparty\raymob", "thirdparty\clay", "thirdparty\cute_aseprite",
                    "thirdparty\cute_tiled", "thirdparty\cJSON", "thirdparty", "tests")
          # Every example is a directory now, and its own include/ is private
          # to it. Listing all of them is harmless: no two share a header name.
          foreach ($d in Get-ChildItem examples -Recurse -Directory -Filter include) { $dirs += $d.FullName }
          $inc = $dirs | ForEach-Object { "/I"; $_ }
          $files = @(Get-ChildItem examples -Recurse -Filter *.cpp)
          $expected = @(Get-ChildItem examples -Recurse -Filter main.cpp).Count
          # A glob that stops matching looks exactly like a folder where
          # everything passes, so the count is asserted, not assumed.
          if ($files.Count -lt $expected -or $expected -lt 8) {
            Write-Host "FAIL: found $($files.Count) example sources for $expected examples"; exit 1
          }
          $failed = 0
          foreach ($f in $files) {
            & cl /nologo /Zs /std:c++20 /EHsc @inc '/DRMP_RESOURCES_PATH="./resources/"' /DRMP_PRODUCTION_BUILD=0 $f.FullName
            if ($LASTEXITCODE -ne 0) { Write-Host "  FAIL  $($f.FullName)"; $failed = 1 }
            else { Write-Host "  ok    $($f.FullName)" }
          }
          if ($failed -ne 0) { Write-Host "FAIL: an example no longer compiles with MSVC"; exit 1 }
          Write-Host "PASS: $($files.Count) example sources compile with MSVC"

      - name: Pack resources (AES rres)
        run: cmake --build --preset release --target pack_resources

      - name: Test (static) — .exe exists and is a PE executable
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "build/release/${{ inputs.project_name }}.exe"
          if (-not (Test-Path $exe)) { Write-Host "FAIL: $exe not found"; exit 1 }
          if ((Get-Item $exe).Length -eq 0) { Write-Host "FAIL: $exe is empty"; exit 1 }
          $head = [System.IO.File]::ReadAllBytes($exe)[0..1]
          if (-not ($head[0] -eq 0x4D -and $head[1] -eq 0x5A)) { Write-Host "FAIL: not a PE (no MZ header)"; exit 1 }
          Write-Host "PASS: static binary checks ($((Get-Item $exe).Length) bytes)"

      # A player's machine has Windows and nothing else. The import table says
      # what the .exe will ask the loader for, whatever this runner has
      # installed: the MinGW build imported libstdc++-6.dll and
      # libgcc_s_seh-1.dll, and the boot below passed anyway because MinGW's
      # bin/ was on PATH. Before the boot, so a red here is not hidden behind
      # whatever the boot does.
      - name: Test (static) -- the .exe imports nothing Windows does not ship
        run: |
          # With an app_icon.rc, CMake compiled it in, so the .exe must carry
          # the icon too; the Pillow step makes sure the .rc is there.
          $check = @("tools/binary_check.py", "windows", "build/release/${{ inputs.project_name }}.exe")
          if (Test-Path cmake/generated/app_icon.rc) { $check += "--require-icon" }
          python @check

      - name: Set up Mesa software OpenGL (pinned)
        run: |
          $ErrorActionPreference = "Stop"
          $ver = $env:MESA_VERSION
          if ($ver -eq "latest") {
            # Canary mode: whatever mesa-dist-win released most recently.
            $ver = (Invoke-RestMethod "https://api.github.com/repos/pal1000/mesa-dist-win/releases/latest").tag_name
            Write-Host "resolved mesa latest -> $ver"
          }
          # Contract line for the canary's triage; the key matches the pin name
          # in FROZEN_VERSIONS.md so the frozen-vs-observed diff lines up.
          Write-Host "CANARY_OBSERVED mesa=$ver"
          Write-Host "runner image: $env:ImageOS $env:ImageVersion"
          $url = "https://github.com/pal1000/mesa-dist-win/releases/download/${ver}/mesa3d-${ver}-release-msvc.7z"
          Invoke-WebRequest -Uri $url -OutFile mesa.7z
          $got = (Get-FileHash mesa.7z -Algorithm SHA256).Hash.ToLower()
          if ($env:MESA_SHA256) {
            if ($got -ne $env:MESA_SHA256) { Write-Host "FAIL: mesa sha256 mismatch`n  got      $got`n  expected $env:MESA_SHA256"; exit 1 }
          } else {
            # Not an oversight: a floating version cannot have a pinned hash, and
            # failing here would stop the canary before it tested anything.
            Write-Host "::warning::mesa sha256 not pinned; observed $got"
          }
          7z x mesa.7z -omesa -y | Out-Null
          # Windows resolves DLLs from the application directory first, so
          # dropping these next to the .exe overrides the system opengl32.
          # They are deleted again before packaging: they must never ship.
          Copy-Item mesa/x64/opengl32.dll,mesa/x64/libgallium_wgl.dll,mesa/x64/dxil.dll build/release/
          Write-Host "Mesa $ver staged next to the executable"

      - name: Test (runtime) — boot, render frames, verify pixels
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Resolve-Path "build/release/${{ inputs.project_name }}.exe"

          # The boot saves a file and reads it back (after_ready() in
          # src/rmp/app.cpp), into %APPDATA% -- set here to a folder named
          # "Jos\u00e9 M\u00fcller". A profile path like that, read through the
          # narrow API, is not UTF-8, and once made every save throw and the
          # game terminate; the runner's own user is ASCII and hid it. Built
          # from code points so this file stays ASCII.
          $env:APPDATA = Join-Path $env:RUNNER_TEMP ("Jos" + [char]0x00E9 + " M" + [char]0x00FC + "ller")
          New-Item -ItemType Directory -Force -Path $env:APPDATA | Out-Null

          # The boot runs with the compiler OFF PATH, as on a player's machine.
          # Windows looks for an imported DLL on PATH, so with MinGW's bin/
          # there an .exe that needs libstdc++-6.dll starts here and nowhere
          # else. Out goes the directory of the compiler that built it, and
          # every directory holding a MinGW runtime DLL (Git and Strawberry
          # Perl ship some too); the game inherits this PATH.
          $cxx = (Select-String -Path build/release/CMakeCache.txt -Pattern '^CMAKE_CXX_COMPILER:[A-Z]+=(.+)$').Matches[0].Groups[1].Value
          $compilerDir = (Resolve-Path (Split-Path $cxx)).Path.TrimEnd('\')
          $runtime = @("libstdc++-6.dll", "libgcc_s_seh-1.dll", "libwinpthread-1.dll")
          $kept = @(); $dropped = @()
          foreach ($dir in ($env:PATH -split ';')) {
            if (-not $dir) { continue }
            $full = $dir.TrimEnd('\').Replace('/', '\')
            # .NET, not Join-Path/Test-Path: a PATH entry naming a drive this
            # machine lacks would be an error there, and this is a filter.
            $hasRuntime = @($runtime | Where-Object {
              [System.IO.File]::Exists([System.IO.Path]::Combine($dir, $_)) }).Count -gt 0
            if ($hasRuntime -or $full -ieq $compilerDir) { $dropped += $dir } else { $kept += $dir }
          }
          $env:PATH = $kept -join ';'
          Write-Host "off PATH for the boot: $($dropped -join '; ')"

          # Laid out the way the zip ships it -- the pack next to the .exe --
          # and started from a folder with no resources/ in it, the way a
          # player starts it from Explorer or a shortcut. Started from the
          # repository root, where resources/ happens to be, a release that
          # read "./resources/" from the working directory passed this test
          # and loaded nothing for a player.
          # What the zip ships, by the rule of tools/ship_resources.sh: the
          # pack, or the loose files for a game in plain C.
          New-Item -ItemType Directory -Force -Path build/release/resources | Out-Null
          if (Test-Path src/rmp) { Copy-Item resources/resources.rres build/release/resources/ }
          else { Copy-Item resources/* build/release/resources/ -Recurse -Exclude *.rres }
          $elsewhere = Join-Path $env:RUNNER_TEMP "elsewhere"
          New-Item -ItemType Directory -Force -Path $elsewhere | Out-Null
          $out = Join-Path $elsewhere "out.txt"
          $err = Join-Path $elsewhere "err.txt"

          function Invoke-Game([string]$driver) {
            Remove-Item $out,$err -ErrorAction SilentlyContinue
            $env:RAY_TEST_MAX_FRAMES = "30"
            $env:GALLIUM_DRIVER = $driver
            $proc = Start-Process -FilePath $exe -WorkingDirectory $elsewhere `
                                  -RedirectStandardOutput $out `
                                  -RedirectStandardError $err -PassThru
            if (-not $proc.WaitForExit(180000)) {
              $proc.Kill()
              return @{ ok = $false; code = -1; text = "TIMEOUT" }
            }
            $text = ((Get-Content $out -ErrorAction SilentlyContinue) +
                     (Get-Content $err -ErrorAction SilentlyContinue)) -join "`n"
            return @{ ok = ($proc.ExitCode -eq 0); code = $proc.ExitCode; text = $text }
          }

          # Fallback ladder. llvmpipe is the fast, well-supported path; softpipe
          # is the reference rasteriser; d3d12 goes through WARP. If all three
          # fail we genuinely cannot render here and the job should say so.
          $result = $null
          $used = ""
          foreach ($drv in @("llvmpipe", "softpipe", "d3d12")) {
            Write-Host "=== attempt: GALLIUM_DRIVER=$drv ==="
            $r = Invoke-Game $drv
            Write-Host $r.text
            if ($r.ok -and $r.text -match "RAY_TEST_RENDER_OK") { $result = $r; $used = $drv; break }
            Write-Host "--- $drv did not produce a rendered frame (exit=$($r.code)) ---"
          }

          if ($null -eq $result) { Write-Host "FAIL: no Mesa driver produced a rendered frame"; exit 1 }

          $all = $result.text
          if ($all -notmatch "RAY_TEST_BOOT_OK assets_failed=0 ") { Write-Host "FAIL: boot marker missing, or an asset failed to load (started from another folder: is resources/ read next to the .exe?)"; exit 1 }
          if ($all -notmatch "RAY_TEST_SAVE_OK dir=.*Jos") { Write-Host "FAIL: the save round trip did not use the non-ASCII APPDATA"; exit 1 }
          if ($all -notmatch "RAY_TEST_RENDER_OK")   { Write-Host "FAIL: render marker missing (blank frame?)"; exit 1 }
          if ($all -notmatch "RAY_TEST_DONE_FRAMES") { Write-Host "FAIL: frame marker missing"; exit 1 }
          Write-Host "PASS: Windows boot + render verified on GALLIUM_DRIVER=$used"

      # The game must ship against the player's real driver. A stray Mesa
      # opengl32.dll in the zip would silently force software rendering on every
      # machine that installs it — a miserable bug to diagnose from a support
      # ticket.
      - name: Remove Mesa from the build directory
        if: always()
        run: |
          Remove-Item build/release/opengl32.dll,build/release/libgallium_wgl.dll,build/release/dxil.dll -ErrorAction SilentlyContinue
          Remove-Item mesa.7z -ErrorAction SilentlyContinue
          Remove-Item mesa -Recurse -Force -ErrorAction SilentlyContinue

      - name: Package
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path package/resources | Out-Null
          Copy-Item build/release/${{ inputs.project_name }}.exe package/
          # tools/ship_resources.sh, in PowerShell: the pack, or for a game in
          # plain C -- whose raw raylib cannot read one -- the loose files and a
          # note saying why.
          if (Test-Path src/rmp) {
            Copy-Item resources/resources.rres package/resources/
          } else {
            Copy-Item resources/* package/resources/ -Recurse -Exclude *.rres
            @(
              "resources.rres is not in this archive, on purpose.",
              "This game is written in plain C, without the framework's src/rmp/, and raw",
              "raylib cannot read the pack: it reads these files, next to the executable.",
              "See the plain C example in the raylib_multiplatform framework."
            ) | Set-Content package/resources/PACK_SKIPPED.txt
          }
          # LICENSES.txt: generated by tools/configure.py from the licence
          # files in thirdparty/. Absent when [deploy] licenses = false.
          if (Test-Path cmake/generated/LICENSES.txt) { Copy-Item cmake/generated/LICENSES.txt package/ }
          # UPX, if [upx] asked for this target. OFF by default, and the .toml
          # says why: an unsigned .exe that has been UPX-packed is a shape
          # Windows Defender associates with malware.
          $wanted = (python tools/configure.py --print-upx)
          if ($wanted -match '"windows-x64"') {
            $ver = (Select-String -Path thirdparty/FROZEN_VERSIONS.md -Pattern '^upx +(\S+)').Matches[0].Groups[1].Value
            $sha = (Select-String -Path thirdparty/FROZEN_VERSIONS.md -Pattern '^upx_sha256_win64 +(\S+)').Matches[0].Groups[1].Value
            $url = "https://github.com/upx/upx/releases/download/v$ver/upx-$ver-win64.zip"
            Invoke-WebRequest -Uri $url -OutFile upx.zip
            $got = (Get-FileHash upx.zip -Algorithm SHA256).Hash.ToLower()
            if ($got -ne $sha) { throw "upx checksum mismatch: expected $sha, got $got" }
            Expand-Archive upx.zip -DestinationPath upxdir
            $upx = Get-ChildItem -Recurse upxdir -Filter upx.exe | Select-Object -First 1
            $before = (Get-Item "package/${{ inputs.project_name }}.exe").Length
            & $upx.FullName --best --lzma -q "package/${{ inputs.project_name }}.exe"
            & $upx.FullName -t "package/${{ inputs.project_name }}.exe"
            $after = (Get-Item "package/${{ inputs.project_name }}.exe").Length
            Write-Host "  upx: windows-x64  $before -> $after bytes"
          } else {
            Write-Host "  upx: windows-x64 is not in [upx] enabled — leaving the binary alone"
          }
          Compress-Archive -Path package/* -DestinationPath windows-x64-build.zip
          $names = [IO.Compression.ZipFile]::OpenRead((Resolve-Path windows-x64-build.zip)).Entries.FullName
          if ($names -match 'opengl32\.dll|libgallium_wgl\.dll') { Write-Host "FAIL: Mesa leaked into the release zip"; exit 1 }
          Write-Host "PASS: package clean ($($names.Count) entries)"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: windows-x64-build
          path: windows-x64-build.zip
          retention-days: 7

  # `rmp` from the two Windows shells, on its own runner so that a launcher
  # bug and a build bug never hide each other. The launchers are the part of
  # rmp the Linux tests cannot run: rmp.ps1 under PowerShell, rmp.cmd under
  # cmd.exe, and Git's bash for the scripts `rmp test` hands on.
  rmp:
    if: contains(fromJSON(inputs.targets), 'windows-x64')
    runs-on: ${{ inputs.runner }}
    defaults:
      run:
        shell: pwsh
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # One page whichever way help is asked for, the same page from cmd.exe,
      # and a typo is a usage error -- 2 -- from both, not a crash and not 0.
      - name: rmp under PowerShell and cmd
        run: |
          $ErrorActionPreference = "Stop"
          # Exit codes are read by hand below; the runner's wrapper would turn
          # the expected 2 into a terminating error.
          $PSNativeCommandUseErrorActionPreference = $false
          $help = (& ./rmp.ps1 help) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw "rmp.ps1 help exited $LASTEXITCODE" }
          if (-not $help.StartsWith("usage: rmp")) { throw "rmp.ps1 help printed: $help" }
          foreach ($flag in "-h", "--help") {
            $other = (& ./rmp.ps1 $flag) -join "`n"
            if ($other -ne $help) { throw "rmp.ps1 $flag is not the page rmp.ps1 help prints" }
          }
          $cmd = (& cmd /c rmp.cmd help) -join "`n"
          if ($cmd -ne $help) { throw "rmp.cmd help is not the page rmp.ps1 help prints" }
          & ./rmp.ps1 no-such-command 2>$null
          if ($LASTEXITCODE -ne 2) { throw "rmp.ps1 no-such-command exited $LASTEXITCODE, not 2" }
          & cmd /c rmp.cmd no-such-command 2>$null
          if ($LASTEXITCODE -ne 2) { throw "rmp.cmd no-such-command exited $LASTEXITCODE, not 2" }
          Write-Host "PASS: rmp.ps1 and rmp.cmd print one help page and refuse a typo with 2"
          # The runner ends a pwsh step with the last native exit code, and
          # the last one here was the 2 this step wanted to see.
          exit 0

      # A game made on Windows. There is no exec bit here, so `rmp new` sets
      # it in the game's index itself; and the checkout has CRLF endings, which
      # the game's `rmp test config` -- versions_check.sh under Git's bash --
      # has to read like LF.
      - name: rmp new, and the game's rmp test config
        if: inputs.framework
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          $game = Join-Path $env:RUNNER_TEMP "win_game"
          & ./rmp.ps1 new $game
          if ($LASTEXITCODE -ne 0) { throw "rmp new exited $LASTEXITCODE" }
          Set-Location $game
          if ((& ./rmp.ps1 --mode) -ne "game") { throw "the new game says it is the framework" }
          # Counted, not filtered: an empty answer must not read as "none wrong".
          $index = @(& git ls-files -s rmp raymob/gradlew)
          $exec = @($index | Where-Object { $_ -match '^100755 ' })
          if ($index.Count -ne 2 -or $exec.Count -ne 2) {
            throw "rmp and raymob/gradlew are not both executable in the game's index:`n$($index -join "`n")"
          }
          & ./rmp.ps1 test config
          if ($LASTEXITCODE -ne 0) { throw "the new game's rmp test config exited $LASTEXITCODE" }
          Write-Host "PASS: a game made on Windows passes its own rmp test config"

      # The one-liner a Windows user pastes, `irm .../install.ps1 | iex`, run the
      # way iex runs it: inside the session it was typed in, where an `exit`
      # would end that session -- so the marker after it must print. Under
      # Windows PowerShell 5.1 and pwsh, each into a temporary LOCALAPPDATA,
      # from this commit as a fresh one-commit repository (a blobless clone of
      # the shallow checkout itself loops in git's promisor fetch). The User
      # PATH it wrote is read back from the registry, type and all, and a cmd
      # given that PATH finds the shim first. Then the User PATH is put back.
      - name: install.ps1 under iex, then rmp from the User PATH
        if: inputs.framework
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          $src = Join-Path $env:RUNNER_TEMP 'rmp-source'
          $tar = Join-Path $env:RUNNER_TEMP 'rmp-source.tar'
          New-Item -ItemType Directory -Force $src | Out-Null
          & git archive -o $tar HEAD
          if ($LASTEXITCODE -ne 0) { throw "git archive exited $LASTEXITCODE" }
          # Windows' own bsdtar: a GNU tar reads C: as a host to connect to.
          & "$env:SystemRoot\System32\tar.exe" -xf $tar -C $src
          if ($LASTEXITCODE -ne 0) { throw "tar exited $LASTEXITCODE" }
          & git -C $src init -q -b main
          & git -C $src add -A
          & git -C $src -c user.name=ci -c user.email=ci@localhost commit -q -m source
          if ($LASTEXITCODE -ne 0) { throw "the source commit exited $LASTEXITCODE" }
          $env:RMP_INSTALL_SOURCE = $src
          $script = Join-Path (Get-Location).Path 'tools\install.ps1'
          $key = Get-Item 'HKCU:\Environment'
          $had = $key.GetValueNames() -contains 'Path'
          $before = ''
          $kind = [Microsoft.Win32.RegistryValueKind]::ExpandString
          if ($had) {
            $before = $key.GetValue('Path', '', 'DoNotExpandEnvironmentNames')
            $kind = $key.GetValueKind('Path')
          }
          $stepPath = $env:Path
          foreach ($shell in 'powershell', 'pwsh') {
            $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "local-$shell"
            New-Item -ItemType Directory -Force $env:LOCALAPPDATA | Out-Null
            $out = @(& $shell -NoProfile -NonInteractive -Command "Get-Content -Raw '$script' | Invoke-Expression; 'RMP_AFTER_IEX'")
            $out | ForEach-Object { Write-Host $_ }
            if ($out -notcontains 'RMP_AFTER_IEX') { throw "install.ps1 under $shell never came back to the line after it" }
            $shims = Join-Path $env:LOCALAPPDATA 'Programs\rmp'
            $key = Get-Item 'HKCU:\Environment'
            $user = $key.GetValue('Path', '', 'DoNotExpandEnvironmentNames')
            if (($user -split ';') -notcontains $shims) { throw "after ${shell}, the User PATH does not name ${shims}: $user" }
            if ($key.GetValueKind('Path') -ne $kind) { throw "after ${shell}, the User PATH is $($key.GetValueKind('Path')), and it was $kind" }
            $env:Path = $stepPath + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
            Push-Location $env:RUNNER_TEMP
            try {
              $where = @(& cmd /c where rmp)
              $help = (& cmd /c rmp help) -join "`n"
            } finally {
              Pop-Location
              $env:Path = $stepPath
            }
            if ($where[0] -ne (Join-Path $shims 'rmp.cmd')) { throw "cmd finds $($where[0]) first, not the shim in $shims" }
            if (-not $help.StartsWith('usage: rmp')) { throw "rmp help through the shim printed: $help" }
            $writable = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment', $true)
            if ($had) { $writable.SetValue('Path', $before, $kind) } else { $writable.DeleteValue('Path') }
            $writable.Close()
            Write-Host "PASS: install.ps1 under $shell came back, and cmd finds rmp through the User PATH"
          }
          exit 0

  arm64:
    # Cross-compiled with MSVC. Static checks only: an ARM64 PE cannot run on
    # the x64 host, and there is no ARM64 Windows runner in the free tier.
    if: inputs.full && contains(fromJSON(inputs.targets), 'windows-arm64')
    runs-on: ${{ inputs.runner }}
    defaults:
      run:
        # `runs-on` is an expression, so nothing can infer the platform any
        # more — actionlint was shellchecking these PowerShell steps as bash.
        shell: pwsh
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Inline vcvarsall (no third-party action: the common ones still run Node 20)
      - name: Set up MSVC arm64 cross environment (vcvarsall)
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vcvars = & $vswhere -latest -products * -find "VC\Auxiliary\Build\vcvarsall.bat" | Select-Object -First 1
          if (-not $vcvars) { throw "vcvarsall.bat not found" }
          cmd /c "`"$vcvars`" amd64_arm64 >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
          }

      # The icon. Windows keeps it INSIDE the .exe: tools/configure.py makes an
      # .ico out of [icon] source and the resource compiler embeds it -- with
      # Pillow, and without Pillow it skips that in silence, because an icon
      # must never fail a developer's build. The image carries Pillow and this
      # runner is not the image, so it is installed here, at the version and
      # with the hashes FROZEN_VERSIONS.md pins (pip refuses any other wheel),
      # and configure.py runs with it before CMake does. CMake's own run of it
      # may find a Python without Pillow; that one leaves the .ico alone.
      - name: Pillow (pinned), and the icon it makes
        run: |
          $ErrorActionPreference = "Stop"
          $frozen = "thirdparty/FROZEN_VERSIONS.md"
          $ver = (Select-String -Path $frozen -Pattern '^pillow +(\S+)').Matches[0].Groups[1].Value
          $hashes = @(Select-String -Path $frozen -Pattern '^pillow_sha256_\S+ +([0-9a-f]{64})' |
                      ForEach-Object { $_.Matches[0].Groups[1].Value })
          if (-not $ver -or $hashes.Count -eq 0) { throw "no pillow pin in $frozen" }
          $req = Join-Path $env:RUNNER_TEMP "pillow-requirements.txt"
          Set-Content -Path $req -Value ("pillow==$ver " + (($hashes | ForEach-Object { "--hash=sha256:$_" }) -join " "))
          python -m pip install --disable-pip-version-check --no-deps --only-binary=:all: --require-hashes -r $req
          python tools/configure.py
          $src = (python tools/configure.py --print-config | ConvertFrom-Json).config.icon.source
          if ((Test-Path $src) -and -not (Test-Path cmake/generated/app_icon.rc)) {
            Write-Host "FAIL: [icon] source $src exists and configure.py made no app_icon.rc"; exit 1
          }
          Write-Host "icon: $src -> $(@(Get-ChildItem cmake/generated/app_icon.*).Name -join ', ')"

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release

      - name: Test (static) — .exe exists, is a PE, targets ARM64
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "build/release/${{ inputs.project_name }}.exe"
          if (-not (Test-Path $exe)) { Write-Host "FAIL: $exe not found"; exit 1 }
          if ((Get-Item $exe).Length -eq 0) { Write-Host "FAIL: $exe is empty"; exit 1 }
          $b = [System.IO.File]::ReadAllBytes($exe)
          if (-not ($b[0] -eq 0x4D -and $b[1] -eq 0x5A)) { Write-Host "FAIL: not a PE (no MZ header)"; exit 1 }
          # PE header: e_lfanew at 0x3C -> machine type at +4 (0xAA64 = ARM64)
          $pe = [BitConverter]::ToInt32($b, 0x3C)
          $machine = [BitConverter]::ToUInt16($b, $pe + 4)
          if ($machine -ne 0xAA64) { Write-Host "FAIL: machine type 0x$($machine.ToString('X4')) != ARM64 (0xAA64)"; exit 1 }
          Write-Host "PASS: static binary checks (ARM64 PE, $((Get-Item $exe).Length) bytes)"

      # This .exe never runs here, so its import table is the only thing that
      # can say it will start on a player's machine: MSVC with the dynamic CRT
      # imports VCRUNTIME140.dll and MSVCP140.dll, which Windows does not ship.
      - name: Test (static) -- the .exe imports nothing Windows does not ship
        run: |
          # With an app_icon.rc, CMake compiled it in, so the .exe must carry
          # the icon too; the Pillow step makes sure the .rc is there.
          $check = @("tools/binary_check.py", "windows", "build/release/${{ inputs.project_name }}.exe")
          if (Test-Path cmake/generated/app_icon.rc) { $check += "--require-icon" }
          python @check

      # Cross-compiled target: the rres packer is built for ARM64 and cannot run
      # on the x64 host, so ship loose resources (the game falls back to them).
      # The zip says so too -- see PACK_SKIPPED.txt below. Every other archive
      # in this pipeline carries resources/resources.rres and nothing else, and
      # a difference nobody wrote down is a difference somebody debugs.
      - name: Package
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item build/release/${{ inputs.project_name }}.exe package/
          Copy-Item resources package/ -Recurse
          @(
            "resources.rres was NOT built for this archive.",
            "windows-arm64 is cross-compiled with MSVC, so the rres packer comes out as",
            "an ARM64 binary and cannot run on the x64 host that builds it. The loose",
            "files next to this note are the same assets; the game reads them when",
            "there is no pack. See .github/workflows/_windows.yml."
          ) | Set-Content package/resources/PACK_SKIPPED.txt
          # LICENSES.txt: generated by tools/configure.py from the licence
          # files in thirdparty/. Absent when [deploy] licenses = false.
          if (Test-Path cmake/generated/LICENSES.txt) { Copy-Item cmake/generated/LICENSES.txt package/ }
          # UPX, if [upx] asked for this target. OFF by default, and the .toml
          # says why: an unsigned .exe that has been UPX-packed is a shape
          # Windows Defender associates with malware.
          $wanted = (python tools/configure.py --print-upx)
          if ($wanted -match '"windows-arm64"') {
            $ver = (Select-String -Path thirdparty/FROZEN_VERSIONS.md -Pattern '^upx +(\S+)').Matches[0].Groups[1].Value
            $sha = (Select-String -Path thirdparty/FROZEN_VERSIONS.md -Pattern '^upx_sha256_win64 +(\S+)').Matches[0].Groups[1].Value
            $url = "https://github.com/upx/upx/releases/download/v$ver/upx-$ver-win64.zip"
            Invoke-WebRequest -Uri $url -OutFile upx.zip
            $got = (Get-FileHash upx.zip -Algorithm SHA256).Hash.ToLower()
            if ($got -ne $sha) { throw "upx checksum mismatch: expected $sha, got $got" }
            Expand-Archive upx.zip -DestinationPath upxdir
            $upx = Get-ChildItem -Recurse upxdir -Filter upx.exe | Select-Object -First 1
            $before = (Get-Item "package/${{ inputs.project_name }}.exe").Length
            & $upx.FullName --best --lzma -q "package/${{ inputs.project_name }}.exe"
            & $upx.FullName -t "package/${{ inputs.project_name }}.exe"
            $after = (Get-Item "package/${{ inputs.project_name }}.exe").Length
            Write-Host "  upx: windows-arm64  $before -> $after bytes"
          } else {
            Write-Host "  upx: windows-arm64 is not in [upx] enabled — leaving the binary alone"
          }
          Compress-Archive -Path package/* -DestinationPath windows-arm64-build.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: windows-arm64-build
          path: windows-arm64-build.zip
          retention-days: 7
