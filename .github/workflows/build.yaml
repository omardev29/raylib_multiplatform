# Multiplatform build & release.
#
# Linux jobs run INSIDE the frozen build-image, so toolchains are pinned and
# nothing is downloaded at job time. That image is built from its own repo:
# https://github.com/omardev29/raylib-build-image
#
# Windows/macOS/BSD jobs run on their native hosted runners. Every runner label
# is pinned to a concrete image (never `-latest`) and every third-party action
# is pinned by full commit SHA, with the tag it resolves to in the comment.
#
# Platforms: Linux x64/ARM64/RISC-V, Windows x64/ARM64, macOS, iOS, Web,
# Android, FreeBSD, OpenBSD, NetBSD.

name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Least privilege by default; the jobs that need more ask for it explicitly.
permissions:
  contents: read

# Superseded runs on a branch are wasted minutes, but a tag build is a release
# artifact — never cancel one of those out from under itself.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  PROJECT_NAME: ray_test

jobs:
  # ---------------------------------------------------------------------------
  # Linux x64 (inside the frozen container)
  # ---------------------------------------------------------------------------
  build-linux-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    container:
      # Pinned by DIGEST, not by tag. `:latest` moves; a digest cannot, so a
      # rebuild of the image repo can never silently change what this job
      # compiles with. Bump it from the raylib-build-image run summary.
      # NOTE: the `env` context is not allowed in container.image, which is why
      # this literal is repeated per job until the reusable-workflow split
      # turns it into a single input.
      image: ghcr.io/omardev29/raylib-build@sha256:a79c538bfa11d0732b7dc2994ee8c255acba2d136696e497cbf2ea59b77d9655
    steps:
      - name: Build image manifest
        run: cat /etc/raylib-build-image.json

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Configure
        run: cmake --preset release

      - name: Build (game + rres packer)
        run: cmake --build build

      - name: Pack resources (AES rres)
        run: cmake --build build --target pack_resources

      - name: Test (static) — binary exists, is x86-64 ELF, executable
        run: |
          set -e
          BIN=build/${{ env.PROJECT_NAME }}
          test -f "$BIN" || { echo "FAIL: $BIN not found"; exit 1; }
          test -x "$BIN" || { echo "FAIL: $BIN not executable"; exit 1; }
          test -s "$BIN" || { echo "FAIL: $BIN empty"; exit 1; }
          # Portable ELF checks with od (`file` is not installed in the image):
          # magic 7f454c46, e_machine at offset 0x12 (x86-64 = 0x003E -> "3e00").
          MAGIC=$(od -An -tx1 -N4 "$BIN" | tr -d ' \n')
          [ "$MAGIC" = "7f454c46" ] || { echo "FAIL: not an ELF (magic=$MAGIC)"; exit 1; }
          MACHINE=$(od -An -tx1 -j18 -N2 "$BIN" | tr -d ' \n')
          [ "$MACHINE" = "3e00" ] || { echo "FAIL: not x86-64 (e_machine=$MACHINE)"; exit 1; }
          echo "PASS: static binary checks ($(wc -c < "$BIN") bytes)"

      - name: Test (runtime) — boot headless, render frames, verify output
        run: |
          set -e
          OUT=/tmp/ray_test_out.txt
          # Run headless under a virtual X server for a bounded number of frames.
          # Explicit 24-bit screen: the render read-back needs a real colour
          # depth, and xvfb-run's default has changed across versions.
          RAY_TEST_MAX_FRAMES=30 xvfb-run -a -s "-screen 0 1280x720x24" \
            timeout 180 ./build/${{ env.PROJECT_NAME }} >"$OUT" 2>&1 \
            || { echo "FAIL: game exited non-zero"; cat "$OUT"; exit 1; }
          echo "--- captured output ---"; cat "$OUT"
          grep -q "RAY_TEST_BOOT_OK"     "$OUT" || { echo "FAIL: boot marker missing"; exit 1; }
          # Booting proves the window and the assets are fine and nothing more.
          # RAY_TEST_RENDER_OK is the gate that a blank frame cannot pass.
          grep -q "RAY_TEST_RENDER_OK"   "$OUT" || { echo "FAIL: render marker missing (blank frame?)"; exit 1; }
          grep -q "RAY_TEST_DONE_FRAMES" "$OUT" || { echo "FAIL: frame marker missing"; exit 1; }
          echo "PASS: runtime boot + render test"

      - name: Package
        run: |
          mkdir -p package/resources
          cp build/${{ env.PROJECT_NAME }} package/
          cp resources/resources.rres package/resources/
          cd package && zip -r ../linux-x64-build.zip .

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: linux-x64-build
          path: linux-x64-build.zip
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Linux ARM64 (native arm64 runner + arm64 image variant)
  # ---------------------------------------------------------------------------
  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    container:
      # Pinned by DIGEST, not by tag. `:latest` moves; a digest cannot, so a
      # rebuild of the image repo can never silently change what this job
      # compiles with. Bump it from the raylib-build-image run summary.
      # NOTE: the `env` context is not allowed in container.image, which is why
      # this literal is repeated per job until the reusable-workflow split
      # turns it into a single input.
      image: ghcr.io/omardev29/raylib-build@sha256:a79c538bfa11d0732b7dc2994ee8c255acba2d136696e497cbf2ea59b77d9655
    steps:
      - name: Build image manifest
        run: cat /etc/raylib-build-image.json

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build build

      - name: Pack resources (AES rres)
        run: cmake --build build --target pack_resources

      - name: Test (static) — binary exists, is aarch64 ELF, executable
        run: |
          set -e
          BIN=build/${{ env.PROJECT_NAME }}
          test -f "$BIN" || { echo "FAIL: $BIN not found"; exit 1; }
          test -x "$BIN" || { echo "FAIL: $BIN not executable"; exit 1; }
          test -s "$BIN" || { echo "FAIL: $BIN empty"; exit 1; }
          # Portable ELF checks with od: magic + e_machine (ARM64 = 0x00B7 -> "b700").
          MAGIC=$(od -An -tx1 -N4 "$BIN" | tr -d ' \n')
          [ "$MAGIC" = "7f454c46" ] || { echo "FAIL: not an ELF (magic=$MAGIC)"; exit 1; }
          MACHINE=$(od -An -tx1 -j18 -N2 "$BIN" | tr -d ' \n')
          [ "$MACHINE" = "b700" ] || { echo "FAIL: not ARM64 (e_machine=$MACHINE)"; exit 1; }
          echo "PASS: static binary checks ($(wc -c < "$BIN") bytes)"

      - name: Test (runtime) — boot headless, render frames, verify output
        run: |
          set -e
          OUT=/tmp/ray_test_out.txt
          # Explicit 24-bit screen: the render read-back needs a real colour
          # depth, and xvfb-run's default has changed across versions.
          RAY_TEST_MAX_FRAMES=30 xvfb-run -a -s "-screen 0 1280x720x24" \
            timeout 180 ./build/${{ env.PROJECT_NAME }} >"$OUT" 2>&1 \
            || { echo "FAIL: game exited non-zero"; cat "$OUT"; exit 1; }
          echo "--- captured output ---"; cat "$OUT"
          grep -q "RAY_TEST_BOOT_OK"     "$OUT" || { echo "FAIL: boot marker missing"; exit 1; }
          # Booting proves the window and the assets are fine and nothing more.
          # RAY_TEST_RENDER_OK is the gate that a blank frame cannot pass.
          grep -q "RAY_TEST_RENDER_OK"   "$OUT" || { echo "FAIL: render marker missing (blank frame?)"; exit 1; }
          grep -q "RAY_TEST_DONE_FRAMES" "$OUT" || { echo "FAIL: frame marker missing"; exit 1; }
          echo "PASS: runtime boot + render test"

      - name: Package
        run: |
          mkdir -p package/resources
          cp build/${{ env.PROJECT_NAME }} package/
          cp resources/resources.rres package/resources/
          cd package && zip -r ../linux-arm64-build.zip .

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: linux-arm64-build
          path: linux-arm64-build.zip
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Linux RISC-V (cross-compiled inside the amd64 container). First-class target:
  # the build image ships the riscv64 X11/GL multiarch libs.
  # ---------------------------------------------------------------------------
  build-linux-riscv64:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    container:
      # Pinned by DIGEST, not by tag. `:latest` moves; a digest cannot, so a
      # rebuild of the image repo can never silently change what this job
      # compiles with. Bump it from the raylib-build-image run summary.
      # NOTE: the `env` context is not allowed in container.image, which is why
      # this literal is repeated per job until the reusable-workflow split
      # turns it into a single input.
      image: ghcr.io/omardev29/raylib-build@sha256:a79c538bfa11d0732b7dc2994ee8c255acba2d136696e497cbf2ea59b77d9655
    steps:
      - name: Build image manifest
        run: cat /etc/raylib-build-image.json

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Configure (riscv64 toolchain)
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release -DPRODUCTION_BUILD=ON
          -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-riscv64-linux.cmake

      - name: Build
        run: cmake --build build

      - name: Test (static) — binary exists, is RISC-V ELF, executable
        run: |
          set -e
          BIN=build/${{ env.PROJECT_NAME }}
          test -f "$BIN" || { echo "FAIL: $BIN not found"; exit 1; }
          test -x "$BIN" || { echo "FAIL: $BIN not executable"; exit 1; }
          test -s "$BIN" || { echo "FAIL: $BIN empty"; exit 1; }
          # Portable ELF checks with od: magic + e_machine (RISC-V = 0x00F3 -> "f300").
          MAGIC=$(od -An -tx1 -N4 "$BIN" | tr -d ' \n')
          [ "$MAGIC" = "7f454c46" ] || { echo "FAIL: not an ELF (magic=$MAGIC)"; exit 1; }
          MACHINE=$(od -An -tx1 -j18 -N2 "$BIN" | tr -d ' \n')
          [ "$MACHINE" = "f300" ] || { echo "FAIL: not RISC-V (e_machine=$MACHINE)"; exit 1; }
          echo "PASS: static binary checks ($(wc -c < "$BIN") bytes)"

      - name: Package
        run: |
          mkdir -p package/resources
          cp build/${{ env.PROJECT_NAME }} package/
          cp -r resources package/
          cd package && zip -r ../linux-riscv64-build.zip .

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: linux-riscv64-build
          path: linux-riscv64-build.zip
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Web (Emscripten from the frozen image)
  # ---------------------------------------------------------------------------
  build-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    container:
      # Pinned by DIGEST, not by tag. `:latest` moves; a digest cannot, so a
      # rebuild of the image repo can never silently change what this job
      # compiles with. Bump it from the raylib-build-image run summary.
      # NOTE: the `env` context is not allowed in container.image, which is why
      # this literal is repeated per job until the reusable-workflow split
      # turns it into a single input.
      image: ghcr.io/omardev29/raylib-build@sha256:a79c538bfa11d0732b7dc2994ee8c255acba2d136696e497cbf2ea59b77d9655
    steps:
      - name: Build image manifest
        run: cat /etc/raylib-build-image.json

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Configure
        run: cmake --preset web

      - name: Build
        run: cmake --build --preset web

      - name: Test (static) — web artifacts exist and are non-empty
        run: |
          set -e
          cd build/web
          for f in ${{ env.PROJECT_NAME }}.html ${{ env.PROJECT_NAME }}.js \
                   ${{ env.PROJECT_NAME }}.wasm ${{ env.PROJECT_NAME }}.data; do
            test -s "$f" || { echo "FAIL: $f missing or empty"; exit 1; }
            echo "ok: $f ($(stat -c%s "$f") bytes)"
          done
          echo "PASS: web artifact checks"

      - name: Package
        run: |
          cd build/web
          zip -r ../../web-build.zip \
            ${{ env.PROJECT_NAME }}.html ${{ env.PROJECT_NAME }}.js \
            ${{ env.PROJECT_NAME }}.wasm ${{ env.PROJECT_NAME }}.data

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: web-build
          path: web-build.zip
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Web boot test (level 2): boot the web build in headless Chromium with
  # Playwright and verify the engine initialises and renders. Runs on the
  # ubuntu runner (node preinstalled), downloading the web artifact.
  # ---------------------------------------------------------------------------
  test-web:
    needs: build-web
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Download web artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: web-build
          path: web

      - name: Unpack web build
        run: |
          cd web
          unzip -o web-build.zip
          ls -la

      # Pinned via the committed package-lock.json. The Chromium build is
      # keyed to the Playwright version, so `npm ci` pins the browser too.
      - name: Install Playwright + Chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Serve and boot + render test (headless Chromium)
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
        run: |
          python3 -m http.server 8000 --directory web &
          SRV=$!
          sleep 3
          node .github/scripts/web_boot_test.js "http://localhost:8000/${{ env.PROJECT_NAME }}.html"
          rc=$?
          kill $SRV 2>/dev/null || true
          exit $rc

  # ---------------------------------------------------------------------------
  # Android (SDK/NDK from the frozen image; gradle caches reduce downloads)
  # ---------------------------------------------------------------------------
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    container:
      # Pinned by DIGEST, not by tag. `:latest` moves; a digest cannot, so a
      # rebuild of the image repo can never silently change what this job
      # compiles with. Bump it from the raylib-build-image run summary.
      # NOTE: the `env` context is not allowed in container.image, which is why
      # this literal is repeated per job until the reusable-workflow split
      # turns it into a single input.
      image: ghcr.io/omardev29/raylib-build@sha256:a79c538bfa11d0732b7dc2994ee8c255acba2d136696e497cbf2ea59b77d9655
    steps:
      - name: Build image manifest
        run: cat /etc/raylib-build-image.json

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('raymob/**/*.gradle*', 'raymob/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-

      - name: Build debug APK
        working-directory: raymob
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Test (static) — APK exists, is a valid zip with manifest + native lib
        run: |
          set -e
          APK=$(find raymob/app/build/outputs/apk/debug -name '*.apk' | head -1)
          test -s "$APK" || { echo "FAIL: APK missing or empty"; exit 1; }
          echo "ok: $APK ($(stat -c%s "$APK") bytes)"
          unzip -l "$APK" | grep -q "AndroidManifest.xml" || { echo "FAIL: no AndroidManifest.xml"; exit 1; }
          unzip -l "$APK" | grep -q "\.so"                || { echo "FAIL: no native .so"; exit 1; }
          echo "PASS: APK checks"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: android-debug-apk
          path: raymob/app/build/outputs/apk/debug/*.apk
          retention-days: 7

      # --- Release AAB -----------------------------------------------------
      # The AAB used to be built ONLY when Play-signing secrets existed, which
      # meant that on this repo, and in every fork, the bundle path was never
      # exercised at all — the one artifact you cannot afford to discover is
      # broken on release day. It is now always built and always verified. When
      # no real key is configured CI signs with a throwaway one and labels the
      # result so it can never be mistaken for something publishable.
      #
      # To publish for real, add these repo secrets:
      #   ANDROID_KEYSTORE_BASE64    base64 -w0 your-upload-keystore.jks
      #   ANDROID_KEYSTORE_PASSWORD
      #   ANDROID_KEY_ALIAS
      #   ANDROID_KEY_PASSWORD
      - name: Prepare signing key
        id: signing
        working-directory: raymob
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "Using the configured upload key."
          else
            # Throwaway key, generated fresh every run and never reused. Its CN
            # is asserted below, which is what stops a CI-signed bundle passing
            # itself off as a real one.
            keytool -genkeypair -v \
              -keystore release.keystore -storetype PKCS12 \
              -alias ci-throwaway -keyalg RSA -keysize 2048 -validity 3650 \
              -storepass ci-throwaway -keypass ci-throwaway \
              -dname "CN=CI THROWAWAY NOT FOR PLAY, OU=CI, O=raylib-template, C=ZZ"
            echo "mode=ci" >> "$GITHUB_OUTPUT"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret; signing the AAB with a throwaway CI key. It is NOT publishable to Google Play."
          fi

      - name: Build release AAB
        working-directory: raymob
        env:
          # Absolute path: Gradle resolves relative file() paths against the
          # app module dir (raymob/app), not the step working directory.
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/raymob/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'ci-throwaway' }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'ci-throwaway' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'ci-throwaway' }}
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Test (static) — AAB is well-formed and correctly signed
        run: |
          set -euo pipefail
          BUNDLE=$(find raymob/app/build/outputs/bundle/release -name '*.aab' | head -1)
          test -s "$BUNDLE" || { echo "FAIL: AAB missing or empty"; exit 1; }
          echo "ok: $BUNDLE ($(stat -c%s "$BUNDLE") bytes)"
          unzip -l "$BUNDLE" | grep -q "BundleConfig.pb" || { echo "FAIL: no BundleConfig.pb"; exit 1; }

          # `unzip -l | grep META-INF/.*\.SF` only proves a signature block is
          # present, not whose it is or whether it verifies. jarsigner actually
          # checks it.
          jarsigner -verify -strict "$BUNDLE" | tee /tmp/jarsigner.txt
          grep -q "jar verified" /tmp/jarsigner.txt || { echo "FAIL: AAB signature does not verify"; exit 1; }

          SIGNER_CN=$(keytool -printcert -jarfile "$BUNDLE" | grep -m1 "Owner:" || true)
          echo "signer: $SIGNER_CN"
          case "${{ steps.signing.outputs.mode }}" in
            release)
              # A real key must not be the throwaway one — that would mean the
              # secret was empty and we silently shipped a CI signature.
              echo "$SIGNER_CN" | grep -q "CI THROWAWAY" \
                && { echo "FAIL: mode=release but the bundle is signed with the throwaway CI key"; exit 1; }
              echo "PASS: AAB verified and signed with the configured upload key" ;;
            *)
              echo "$SIGNER_CN" | grep -q "CI THROWAWAY" \
                || { echo "FAIL: mode=ci but the signer is not the throwaway key"; exit 1; }
              echo "PASS: AAB verified (throwaway CI signature, not publishable)" ;;
          esac

      # Two artifact names, on purpose. Only `android-release-aab` is attached
      # to the GitHub release, so a throwaway-signed bundle physically cannot
      # end up as a release asset.
      - name: Upload release AAB (real upload key)
        if: steps.signing.outputs.mode == 'release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: android-release-aab
          path: raymob/app/build/outputs/bundle/release/*.aab
          retention-days: 7

      - name: Rename + upload CI-signed AAB
        if: steps.signing.outputs.mode != 'release'
        run: |
          set -euo pipefail
          BUNDLE=$(find raymob/app/build/outputs/bundle/release -name '*.aab' | head -1)
          mv "$BUNDLE" "${BUNDLE%.aab}-NOT-FOR-PLAY.aab"
          ls -la raymob/app/build/outputs/bundle/release/

      - name: Upload CI-signed AAB
        if: steps.signing.outputs.mode != 'release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: android-unsigned-aab
          path: raymob/app/build/outputs/bundle/release/*-NOT-FOR-PLAY.aab
          retention-days: 7

      # raymob's preBuild rewrites tracked sources in place (package renames in
      # thirdparty/raymob/*.c and app/src/main/java/**) and only puts them back
      # in gradle.buildFinished. A cancelled, timed-out or OOM-killed build
      # therefore leaves the working tree quietly corrupted, and the NEXT run
      # then "restores" the wrong thing. Fail loudly instead of carrying on.
      - name: Guard — Gradle restored the sources it rewrote
        if: always()
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git diff --exit-code -- \
            thirdparty/raymob \
            raymob/app/src/main/java \
            raymob/app/proguard-rules.pro \
            || { echo "FAIL: Gradle left the working tree modified (preBuild rewrite not restored)"; exit 1; }
          echo "PASS: working tree clean"

  # ---------------------------------------------------------------------------
  # Windows x64
  # ---------------------------------------------------------------------------
  build-windows-x64:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release

      - name: Pack resources (AES rres)
        run: cmake --build build --target pack_resources

      - name: Test (static) — .exe exists and is a PE executable
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "build/${{ env.PROJECT_NAME }}.exe"
          if (-not (Test-Path $exe)) { Write-Host "FAIL: $exe not found"; exit 1 }
          if ((Get-Item $exe).Length -eq 0) { Write-Host "FAIL: $exe is empty"; exit 1 }
          $head = [System.IO.File]::ReadAllBytes($exe)[0..1]
          if (-not ($head[0] -eq 0x4D -and $head[1] -eq 0x5A)) { Write-Host "FAIL: not a PE (no MZ header)"; exit 1 }
          Write-Host "PASS: static binary checks ($((Get-Item $exe).Length) bytes)"

      # Hosted Windows runners have no GPU, so GLFW used to fail to create a GL
      # context and the render loop faulted right after boot. The old test
      # tolerated that crash, which meant ANY render regression passed CI in
      # silence. Mesa's software rasteriser gives a real WGL context on the
      # real runner, so the shipped binary can be rendered and checked for
      # actual pixels — no emulation, no translation layer.
      - name: Set up Mesa software OpenGL (pinned)
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/pal1000/mesa-dist-win/releases/download/26.1.6/mesa3d-26.1.6-release-msvc.7z"
          $sha = "86b506ad38b8dae9d37bdade656a9003518d717bf4ff5475ff3f746e4ee768eb"
          Invoke-WebRequest -Uri $url -OutFile mesa.7z
          $got = (Get-FileHash mesa.7z -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $sha) { Write-Host "FAIL: mesa sha256 mismatch`n  got      $got`n  expected $sha"; exit 1 }
          7z x mesa.7z -omesa -y | Out-Null
          # Windows resolves DLLs from the application directory first, so
          # dropping these next to the .exe overrides the system opengl32.
          # They are deleted again before packaging: they must never ship.
          Copy-Item mesa/x64/opengl32.dll,mesa/x64/libgallium_wgl.dll,mesa/x64/dxil.dll build/
          Write-Host "Mesa 26.1.6 staged next to the executable"

      - name: Test (runtime) — boot, render frames, verify pixels
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Resolve-Path "build/${{ env.PROJECT_NAME }}.exe"

          function Invoke-Game([string]$driver) {
            Remove-Item out.txt,err.txt -ErrorAction SilentlyContinue
            $env:RAY_TEST_MAX_FRAMES = "30"
            $env:GALLIUM_DRIVER = $driver
            $proc = Start-Process -FilePath $exe -RedirectStandardOutput out.txt `
                                  -RedirectStandardError err.txt -PassThru
            if (-not $proc.WaitForExit(180000)) {
              $proc.Kill()
              return @{ ok = $false; code = -1; text = "TIMEOUT" }
            }
            $text = ((Get-Content out.txt -ErrorAction SilentlyContinue) +
                     (Get-Content err.txt -ErrorAction SilentlyContinue)) -join "`n"
            return @{ ok = ($proc.ExitCode -eq 0); code = $proc.ExitCode; text = $text }
          }

          # Fallback ladder. llvmpipe is the fast, well-supported path; softpipe
          # is the reference rasteriser; d3d12 goes through WARP. If all three
          # fail we genuinely cannot render here and the job should say so.
          $result = $null
          foreach ($drv in @("llvmpipe", "softpipe", "d3d12")) {
            Write-Host "=== attempt: GALLIUM_DRIVER=$drv ==="
            $r = Invoke-Game $drv
            Write-Host $r.text
            if ($r.ok -and $r.text -match "RAY_TEST_RENDER_OK") { $result = $r; $used = $drv; break }
            Write-Host "--- $drv did not produce a rendered frame (exit=$($r.code)) ---"
          }

          if ($null -eq $result) { Write-Host "FAIL: no Mesa driver produced a rendered frame"; exit 1 }

          $all = $result.text
          if ($all -notmatch "RAY_TEST_BOOT_OK texture=[1-9]\d*x[1-9]\d*") { Write-Host "FAIL: boot marker missing or texture not loaded"; exit 1 }
          if ($all -notmatch "RAY_TEST_RENDER_OK")   { Write-Host "FAIL: render marker missing (blank frame?)"; exit 1 }
          if ($all -notmatch "RAY_TEST_DONE_FRAMES") { Write-Host "FAIL: frame marker missing"; exit 1 }
          Write-Host "PASS: Windows boot + render verified on GALLIUM_DRIVER=$used"

      # The game must ship against the user's real driver. A stray Mesa
      # opengl32.dll in the zip would silently force software rendering on
      # every player's machine.
      - name: Remove Mesa from the build directory
        run: |
          Remove-Item build/opengl32.dll,build/libgallium_wgl.dll,build/dxil.dll -ErrorAction SilentlyContinue
          Remove-Item mesa.7z -ErrorAction SilentlyContinue
          Remove-Item mesa -Recurse -Force -ErrorAction SilentlyContinue

      - name: Package
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path package/resources | Out-Null
          Copy-Item build/${{ env.PROJECT_NAME }}.exe package/
          Copy-Item resources/resources.rres package/resources/
          Compress-Archive -Path package/* -DestinationPath windows-x64-build.zip
          # Belt and braces: forcing software GL on every player would be a
          # miserable bug to diagnose from a support ticket.
          $names = [IO.Compression.ZipFile]::OpenRead((Resolve-Path windows-x64-build.zip)).Entries.FullName
          if ($names -match 'opengl32\.dll|libgallium_wgl\.dll') { Write-Host "FAIL: Mesa leaked into the release zip"; exit 1 }
          Write-Host "PASS: package clean ($($names.Count) entries)"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: windows-x64-build
          path: windows-x64-build.zip
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Windows ARM64 (MSVC cross-compile). First-class target.
  # ---------------------------------------------------------------------------
  build-windows-arm64:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      # Inline vcvarsall (no third-party action: the common ones still run Node 20)
      - name: Set up MSVC arm64 cross environment (vcvarsall)
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vcvars = & $vswhere -latest -products * -find "VC\Auxiliary\Build\vcvarsall.bat" | Select-Object -First 1
          if (-not $vcvars) { throw "vcvarsall.bat not found" }
          cmd /c "`"$vcvars`" amd64_arm64 >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
          }

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release

      # Cross-compiled ARM64 binary: static checks only (cannot run on x64 host).
      - name: Test (static) — .exe exists, is a PE, targets ARM64
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "build/${{ env.PROJECT_NAME }}.exe"
          if (-not (Test-Path $exe)) { Write-Host "FAIL: $exe not found"; exit 1 }
          if ((Get-Item $exe).Length -eq 0) { Write-Host "FAIL: $exe is empty"; exit 1 }
          $b = [System.IO.File]::ReadAllBytes($exe)
          if (-not ($b[0] -eq 0x4D -and $b[1] -eq 0x5A)) { Write-Host "FAIL: not a PE (no MZ header)"; exit 1 }
          # PE header: e_lfanew at 0x3C -> machine type at +4 (0xAA64 = ARM64)
          $pe = [BitConverter]::ToInt32($b, 0x3C)
          $machine = [BitConverter]::ToUInt16($b, $pe + 4)
          if ($machine -ne 0xAA64) { Write-Host "FAIL: machine type 0x$($machine.ToString('X4')) != ARM64 (0xAA64)"; exit 1 }
          Write-Host "PASS: static binary checks (ARM64 PE, $((Get-Item $exe).Length) bytes)"

      # Cross-compiled target: the rres packer is built for ARM64 and cannot run
      # on the x64 host, so ship loose resources (the game falls back to them).
      - name: Package
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item build/${{ env.PROJECT_NAME }}.exe package/
          Copy-Item resources package/ -Recurse
          Compress-Archive -Path package/* -DestinationPath windows-arm64-build.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: windows-arm64-build
          path: windows-arm64-build.zip
          retention-days: 7

  # ---------------------------------------------------------------------------
  # macOS
  # ---------------------------------------------------------------------------
  build-macos:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      # Pinned Xcode, with a loud failure instead of a silent slide. `macos-26`
      # ships several Xcodes and prunes the non-default ones first, so pinning
      # the current default buys the most shelf life. When it does eventually
      # disappear this fails with the list of what IS installed, rather than
      # quietly building with a different compiler.
      - name: Select Xcode
        run: |
          set -euo pipefail
          WANT=26.6
          APP="/Applications/Xcode_${WANT}.app"
          if [ ! -d "$APP" ]; then
            echo "FAIL: Xcode ${WANT} is not installed on this runner. Available:"
            ls -d /Applications/Xcode*.app
            echo "Update the pin in .github/workflows (search for Xcode_)."
            exit 1
          fi
          sudo xcode-select -s "$APP/Contents/Developer"
          xcodebuild -version
          echo "SDKs:"; xcodebuild -showsdks | head -20

      # `brew install ninja` was a network call to an unversioned formula whose
      # macOS requirements move on Homebrew's schedule, not ours. A pinned,
      # checksummed release binary cannot surprise us.
      - name: Install Ninja (pinned)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/ninja-mac.zip \
            https://github.com/ninja-build/ninja/releases/download/v1.13.2/ninja-mac.zip
          echo "c99048673aa765960a99cf10c6ddb9f1fad506099ff0a0e137ad8960a88f321b  /tmp/ninja-mac.zip" \
            | shasum -a 256 -c -
          unzip -o -q /tmp/ninja-mac.zip -d /usr/local/bin
          chmod +x /usr/local/bin/ninja
          ninja --version

      # Universal binary: the runners are Apple Silicon, so an arm64-only build
      # left every Intel Mac user with nothing.
      - name: Configure
        run: cmake --preset release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build --preset release

      - name: Pack resources (AES rres)
        run: cmake --build build --target pack_resources

      - name: Test (static) — binary is a universal Mach-O with both slices
        run: |
          set -e
          BIN=build/${{ env.PROJECT_NAME }}
          test -f "$BIN" || { echo "FAIL: $BIN not found"; exit 1; }
          test -x "$BIN" || { echo "FAIL: $BIN not executable"; exit 1; }
          file "$BIN"
          file "$BIN" | grep -qi "Mach-O" || { echo "FAIL: not a Mach-O binary"; exit 1; }
          lipo -info "$BIN"
          lipo -info "$BIN" | grep -q "arm64"  || { echo "FAIL: no arm64 slice"; exit 1; }
          lipo -info "$BIN" | grep -q "x86_64" || { echo "FAIL: no x86_64 slice"; exit 1; }
          echo "PASS: universal Mach-O (arm64 + x86_64)"

      - name: Package
        run: |
          mkdir -p package/resources
          cp build/${{ env.PROJECT_NAME }} package/
          cp resources/resources.rres package/resources/
          cd package && zip -r ../macos-build.zip .

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: macos-build
          path: macos-build.zip
          retention-days: 7

  # ---------------------------------------------------------------------------
  # iOS (raylib-iOS fork + Xcode). First-class target; requires macOS + Xcode.
  # ---------------------------------------------------------------------------
  build-ios:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          submodules: recursive

      # Pinned Xcode, with a loud failure instead of a silent slide. `macos-26`
      # ships several Xcodes and prunes the non-default ones first, so pinning
      # the current default buys the most shelf life. When it does eventually
      # disappear this fails with the list of what IS installed, rather than
      # quietly building with a different compiler.
      - name: Select Xcode
        run: |
          set -euo pipefail
          WANT=26.6
          APP="/Applications/Xcode_${WANT}.app"
          if [ ! -d "$APP" ]; then
            echo "FAIL: Xcode ${WANT} is not installed on this runner. Available:"
            ls -d /Applications/Xcode*.app
            echo "Update the pin in .github/workflows (search for Xcode_)."
            exit 1
          fi
          sudo xcode-select -s "$APP/Contents/Developer"
          xcodebuild -version
          echo "SDKs:"; xcodebuild -showsdks | head -20

      # ios/project.yml hard-codes .../projects/Xcode26/raylib/bridge in its
      # header search path. That is upstream's folder name and the submodule is
      # pinned to a commit, so the path cannot move underneath us — but it WILL
      # break the day the submodule is bumped past a reorganisation. This turns
      # that into an obvious red step with an instruction, instead of a wall of
      # "IOSBridge.h not found" from clang.
      - name: Guard — the raylib-iOS bridge is where project.yml expects
        run: |
          BRIDGE=thirdparty/raylib-ios/projects/Xcode26/raylib/bridge/IOSBridge.h
          if [ ! -f "$BRIDGE" ]; then
            echo "FAIL: $BRIDGE is gone — the fork reorganised its projects/ layout."
            echo "Update HEADER_SEARCH_PATHS in ios/project.yml. Found instead:"
            find thirdparty/raylib-ios/projects -name 'IOSBridge.h' -o -name '*.h' | head -20
            exit 1
          fi
          echo "PASS: bridge header present"

      - name: Build raylib.xcframework (device + simulator)
        run: |
          cd thirdparty/raylib-ios/projects/scripts
          chmod +x build-ios-xcframework.sh
          ./build-ios-xcframework.sh

      # Same reasoning as ninja on macOS: a pinned, checksummed release binary
      # instead of an unversioned brew formula resolved at job time.
      - name: Install XcodeGen (pinned)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/xcodegen.zip \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  /tmp/xcodegen.zip" \
            | shasum -a 256 -c -
          unzip -o -q /tmp/xcodegen.zip -d /tmp/xcodegen-dist
          # Keep the bin/ + share/ layout: xcodegen resolves its SettingPresets
          # relative to the binary, so a bare copy of bin/xcodegen breaks.
          echo "/tmp/xcodegen-dist/xcodegen/bin" >> "$GITHUB_PATH"
          /tmp/xcodegen-dist/xcodegen/bin/xcodegen --version

      - name: Generate Xcode project
        run: cd ios && xcodegen generate

      # Explicit derived-data path so the .app has one known location, instead
      # of being hunted for with `find` across ~/Library/Developer.
      - name: Build app (simulator, no signing)
        run: |
          cd ios
          xcodebuild -project ray_test.xcodeproj -scheme ray_test \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ./dd \
            CODE_SIGNING_ALLOWED=NO build

      - name: Test (static) — xcframework + .app bundle exist
        run: |
          set -e
          test -d thirdparty/raylib-ios/raylib.xcframework || { echo "FAIL: raylib.xcframework missing"; exit 1; }
          APP=ios/dd/Build/Products/Debug-iphonesimulator/ray_test.app
          test -d "$APP" || { echo "FAIL: $APP not built"; ls -R ios/dd/Build/Products || true; exit 1; }
          test -x "$APP/ray_test" || { echo "FAIL: app binary missing"; exit 1; }
          file "$APP/ray_test" | grep -qi "Mach-O" || { echo "FAIL: not Mach-O"; exit 1; }
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"
          echo "PASS: iOS artifact checks ($APP)"

      # Runtime coverage. Until now iOS only proved a Mach-O file existed on
      # disk — the app was never once started. The simulator on these runners is
      # Apple Silicon with real Metal, and the app links ANGLE (ES3 over Metal),
      # which is what makes this possible at all; plain GL ES in the simulator
      # is dead.
      #
      # continue-on-error while it settles: it is new, it is the most
      # environment-sensitive step here, and a flaky gate that blocks releases
      # is worse than no gate. Promote it once it has a run of green behind it.
      - name: Test (runtime) — boot in the iOS Simulator
        continue-on-error: true
        run: |
          set -euo pipefail
          # Discover the runtime rather than hard-coding a version: the pinned
          # Xcode ships whatever iOS runtime it ships.
          RT=$(xcrun simctl list runtimes -j \
                | python3 -c "import json,sys; rs=[r['identifier'] for r in json.load(sys.stdin)['runtimes'] if r.get('isAvailable') and 'iOS' in r['identifier']]; print(rs[-1] if rs else '')")
          test -n "$RT" || { echo "FAIL: no available iOS simulator runtime"; xcrun simctl list runtimes; exit 1; }
          echo "runtime: $RT"

          UDID=$(xcrun simctl create ci-sim "iPhone 16" "$RT")
          trap 'xcrun simctl shutdown "$UDID" >/dev/null 2>&1 || true; xcrun simctl delete "$UDID" >/dev/null 2>&1 || true' EXIT
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

          xcrun simctl install "$UDID" "$APP_PATH"
          # SIMCTL_CHILD_* forwards the variable into the app process. Without
          # the frame budget the app never exits — UIKit owns the run loop.
          SIMCTL_CHILD_RAY_TEST_MAX_FRAMES=60 \
            timeout 240 xcrun simctl launch --console-pty "$UDID" com.example.raytest 2>&1 | tee /tmp/sim.log || true

          echo "--- simulator log ---"; cat /tmp/sim.log
          grep -q "RAY_TEST_BOOT_OK"   /tmp/sim.log || { echo "FAIL: boot marker missing"; exit 1; }
          grep -q "RAY_TEST_RENDER_OK" /tmp/sim.log || { echo "FAIL: render marker missing (blank frame?)"; exit 1; }
          echo "PASS: iOS simulator boot + render"

      - name: Package .app
        run: |
          set -e
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" ios-app-simulator.zip
          ls -la ios-app-simulator.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: ios-raylib-xcframework
          path: thirdparty/raylib-ios/raylib.xcframework
          retention-days: 7

      # The release used to ship only the xcframework — a library, not the game.
      # This is the simulator build of the app itself; it is unsigned and NOT
      # installable on a device (that needs an Apple developer account).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: ios-app-simulator
          path: ios-app-simulator.zip
          retention-days: 7

  # ---------------------------------------------------------------------------
  # BSDs via QEMU on a hosted Linux runner (cross-platform-actions).
  # First-class targets: FreeBSD, OpenBSD, NetBSD.
  # ---------------------------------------------------------------------------
  build-bsd:
    runs-on: ubuntu-24.04
    # Guard against the VM-readiness step hanging forever (see cross-platform-actions #158).
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: freebsd
            version: '15.1'
            arch: x86-64
          - os: freebsd
            version: '15.1'
            arch: arm64
          # NOTE: FreeBSD riscv64 is intentionally not built — FreeBSD publishes
          # no riscv64 binary packages (pkg reports "No packages available"),
          # so cmake/X11 cannot be installed there. RISC-V is covered by
          # linux-riscv64.
          - os: openbsd
            version: '7.9'
            arch: x86-64
          - os: openbsd
            version: '7.9'
            arch: arm64
          - os: netbsd
            version: '10.1'
            arch: x86-64
          # NOTE: NetBSD arm64 is intentionally not built — the pkgsrc binary
          # packages for 10.1/arm64 are built against newer lib versions than the
          # base image ships, and pkg_add/pkg_delete cannot reconcile the cascade
          # of version conflicts (building deps from source is impractical under
          # QEMU). NetBSD is covered by the x86-64 job.
          # NOTE: OpenBSD/NetBSD riscv64 are not available — cross-platform-actions
          # publishes no riscv64 disk image for them. RISC-V is still covered by
          # linux-riscv64.
    defaults:
      run:
        shell: cpa.sh {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Start ${{ matrix.os }} ${{ matrix.version }} (${{ matrix.arch }}) VM
        # v1.4.0. The AMX fix this job used to pin an untagged master commit
        # for ("Don't expose AMX to the guests", NetBSD boot failures on
        # Intel-AMX runners, issue #158) shipped in v1.3.0, so we are back on
        # a real release.
        uses: cross-platform-actions/action@24ef01df165c76df1ed2b9f9e9212e78dc2fc963  # v1.4.0
        with:
          operating_system: ${{ matrix.os }}
          version: ${{ matrix.version }}
          architecture: ${{ matrix.arch }}
          memory: 6G
          cpu_count: 2

      - name: Install deps + build inside the VM
        run: |
          set -e
          pwd; ls -la
          EXTRA_CMAKE=""
          GENERATOR="Ninja"
          case "${{ matrix.os }}" in
            freebsd)
              sudo pkg install -y cmake ninja git pkgconf \
                libX11 libXrandr libXi libXcursor libXinerama libglvnd mesa-libs ;;
            openbsd)
              sudo pkg_add cmake ninja git pkgconf
              # CMake cannot auto-detect the archiver for OpenBSD's clang; set
              # both CMAKE_AR and the compiler-specific CMAKE_C_COMPILER_AR.
              EXTRA_CMAKE="-DCMAKE_AR=/usr/bin/ar -DCMAKE_RANLIB=/usr/bin/ranlib \
                -DCMAKE_C_COMPILER_AR=/usr/bin/ar -DCMAKE_C_COMPILER_RANLIB=/usr/bin/ranlib" ;;
            netbsd)
              # NetBSD base has pkg_add (no pkgin by default); point it at the
              # pkgsrc binary packages for this release/arch. The pkgsrc binaries
              # are built against newer curl/nghttp2 than the base image ships and
              # pkg_add refuses to upgrade installed packages in place, so drop the
              # old curl/nghttp2 first so the new ones install cleanly. Skip git
              # (not needed to build; sources are already synced). NOTE: pkgsrc's
              # 'ninja' package is an IRC client, not the build tool, so build
              # with GNU make + the "Unix Makefiles" generator instead.
              # pkgsrc dirs use their own arch names (arm64 -> aarch64); uname -m
              # does not match, so map explicitly.
              case "${{ matrix.arch }}" in
                x86-64) PKG_ARCH="amd64" ;;
                arm64)  PKG_ARCH="aarch64" ;;
                *)      PKG_ARCH="$(uname -m)" ;;
              esac
              sudo /usr/sbin/pkg_delete curl nghttp2 2>/dev/null || true
              sudo env PKG_PATH="https://cdn.NetBSD.org/pub/pkgsrc/packages/NetBSD/$PKG_ARCH/${{ matrix.version }}/All/" \
                /usr/sbin/pkg_add cmake pkgconf gmake
              GENERATOR="Unix Makefiles"
              # CMake can't auto-detect the archiver on NetBSD either; point it
              # at the base ar/ranlib.
              EXTRA_CMAKE="-DCMAKE_MAKE_PROGRAM=/usr/pkg/bin/gmake \
                -DCMAKE_AR=/usr/bin/ar -DCMAKE_RANLIB=/usr/bin/ranlib \
                -DCMAKE_C_COMPILER_AR=/usr/bin/ar -DCMAKE_C_COMPILER_RANLIB=/usr/bin/ranlib" ;;
          esac
          rm -rf build
          cmake -B build -G "$GENERATOR" -DCMAKE_BUILD_TYPE=Release -DPRODUCTION_BUILD=ON $EXTRA_CMAKE
          cmake --build build
          # Static test: the binary exists, is executable, and has the ELF magic
          # (portable check with od; `file` is not always present on the BSDs).
          BIN=build/${{ env.PROJECT_NAME }}
          test -f "$BIN" || { echo "FAIL: $BIN not found"; exit 1; }
          test -x "$BIN" || { echo "FAIL: $BIN not executable"; exit 1; }
          test -s "$BIN" || { echo "FAIL: $BIN empty"; exit 1; }
          MAGIC=$(od -An -tx1 -N4 "$BIN" | tr -d ' \n')
          [ "$MAGIC" = "7f454c46" ] || { echo "FAIL: not an ELF (magic=$MAGIC)"; exit 1; }
          echo "PASS: static binary checks ($(wc -c < "$BIN") bytes)"

      # The cpa.sh shell syncs the VM filesystem back to the runner after each
      # step, so build/ is available here. This step runs on the RUNNER (shell:
      # bash overrides the job's cpa.sh default) to package + upload the artifact.
      - name: Package BSD artifact
        shell: bash
        run: |
          set -e
          test -f build/${{ env.PROJECT_NAME }} || { echo "FAIL: binary not synced back from VM"; exit 1; }
          mkdir -p package/resources
          cp build/${{ env.PROJECT_NAME }} package/
          cp -r resources package/
          cd package && zip -r "../bsd-${{ matrix.os }}-${{ matrix.arch }}-build.zip" .

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: bsd-${{ matrix.os }}-${{ matrix.arch }}-build
          path: bsd-${{ matrix.os }}-${{ matrix.arch }}-build.zip
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Release (on tag). Every platform is first-class: the release only runs when
  # ALL builds succeed — no target is silently skipped.
  # ---------------------------------------------------------------------------
  release:
    needs:
      - build-linux-x64
      - build-linux-arm64
      - build-linux-riscv64
      - build-web
      - test-web
      - build-android
      - build-windows-x64
      - build-windows-arm64
      - build-macos
      - build-ios
      - build-bsd
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # `always()` makes `needs` non-gating on its own, so every dependency has to
    # be re-asserted here by hand. Miss one and it silently stops blocking.
    if: >
      always() &&
      needs.build-linux-x64.result == 'success' &&
      needs.build-linux-arm64.result == 'success' &&
      needs.build-linux-riscv64.result == 'success' &&
      needs.build-web.result == 'success' &&
      needs.test-web.result == 'success' &&
      needs.build-android.result == 'success' &&
      needs.build-windows-x64.result == 'success' &&
      needs.build-windows-arm64.result == 'success' &&
      needs.build-macos.result == 'success' &&
      needs.build-ios.result == 'success' &&
      needs.build-bsd.result == 'success' &&
      github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # No `path:` — each artifact lands in a directory named after itself,
      # which is what the `files:` globs below expect.
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8

      # Release asset names are flat (no directories). The xcframework holds
      # repeated file names across its slices (Info.plist, raylib.h, ...), so
      # uploading it file-by-file collides. Zip it into a single asset instead,
      # keeping the raylib.xcframework/ folder name Xcode expects.
      - name: Zip iOS xcframework
        run: |
          if [ -d ios-raylib-xcframework ]; then
            cp -r ios-raylib-xcframework raylib.xcframework
            zip -rq ios-raylib-xcframework.zip raylib.xcframework
          fi

      # Lets anyone verify a download without having to trust the transport.
      # Release assets are flat, so the sums are recorded by basename — that is
      # what `sha256sum -c SHA256SUMS` expects next to the downloaded files.
      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          ROOT=$PWD
          : > "$ROOT/SHA256SUMS"
          find . -maxdepth 2 \( -name '*.zip' -o -name '*.apk' -o -name '*.aab' \) \
            -print0 | sort -z | while IFS= read -r -d '' f; do
              ( cd "$(dirname "$f")" && sha256sum "$(basename "$f")" ) >> "$ROOT/SHA256SUMS"
            done
          echo "--- SHA256SUMS ---"; cat "$ROOT/SHA256SUMS"

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3
        with:
          generate_release_notes: true
          # The AAB is opt-in (it needs signing secrets), so its glob will not
          # always match. Be explicit rather than relying on the default.
          fail_on_unmatched_files: false
          files: |
            linux-x64-build/linux-x64-build.zip
            linux-arm64-build/linux-arm64-build.zip
            linux-riscv64-build/linux-riscv64-build.zip
            web-build/web-build.zip
            android-debug-apk/*.apk
            android-release-aab/*.aab
            windows-x64-build/windows-x64-build.zip
            windows-arm64-build/windows-arm64-build.zip
            macos-build/macos-build.zip
            bsd-*-build/*.zip
            ios-raylib-xcframework.zip
            ios-app-simulator/ios-app-simulator.zip
            THIRD_PARTY_LICENSES.md
            SHA256SUMS
