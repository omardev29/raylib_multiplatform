# Multiplatform build & release.
#
# Linux jobs run INSIDE the frozen build-image (see docker/Dockerfile and
# docker-image.yaml), so toolchains are pinned and nothing is downloaded at job
# time. Windows/macOS/BSD jobs run on their native hosted runners. All
# third-party actions are pinned by full commit SHA (version in the comment).
#
# Platforms: Linux x64/ARM64/RISC-V, Windows x64/ARM64, macOS, iOS, Web,
# Android, FreeBSD, OpenBSD, NetBSD.

name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  PROJECT_NAME: ray_test
  # Image built by .github/workflows/docker-image.yaml. Change the owner to yours.
  BUILD_IMAGE: ghcr.io/omardev29/raylib-build:latest

jobs:
  # ---------------------------------------------------------------------------
  # Linux x64 (inside the frozen container)
  # ---------------------------------------------------------------------------
  build-linux-x64:
    runs-on: ubuntu-latest
    container:
      # NOTE: GitHub Actions does not allow the `env` context in container.image,
      # so the build image is hardcoded here (keep in sync with BUILD_IMAGE above).
      image: ghcr.io/omardev29/raylib-build:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Configure
        run: cmake --preset release

      - name: Build (game + rres packer)
        run: cmake --build build

      - name: Pack resources (AES rres)
        run: cmake --build build --target pack_resources

      - name: Test (static) — binary exists, is x86-64 ELF, executable
        run: |
          set -e
          BIN=build/${{ env.PROJECT_NAME }}
          test -f "$BIN" || { echo "FAIL: $BIN not found"; exit 1; }
          test -x "$BIN" || { echo "FAIL: $BIN not executable"; exit 1; }
          file "$BIN"
          file "$BIN" | grep -q "ELF 64-bit"  || { echo "FAIL: not a 64-bit ELF"; exit 1; }
          file "$BIN" | grep -qi "x86-64"     || { echo "FAIL: not x86-64"; exit 1; }
          file "$BIN" | grep -qi "executable" || { echo "FAIL: not an executable"; exit 1; }
          echo "PASS: static binary checks"

      - name: Test (runtime) — boot headless, render frames, verify output
        run: |
          set -e
          OUT=/tmp/ray_test_out.txt
          # Run headless under a virtual X server for a bounded number of frames.
          RAY_TEST_MAX_FRAMES=30 xvfb-run -a timeout 180 ./build/${{ env.PROJECT_NAME }} >"$OUT" 2>&1 \
            || { echo "FAIL: game exited non-zero"; cat "$OUT"; exit 1; }
          echo "--- captured output ---"; cat "$OUT"
          grep -q "RAY_TEST_BOOT_OK"     "$OUT" || { echo "FAIL: boot marker missing"; exit 1; }
          grep -q "RAY_TEST_DONE_FRAMES" "$OUT" || { echo "FAIL: frame marker missing"; exit 1; }
          echo "PASS: runtime smoke test"

      - name: Package
        run: |
          mkdir -p package/resources
          cp build/${{ env.PROJECT_NAME }} package/
          cp resources/resources.rres package/resources/
          cd package && zip -r ../linux-x64-build.zip .

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: linux-x64-build
          path: linux-x64-build.zip

  # ---------------------------------------------------------------------------
  # Linux ARM64 (native arm64 runner + arm64 image variant)
  # ---------------------------------------------------------------------------
  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    container:
      # NOTE: GitHub Actions does not allow the `env` context in container.image,
      # so the build image is hardcoded here (keep in sync with BUILD_IMAGE above).
      image: ghcr.io/omardev29/raylib-build:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build build

      - name: Pack resources (AES rres)
        run: cmake --build build --target pack_resources

      - name: Test (static) — binary exists, is aarch64 ELF, executable
        run: |
          set -e
          BIN=build/${{ env.PROJECT_NAME }}
          test -f "$BIN" || { echo "FAIL: $BIN not found"; exit 1; }
          test -x "$BIN" || { echo "FAIL: $BIN not executable"; exit 1; }
          file "$BIN"
          file "$BIN" | grep -q "ELF 64-bit" || { echo "FAIL: not a 64-bit ELF"; exit 1; }
          file "$BIN" | grep -qi "aarch64\|arm" || { echo "FAIL: not ARM64"; exit 1; }
          file "$BIN" | grep -qi "executable"   || { echo "FAIL: not an executable"; exit 1; }
          echo "PASS: static binary checks"

      - name: Test (runtime) — boot headless, render frames, verify output
        run: |
          set -e
          OUT=/tmp/ray_test_out.txt
          RAY_TEST_MAX_FRAMES=30 xvfb-run -a timeout 180 ./build/${{ env.PROJECT_NAME }} >"$OUT" 2>&1 \
            || { echo "FAIL: game exited non-zero"; cat "$OUT"; exit 1; }
          echo "--- captured output ---"; cat "$OUT"
          grep -q "RAY_TEST_BOOT_OK"     "$OUT" || { echo "FAIL: boot marker missing"; exit 1; }
          grep -q "RAY_TEST_DONE_FRAMES" "$OUT" || { echo "FAIL: frame marker missing"; exit 1; }
          echo "PASS: runtime smoke test"

      - name: Package
        run: |
          mkdir -p package/resources
          cp build/${{ env.PROJECT_NAME }} package/
          cp resources/resources.rres package/resources/
          cd package && zip -r ../linux-arm64-build.zip .

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: linux-arm64-build
          path: linux-arm64-build.zip

  # ---------------------------------------------------------------------------
  # Linux RISC-V (cross-compiled inside the amd64 container). First-class target:
  # the build image ships the riscv64 X11/GL multiarch libs.
  # ---------------------------------------------------------------------------
  build-linux-riscv64:
    runs-on: ubuntu-latest
    container:
      # NOTE: GitHub Actions does not allow the `env` context in container.image,
      # so the build image is hardcoded here (keep in sync with BUILD_IMAGE above).
      image: ghcr.io/omardev29/raylib-build:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Configure (riscv64 toolchain)
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release -DPRODUCTION_BUILD=ON
          -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-riscv64-linux.cmake

      - name: Build
        run: cmake --build build

      - name: Test (static) — binary exists, is RISC-V ELF, executable
        run: |
          set -e
          BIN=build/${{ env.PROJECT_NAME }}
          test -f "$BIN" || { echo "FAIL: $BIN not found"; exit 1; }
          test -x "$BIN" || { echo "FAIL: $BIN not executable"; exit 1; }
          file "$BIN"
          file "$BIN" | grep -q "ELF 64-bit"   || { echo "FAIL: not a 64-bit ELF"; exit 1; }
          file "$BIN" | grep -qi "riscv"       || { echo "FAIL: not RISC-V"; exit 1; }
          file "$BIN" | grep -qi "executable"  || { echo "FAIL: not an executable"; exit 1; }
          echo "PASS: static binary checks"

      - name: Package
        run: |
          mkdir -p package/resources
          cp build/${{ env.PROJECT_NAME }} package/
          cp -r resources package/
          cd package && zip -r ../linux-riscv64-build.zip .

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: linux-riscv64-build
          path: linux-riscv64-build.zip

  # ---------------------------------------------------------------------------
  # Web (Emscripten from the frozen image)
  # ---------------------------------------------------------------------------
  build-web:
    runs-on: ubuntu-latest
    container:
      # NOTE: GitHub Actions does not allow the `env` context in container.image,
      # so the build image is hardcoded here (keep in sync with BUILD_IMAGE above).
      image: ghcr.io/omardev29/raylib-build:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Configure
        run: cmake --preset web

      - name: Build
        run: cmake --build --preset web

      - name: Test (static) — web artifacts exist and are non-empty
        run: |
          set -e
          cd build/web
          for f in ${{ env.PROJECT_NAME }}.html ${{ env.PROJECT_NAME }}.js \
                   ${{ env.PROJECT_NAME }}.wasm ${{ env.PROJECT_NAME }}.data; do
            test -s "$f" || { echo "FAIL: $f missing or empty"; exit 1; }
            echo "ok: $f ($(stat -c%s "$f") bytes)"
          done
          echo "PASS: web artifact checks"

      - name: Package
        run: |
          cd build/web
          zip -r ../../web-build.zip \
            ${{ env.PROJECT_NAME }}.html ${{ env.PROJECT_NAME }}.js \
            ${{ env.PROJECT_NAME }}.wasm ${{ env.PROJECT_NAME }}.data

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: web-build
          path: web-build.zip

  # ---------------------------------------------------------------------------
  # Android (SDK/NDK from the frozen image; gradle caches reduce downloads)
  # ---------------------------------------------------------------------------
  build-android:
    runs-on: ubuntu-latest
    container:
      # NOTE: GitHub Actions does not allow the `env` context in container.image,
      # so the build image is hardcoded here (keep in sync with BUILD_IMAGE above).
      image: ghcr.io/omardev29/raylib-build:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('raymob/**/*.gradle*', 'raymob/**/gradle-wrapper.properties') }}

      - name: Build debug APK
        working-directory: raymob
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Test (static) — APK exists, is a valid zip with manifest + native lib
        run: |
          set -e
          APK=$(ls raymob/app/build/outputs/apk/debug/*.apk | head -1)
          test -s "$APK" || { echo "FAIL: APK missing or empty"; exit 1; }
          echo "ok: $APK ($(stat -c%s "$APK") bytes)"
          unzip -l "$APK" | grep -q "AndroidManifest.xml" || { echo "FAIL: no AndroidManifest.xml"; exit 1; }
          unzip -l "$APK" | grep -q "\.so"                || { echo "FAIL: no native .so"; exit 1; }
          echo "PASS: APK checks"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: android-debug-apk
          path: raymob/app/build/outputs/apk/debug/*.apk

  # ---------------------------------------------------------------------------
  # Windows x64
  # ---------------------------------------------------------------------------
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release

      - name: Pack resources (AES rres)
        run: cmake --build build --target pack_resources

      - name: Test (static) — .exe exists and is a PE executable
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "build/${{ env.PROJECT_NAME }}.exe"
          if (-not (Test-Path $exe)) { Write-Host "FAIL: $exe not found"; exit 1 }
          if ((Get-Item $exe).Length -eq 0) { Write-Host "FAIL: $exe is empty"; exit 1 }
          $head = [System.IO.File]::ReadAllBytes($exe)[0..1]
          if (-not ($head[0] -eq 0x4D -and $head[1] -eq 0x5A)) { Write-Host "FAIL: not a PE (no MZ header)"; exit 1 }
          Write-Host "PASS: static binary checks ($((Get-Item $exe).Length) bytes)"

      - name: Test (runtime) — boot, render frames, verify output (180s timeout)
        run: |
          $ErrorActionPreference = "Stop"
          $env:RAY_TEST_MAX_FRAMES = "30"
          $exe = Resolve-Path "build/${{ env.PROJECT_NAME }}.exe"
          $proc = Start-Process -FilePath $exe -RedirectStandardOutput out.txt -RedirectStandardError err.txt -PassThru
          if (-not $proc.WaitForExit(180000)) { $proc.Kill(); Get-Content out.txt,err.txt; Write-Host "FAIL: timed out"; exit 1 }
          Get-Content out.txt,err.txt
          if ($proc.ExitCode -ne 0) { Write-Host "FAIL: exit code $($proc.ExitCode)"; exit 1 }
          $all = (Get-Content out.txt,err.txt) -join "`n"
          if ($all -notmatch "RAY_TEST_BOOT_OK")     { Write-Host "FAIL: boot marker missing"; exit 1 }
          if ($all -notmatch "RAY_TEST_DONE_FRAMES") { Write-Host "FAIL: frame marker missing"; exit 1 }
          Write-Host "PASS: runtime smoke test"

      - name: Package
        run: |
          New-Item -ItemType Directory -Force -Path package/resources | Out-Null
          Copy-Item build/${{ env.PROJECT_NAME }}.exe package/
          Copy-Item resources/resources.rres package/resources/
          Compress-Archive -Path package/* -DestinationPath windows-x64-build.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: windows-x64-build
          path: windows-x64-build.zip

  # ---------------------------------------------------------------------------
  # Windows ARM64 (MSVC cross-compile). First-class target.
  # ---------------------------------------------------------------------------
  build-windows-arm64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      # Inline vcvarsall (no third-party action: the common ones still run Node 20)
      - name: Set up MSVC arm64 cross environment (vcvarsall)
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vcvars = & $vswhere -latest -products * -find "VC\Auxiliary\Build\vcvarsall.bat" | Select-Object -First 1
          if (-not $vcvars) { throw "vcvarsall.bat not found" }
          cmd /c "`"$vcvars`" amd64_arm64 >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
          }

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release

      # Cross-compiled ARM64 binary: static checks only (cannot run on x64 host).
      - name: Test (static) — .exe exists, is a PE, targets ARM64
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "build/${{ env.PROJECT_NAME }}.exe"
          if (-not (Test-Path $exe)) { Write-Host "FAIL: $exe not found"; exit 1 }
          if ((Get-Item $exe).Length -eq 0) { Write-Host "FAIL: $exe is empty"; exit 1 }
          $b = [System.IO.File]::ReadAllBytes($exe)
          if (-not ($b[0] -eq 0x4D -and $b[1] -eq 0x5A)) { Write-Host "FAIL: not a PE (no MZ header)"; exit 1 }
          # PE header: e_lfanew at 0x3C -> machine type at +4 (0xAA64 = ARM64)
          $pe = [BitConverter]::ToInt32($b, 0x3C)
          $machine = [BitConverter]::ToUInt16($b, $pe + 4)
          if ($machine -ne 0xAA64) { Write-Host "FAIL: machine type 0x$($machine.ToString('X4')) != ARM64 (0xAA64)"; exit 1 }
          Write-Host "PASS: static binary checks (ARM64 PE, $((Get-Item $exe).Length) bytes)"

      # Cross-compiled target: the rres packer is built for ARM64 and cannot run
      # on the x64 host, so ship loose resources (the game falls back to them).
      - name: Package
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item build/${{ env.PROJECT_NAME }}.exe package/
          Copy-Item resources package/ -Recurse
          Compress-Archive -Path package/* -DestinationPath windows-arm64-build.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: windows-arm64-build
          path: windows-arm64-build.zip

  # ---------------------------------------------------------------------------
  # macOS
  # ---------------------------------------------------------------------------
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install Ninja
        run: brew install ninja

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release

      - name: Pack resources (AES rres)
        run: cmake --build build --target pack_resources

      - name: Test (static) — binary exists, is Mach-O, executable
        run: |
          set -e
          BIN=build/${{ env.PROJECT_NAME }}
          test -f "$BIN" || { echo "FAIL: $BIN not found"; exit 1; }
          test -x "$BIN" || { echo "FAIL: $BIN not executable"; exit 1; }
          file "$BIN"
          file "$BIN" | grep -qi "Mach-O" || { echo "FAIL: not a Mach-O binary"; exit 1; }
          echo "PASS: static binary checks"

      - name: Package
        run: |
          mkdir -p package/resources
          cp build/${{ env.PROJECT_NAME }} package/
          cp resources/resources.rres package/resources/
          cd package && zip -r ../macos-build.zip .

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: macos-build
          path: macos-build.zip

  # ---------------------------------------------------------------------------
  # iOS (raylib-iOS fork + Xcode). First-class target; requires macOS + Xcode.
  # ---------------------------------------------------------------------------
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          submodules: recursive

      - name: Build raylib.xcframework (device + simulator)
        run: |
          cd thirdparty/raylib-ios/projects/scripts
          chmod +x build-ios-xcframework.sh
          ./build-ios-xcframework.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: cd ios && xcodegen generate

      - name: Build app (simulator, no signing)
        run: |
          cd ios
          xcodebuild -project ray_test.xcodeproj -scheme ray_test \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build

      - name: Test (static) — xcframework + .app bundle exist
        run: |
          set -e
          test -d thirdparty/raylib-ios/raylib.xcframework || { echo "FAIL: raylib.xcframework missing"; exit 1; }
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name "ray_test.app" -path "*iphonesimulator*" | head -1)
          test -n "$APP" -a -d "$APP" || { echo "FAIL: ray_test.app not built"; exit 1; }
          test -x "$APP/ray_test" || { echo "FAIL: app binary missing"; exit 1; }
          file "$APP/ray_test" | grep -qi "Mach-O" || { echo "FAIL: not Mach-O"; exit 1; }
          echo "PASS: iOS artifact checks ($APP)"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: ios-raylib-xcframework
          path: thirdparty/raylib-ios/raylib.xcframework

  # ---------------------------------------------------------------------------
  # BSDs via QEMU on a hosted Linux runner (cross-platform-actions).
  # First-class targets: FreeBSD, OpenBSD, NetBSD.
  # ---------------------------------------------------------------------------
  build-bsd:
    runs-on: ubuntu-latest
    # Guard against the VM-readiness step hanging forever (see cross-platform-actions #158).
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: freebsd
            version: '15.1'
            arch: x86-64
          - os: freebsd
            version: '15.1'
            arch: arm64
          # FreeBSD riscv64 needs the cross-platform-actions master pin below
          # (older tagged releases predate the riscv64 FreeBSD VM support).
          - os: freebsd
            version: '15.1'
            arch: riscv64
          - os: openbsd
            version: '7.9'
            arch: x86-64
          - os: openbsd
            version: '7.9'
            arch: arm64
          - os: netbsd
            version: '10.1'
            arch: x86-64
          - os: netbsd
            version: '10.1'
            arch: arm64
          # NOTE: OpenBSD/NetBSD riscv64 are not available — cross-platform-actions
          # publishes no riscv64 disk image for them. RISC-V is still covered by
          # linux-riscv64 and freebsd-riscv64.
    defaults:
      run:
        shell: cpa.sh {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Start ${{ matrix.os }} ${{ matrix.version }} (${{ matrix.arch }}) VM
        # Pinned to cross-platform-actions master @ "Don't expose AMX to the
        # guests": fixes NetBSD boot failures on Intel-AMX runners (issue #158).
        # Switch back to a tagged release once one ships this fix.
        uses: cross-platform-actions/action@9bc6a97170f220f554b6eb45d92439b9f676e150
        with:
          operating_system: ${{ matrix.os }}
          version: ${{ matrix.version }}
          architecture: ${{ matrix.arch }}
          memory: 6G
          cpu_count: 2

      - name: Install deps + build inside the VM
        run: |
          set -e
          pwd; ls -la
          EXTRA_CMAKE=""
          GENERATOR="Ninja"
          case "${{ matrix.os }}" in
            freebsd)
              sudo pkg install -y cmake ninja git pkgconf \
                libX11 libXrandr libXi libXcursor libXinerama libglvnd mesa-libs ;;
            openbsd)
              sudo pkg_add cmake ninja git pkgconf
              # CMake cannot auto-detect the archiver for OpenBSD's clang; set
              # both CMAKE_AR and the compiler-specific CMAKE_C_COMPILER_AR.
              EXTRA_CMAKE="-DCMAKE_AR=/usr/bin/ar -DCMAKE_RANLIB=/usr/bin/ranlib \
                -DCMAKE_C_COMPILER_AR=/usr/bin/ar -DCMAKE_C_COMPILER_RANLIB=/usr/bin/ranlib" ;;
            netbsd)
              # NetBSD base has pkg_add (no pkgin by default); point it at the
              # pkgsrc binary packages for this release/arch. pkgsrc cmake wants
              # a curl newer than the one already installed and pkg_add refuses
              # to upgrade in place, so drop the old curl first. Skip git (not
              # needed to build; sources are already synced). NOTE: pkgsrc's
              # 'ninja' package is an IRC client, not the build tool, so build
              # with GNU make + the "Unix Makefiles" generator instead.
              # pkgsrc dirs use their own arch names (arm64 -> aarch64); uname -m
              # does not match, so map explicitly.
              case "${{ matrix.arch }}" in
                x86-64) PKG_ARCH="amd64" ;;
                arm64)  PKG_ARCH="aarch64" ;;
                *)      PKG_ARCH="$(uname -m)" ;;
              esac
              sudo /usr/sbin/pkg_delete curl 2>/dev/null || true
              sudo env PKG_PATH="https://cdn.NetBSD.org/pub/pkgsrc/packages/NetBSD/$PKG_ARCH/${{ matrix.version }}/All/" \
                /usr/sbin/pkg_add cmake pkgconf gmake
              GENERATOR="Unix Makefiles"
              # CMake can't auto-detect the archiver on NetBSD either; point it
              # at the base ar/ranlib.
              EXTRA_CMAKE="-DCMAKE_MAKE_PROGRAM=/usr/pkg/bin/gmake \
                -DCMAKE_AR=/usr/bin/ar -DCMAKE_RANLIB=/usr/bin/ranlib \
                -DCMAKE_C_COMPILER_AR=/usr/bin/ar -DCMAKE_C_COMPILER_RANLIB=/usr/bin/ranlib" ;;
          esac
          rm -rf build
          cmake -B build -G "$GENERATOR" -DCMAKE_BUILD_TYPE=Release -DPRODUCTION_BUILD=ON $EXTRA_CMAKE
          cmake --build build
          # Static test: the binary exists, is executable, and has the ELF magic
          # (portable check with od; `file` is not always present on the BSDs).
          BIN=build/${{ env.PROJECT_NAME }}
          test -f "$BIN" || { echo "FAIL: $BIN not found"; exit 1; }
          test -x "$BIN" || { echo "FAIL: $BIN not executable"; exit 1; }
          test -s "$BIN" || { echo "FAIL: $BIN empty"; exit 1; }
          MAGIC=$(od -An -tx1 -N4 "$BIN" | tr -d ' \n')
          [ "$MAGIC" = "7f454c46" ] || { echo "FAIL: not an ELF (magic=$MAGIC)"; exit 1; }
          echo "PASS: static binary checks ($(wc -c < "$BIN") bytes)"

  # ---------------------------------------------------------------------------
  # Release (on tag). Every platform is first-class: the release only runs when
  # ALL builds succeed — no target is silently skipped.
  # ---------------------------------------------------------------------------
  release:
    needs:
      - build-linux-x64
      - build-linux-arm64
      - build-linux-riscv64
      - build-web
      - build-android
      - build-windows-x64
      - build-windows-arm64
      - build-macos
      - build-ios
      - build-bsd
    runs-on: ubuntu-latest
    if: >
      always() &&
      needs.build-linux-x64.result == 'success' &&
      needs.build-linux-arm64.result == 'success' &&
      needs.build-linux-riscv64.result == 'success' &&
      needs.build-web.result == 'success' &&
      needs.build-android.result == 'success' &&
      needs.build-windows-x64.result == 'success' &&
      needs.build-windows-arm64.result == 'success' &&
      needs.build-macos.result == 'success' &&
      needs.build-ios.result == 'success' &&
      needs.build-bsd.result == 'success' &&
      github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3
        with:
          generate_release_notes: true
          files: |
            linux-x64-build/linux-x64-build.zip
            linux-arm64-build/linux-arm64-build.zip
            linux-riscv64-build/linux-riscv64-build.zip
            web-build/web-build.zip
            android-debug-apk/*.apk
            windows-x64-build/windows-x64-build.zip
            windows-arm64-build/windows-arm64-build.zip
            macos-build/macos-build.zip
            ios-raylib-xcframework/**
