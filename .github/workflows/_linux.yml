# Linux targets: every one in the `linux` family of tools/configure.py's
# TARGETS -- linux-x64-glibc, linux-arm64-glibc, linux-riscv64-glibc,
# linux-x64-musl, linux-x64-glibc-drm and linux-arm64-glibc-drm.
#
# Reusable (`workflow_call`) — called from ci.yml.
#
# Every one builds inside the frozen image, so the toolchain is identical to the
# one recorded in thirdparty/FROZEN_VERSIONS.md and nothing is downloaded at job
# time. Four are also run and must render a frame: x64 and ARM64 under xvfb,
# musl on Alpine (musl-x64-run), and x64 DRM on a vkms virtual display
# (drm-x64-run). RISC-V has no runner to boot on and ARM64 DRM is for hardware
# vkms does not resemble, so those two are built and checked statically. Only
# x64 is in the fast lane; the rest run with `full`.

name: Linux

on:
  workflow_call:
    inputs:
      project_name:
        required: true
        type: string
      build_image:
        description: 'Digest-pinned build image (ghcr.io/…@sha256:…)'
        required: true
        type: string
      full:
        description: 'false = fast lane (x64 only)'
        required: false
        default: true
        type: boolean
      targets:
        description: 'JSON array of enabled target ids (from [targets] in the config)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  x64:
    if: contains(fromJSON(inputs.targets), 'linux-x64-glibc')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ inputs.build_image }}
    defaults:
      run:
        # Container jobs default to `sh -e {0}`, which has no `pipefail`;
        # `set -euo pipefail` dies with "Illegal option". Be explicit.
        shell: bash
    steps:
      - name: Build image manifest
        run: cat /etc/raylib-build-image.json

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # One step instead of configure + build, because [linux] glibc decides
      # which compiler this uses. Empty and it is the ordinary release preset;
      # set and it is zig cc targeting that glibc, so the binary runs on
      # distributions older than this runner. See tools/linux_build.sh.
      - name: Configure + build (game + rres packer)
        run: bash tools/linux_build.sh build/release

      # The floor is a claim about every machine that is NOT this one, so it has
      # to be checked here rather than discovered by a player. The failure it
      # prevents is "version GLIBC_2.39 not found" and nothing else.
      - name: It runs on older distributions than this one
        run: bash tools/glibc_check.sh build/release/${{ inputs.project_name }}

      # The hardening CMakeLists.txt links a release with (RMP_RELEASE_PIE and
      # the measured flags around it) read off the binary itself, before UPX
      # packs it: RELRO, BIND_NOW, a stack that is not executable, and PIE
      # where that option is on. A flag a toolchain ignores was never there.
      - name: Linked hardened
        run: |
          set -euo pipefail
          PIE=""
          CACHE=build/release/CMakeCache.txt
          # A cache that is not there would read as "PIE off", and pass.
          grep -q '^RMP_RELEASE_PIE:BOOL=' "$CACHE" || { echo "FAIL: $CACHE says nothing of RMP_RELEASE_PIE"; exit 1; }
          if grep -q '^RMP_RELEASE_PIE:BOOL=ON' "$CACHE"; then PIE=--pie; fi
          python3 tools/binary_check.py elf ${PIE:+"$PIE"} "build/release/${{ inputs.project_name }}"

      - name: Pack resources (AES rres)
        run: cmake --build build/release --target pack_resources

      - name: Test (static) — binary exists, is x86-64 ELF, executable
        run: |
          set -e
          BIN=build/release/${{ inputs.project_name }}
          test -f "$BIN" || { echo "FAIL: $BIN not found"; exit 1; }
          test -x "$BIN" || { echo "FAIL: $BIN not executable"; exit 1; }
          test -s "$BIN" || { echo "FAIL: $BIN empty"; exit 1; }
          # Portable ELF checks with od (`file` is not installed in the image):
          # magic 7f454c46, e_machine at offset 0x12 (x86-64 = 0x003E -> "3e00").
          MAGIC=$(od -An -tx1 -N4 "$BIN" | tr -d ' \n')
          [ "$MAGIC" = "7f454c46" ] || { echo "FAIL: not an ELF (magic=$MAGIC)"; exit 1; }
          MACHINE=$(od -An -tx1 -j18 -N2 "$BIN" | tr -d ' \n')
          [ "$MACHINE" = "3e00" ] || { echo "FAIL: not x86-64 (e_machine=$MACHINE)"; exit 1; }
          # A shipped binary must not carry DWARF. It went unnoticed once and
          # cost 3.7 MB of the 4.6: zig cc emits debug info for its own bundled
          # libc and compiler-rt, and nothing in the release path took it back
          # out. -Wl,-s in CMakeLists.txt does now; this is what notices if it
          # ever stops, on the one job that builds natively for its own arch.
          if objdump -h "$BIN" | grep -q '\.debug_'; then
            echo "FAIL: release binary carries debug sections."
            echo "      Is the -Wl,-s block still in CMakeLists.txt, and did"
            echo "      check_linker_flag accept it? Sections found:"
            objdump -h "$BIN" | grep '\.debug_'
            exit 1
          fi
          echo "PASS: static binary checks ($(wc -c < "$BIN") bytes, stripped)"

      - name: Test (runtime) — boot headless, render frames, verify pixels
        run: |
          set -e
          OUT=/tmp/ray_test_out.txt
          # Explicit 24-bit screen: the render read-back needs a real colour
          # depth, and xvfb-run's default has changed across versions.
          RAY_TEST_MAX_FRAMES=30 xvfb-run -a -s "-screen 0 1280x720x24" \
            timeout 180 ./build/release/${{ inputs.project_name }} >"$OUT" 2>&1 \
            || { echo "FAIL: game exited non-zero"; cat "$OUT"; exit 1; }
          echo "--- captured output ---"; cat "$OUT"
          # Non-zero texture dimensions, not just the marker: a missing asset
          # still boots and still "renders" a background.
          grep -q "RAY_TEST_BOOT_OK assets_failed=0 " "$OUT" \
            || { echo "FAIL: boot marker missing or texture not loaded"; exit 1; }
          # Booting proves the window and the assets are fine and nothing more.
          # RAY_TEST_RENDER_OK is the gate that a blank frame cannot pass.
          grep -q "RAY_TEST_RENDER_OK"   "$OUT" || { echo "FAIL: render marker missing (blank frame?)"; exit 1; }
          grep -q "RAY_TEST_DONE_FRAMES" "$OUT" || { echo "FAIL: frame marker missing"; exit 1; }
          echo "PASS: runtime boot + render test"

      - name: Package
        run: |
          mkdir -p package/resources
          # LICENSES.txt: the full notice of everything vendored, generated by
          # tools/configure.py from the licence files in thirdparty/. Absent
          # when [deploy] licenses = false, which is why this is not a hard cp.
          if [ -f cmake/generated/LICENSES.txt ]; then
            cp cmake/generated/LICENSES.txt package/
          fi
          cp build/release/${{ inputs.project_name }} package/
          # UPX, if [upx] in the .toml asked for this target, on the copy that
          # ships: build/release/ keeps the binary the linker wrote, and the
          # size budget reads the unpacked size from it. A no-op where [upx]
          # does not apply.
          bash tools/upx_pack.sh linux-x64-glibc "package/${{ inputs.project_name }}"
          sh tools/ship_resources.sh package   # the pack; loose files for a plain C game
          cd package && zip -r ../linux-x64-glibc-build.zip .

      # The binary as linked and the copy that ships, each within 1.5% of its
      # line in tools/size_budget.txt. The measured line is printed either
      # way, so this log is all it takes to update the file.
      - name: Within its size budget
        run: python3 tools/size_check.py linux-x64-glibc "build/release/${{ inputs.project_name }}" "package/${{ inputs.project_name }}"

      # THE ARCHIVE, unzipped, started from a folder with no resources/ in it --
      # the way a player starts it from a file manager or a shortcut. Every boot
      # above starts the binary from the repository root, where resources/
      # happens to be; a release that read "./resources/" from the working
      # directory passed all of them and loaded nothing for a player. It is
      # also the binary that ships, so a [upx]-packed one is started here.
      - name: The archive starts from any folder
        run: |
          set -euo pipefail
          SHIP=$(mktemp -d)
          ELSEWHERE=$(mktemp -d)
          unzip -q linux-x64-glibc-build.zip -d "$SHIP"
          OUT="$ELSEWHERE/out.txt"
          cd "$ELSEWHERE"
          RAY_TEST_MAX_FRAMES=10 xvfb-run -a -s "-screen 0 1280x720x24" \
            timeout 180 "$SHIP/${{ inputs.project_name }}" >"$OUT" 2>&1 \
            || { echo "FAIL: the unzipped game exited non-zero"; cat "$OUT"; exit 1; }
          tail -20 "$OUT"
          grep -q "RAY_TEST_BOOT_OK assets_failed=0 " "$OUT" \
            || { echo "FAIL: started from another folder, the game did not find its resources/"; exit 1; }
          grep -q "RAY_TEST_DONE_FRAMES" "$OUT" || { echo "FAIL: frame marker missing"; exit 1; }
          echo "PASS: the archive runs from any folder"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: linux-x64-glibc-build
          path: linux-x64-glibc-build.zip
          retention-days: 7

  arm64:
    if: inputs.full && contains(fromJSON(inputs.targets), 'linux-arm64-glibc')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ inputs.build_image }}
    defaults:
      run:
        # Container jobs default to `sh -e {0}`, which has no `pipefail`;
        # `set -euo pipefail` dies with "Illegal option". Be explicit.
        shell: bash
    steps:
      - name: Build image manifest
        run: cat /etc/raylib-build-image.json

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Configure + build
        run: bash tools/linux_build.sh build/release

      - name: It runs on older distributions than this one
        run: bash tools/glibc_check.sh build/release/${{ inputs.project_name }}

      # The hardening CMakeLists.txt links a release with (RMP_RELEASE_PIE and
      # the measured flags around it) read off the binary itself, before UPX
      # packs it: RELRO, BIND_NOW, a stack that is not executable, and PIE
      # where that option is on. A flag a toolchain ignores was never there.
      - name: Linked hardened
        run: |
          set -euo pipefail
          PIE=""
          CACHE=build/release/CMakeCache.txt
          # A cache that is not there would read as "PIE off", and pass.
          grep -q '^RMP_RELEASE_PIE:BOOL=' "$CACHE" || { echo "FAIL: $CACHE says nothing of RMP_RELEASE_PIE"; exit 1; }
          if grep -q '^RMP_RELEASE_PIE:BOOL=ON' "$CACHE"; then PIE=--pie; fi
          python3 tools/binary_check.py elf ${PIE:+"$PIE"} "build/release/${{ inputs.project_name }}"

      - name: Pack resources (AES rres)
        run: cmake --build build/release --target pack_resources

      - name: Test (static) — binary exists, is aarch64 ELF, executable
        run: |
          set -e
          BIN=build/release/${{ inputs.project_name }}
          test -f "$BIN" || { echo "FAIL: $BIN not found"; exit 1; }
          test -x "$BIN" || { echo "FAIL: $BIN not executable"; exit 1; }
          test -s "$BIN" || { echo "FAIL: $BIN empty"; exit 1; }
          # Portable ELF checks with od: magic + e_machine (ARM64 = 0x00B7 -> "b700").
          MAGIC=$(od -An -tx1 -N4 "$BIN" | tr -d ' \n')
          [ "$MAGIC" = "7f454c46" ] || { echo "FAIL: not an ELF (magic=$MAGIC)"; exit 1; }
          MACHINE=$(od -An -tx1 -j18 -N2 "$BIN" | tr -d ' \n')
          [ "$MACHINE" = "b700" ] || { echo "FAIL: not ARM64 (e_machine=$MACHINE)"; exit 1; }
          echo "PASS: static binary checks ($(wc -c < "$BIN") bytes)"

      - name: Test (runtime) — boot headless, render frames, verify pixels
        run: |
          set -e
          OUT=/tmp/ray_test_out.txt
          RAY_TEST_MAX_FRAMES=30 xvfb-run -a -s "-screen 0 1280x720x24" \
            timeout 180 ./build/release/${{ inputs.project_name }} >"$OUT" 2>&1 \
            || { echo "FAIL: game exited non-zero"; cat "$OUT"; exit 1; }
          echo "--- captured output ---"; cat "$OUT"
          # Non-zero texture dimensions, not just the marker: a missing asset
          # still boots and still "renders" a background.
          grep -q "RAY_TEST_BOOT_OK assets_failed=0 " "$OUT" \
            || { echo "FAIL: boot marker missing or texture not loaded"; exit 1; }
          grep -q "RAY_TEST_RENDER_OK"   "$OUT" || { echo "FAIL: render marker missing (blank frame?)"; exit 1; }
          grep -q "RAY_TEST_DONE_FRAMES" "$OUT" || { echo "FAIL: frame marker missing"; exit 1; }
          echo "PASS: runtime boot + render test"

      - name: Package
        run: |
          mkdir -p package/resources
          # LICENSES.txt: the full notice of everything vendored, generated by
          # tools/configure.py from the licence files in thirdparty/. Absent
          # when [deploy] licenses = false, which is why this is not a hard cp.
          if [ -f cmake/generated/LICENSES.txt ]; then
            cp cmake/generated/LICENSES.txt package/
          fi
          cp build/release/${{ inputs.project_name }} package/
          # UPX, if [upx] in the .toml asked for this target, on the copy that
          # ships: build/release/ keeps the binary the linker wrote, and the
          # size budget reads the unpacked size from it. A no-op where [upx]
          # does not apply.
          bash tools/upx_pack.sh linux-arm64-glibc "package/${{ inputs.project_name }}"
          sh tools/ship_resources.sh package   # the pack; loose files for a plain C game
          cd package && zip -r ../linux-arm64-glibc-build.zip .

      # The binary as linked and the copy that ships, each within 1.5% of its
      # line in tools/size_budget.txt. The measured line is printed either
      # way, so this log is all it takes to update the file.
      - name: Within its size budget
        run: python3 tools/size_check.py linux-arm64-glibc "build/release/${{ inputs.project_name }}" "package/${{ inputs.project_name }}"

      # THE ARCHIVE, unzipped, started from a folder with no resources/ in it --
      # the way a player starts it from a file manager or a shortcut. Every boot
      # above starts the binary from the repository root, where resources/
      # happens to be; a release that read "./resources/" from the working
      # directory passed all of them and loaded nothing for a player. It is
      # also the binary that ships, so a [upx]-packed one is started here.
      - name: The archive starts from any folder
        run: |
          set -euo pipefail
          SHIP=$(mktemp -d)
          ELSEWHERE=$(mktemp -d)
          unzip -q linux-arm64-glibc-build.zip -d "$SHIP"
          OUT="$ELSEWHERE/out.txt"
          cd "$ELSEWHERE"
          RAY_TEST_MAX_FRAMES=10 xvfb-run -a -s "-screen 0 1280x720x24" \
            timeout 180 "$SHIP/${{ inputs.project_name }}" >"$OUT" 2>&1 \
            || { echo "FAIL: the unzipped game exited non-zero"; cat "$OUT"; exit 1; }
          tail -20 "$OUT"
          grep -q "RAY_TEST_BOOT_OK assets_failed=0 " "$OUT" \
            || { echo "FAIL: started from another folder, the game did not find its resources/"; exit 1; }
          grep -q "RAY_TEST_DONE_FRAMES" "$OUT" || { echo "FAIL: frame marker missing"; exit 1; }
          echo "PASS: the archive runs from any folder"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: linux-arm64-glibc-build
          path: linux-arm64-glibc-build.zip
          retention-days: 7

  musl-x64:
    # Alpine, and every other musl distribution -- Void musl, KISS, Chimera.
    #
    # A SECOND BINARY and not a flag on the first: musl and glibc are different
    # C libraries, not versions of one, so a glibc binary does not start on
    # Alpine and this one does not start on Debian. The philosophy behind
    # shipping it is Omar's -- leave as few people as possible without a native
    # binary -- and the cost is one job.
    if: inputs.full && contains(fromJSON(inputs.targets), 'linux-x64-musl')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ inputs.build_image }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Build image manifest
        run: cat /etc/raylib-build-image.json

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The shipping binary, and a headless one for the runtime test below. The
      # headless build is what proves musl WORKS: the desktop one needs a
      # display, and the software renderer needs nothing at all.
      - name: Build (musl)
        run: |
          set -euo pipefail
          RMP_LIBC=musl bash tools/linux_build.sh build/release
          RMP_LIBC=musl bash tools/linux_build.sh build/memory -DPLATFORM=Memory

      # The hardening CMakeLists.txt links a release with (RMP_RELEASE_PIE and
      # the measured flags around it) read off the binary itself, before UPX
      # packs it: RELRO, BIND_NOW, a stack that is not executable, and PIE
      # where that option is on. A flag a toolchain ignores was never there.
      - name: Linked hardened
        run: |
          set -euo pipefail
          PIE=""
          CACHE=build/release/CMakeCache.txt
          # A cache that is not there would read as "PIE off", and pass.
          grep -q '^RMP_RELEASE_PIE:BOOL=' "$CACHE" || { echo "FAIL: $CACHE says nothing of RMP_RELEASE_PIE"; exit 1; }
          if grep -q '^RMP_RELEASE_PIE:BOOL=ON' "$CACHE"; then PIE=--pie; fi
          # --musl: its interpreter is musl's loader and the one library it
          # names is musl's libc.so -- what musl-x64-run's Alpine has to give it.
          python3 tools/binary_check.py elf ${PIE:+"$PIE"} --musl "build/release/${{ inputs.project_name }}"

      - name: Test (static) — it is a musl binary and not a glibc one
        run: |
          set -euo pipefail
          BIN=build/release/${{ inputs.project_name }}
          test -x "$BIN" || { echo "FAIL: $BIN not built"; exit 1; }
          # The distinguishing fact, and the one worth asserting: a musl binary
          # asks for musl's libc.so and names no versioned GLIBC_ symbol at all.
          if objdump -T "$BIN" | grep -q "GLIBC_"; then
            echo "FAIL: this is linked against glibc, not musl"
            objdump -p "$BIN" | grep NEEDED
            exit 1
          fi
          echo "  needs:"; objdump -p "$BIN" | grep NEEDED | sed 's/^/    /'
          echo "PASS: musl binary, no glibc symbols"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: linux-x64-musl-headless
          path: build/memory/${{ inputs.project_name }}
          retention-days: 3

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p package/resources
          if [ -f cmake/generated/LICENSES.txt ]; then cp cmake/generated/LICENSES.txt package/; fi
          cp build/release/${{ inputs.project_name }} package/
          # LOOSE RESOURCES, and the zip says so rather than leaving the reader
          # to compare archives. zig builds rres_pack for the musl target too,
          # and a musl-linked packer cannot run in this glibc image -- there is
          # no /lib/ld-musl-x86_64.so.1 here. The game falls back to loose
          # files when there is no pack, so the archive works; it is just a
          # different shape, and an undocumented difference is the bug.
          cp -r resources package/
          printf '%s\n' \
            "resources.rres was NOT built for this archive." \
            "linux-x64-musl is cross-compiled with zig, so the rres packer comes out" \
            "musl-linked and cannot run on the glibc image that builds it. The loose" \
            "files next to this note are the same assets; the game reads them when" \
            "there is no pack. See .github/workflows/_linux.yml." \
            > package/resources/PACK_SKIPPED.txt
          # UPX, on the copy that ships, like every Linux job: musl-x64-run
          # starts it from this archive on Alpine.
          bash tools/upx_pack.sh linux-x64-musl "package/${{ inputs.project_name }}"
          cd package && zip -r ../linux-x64-musl-build.zip .

      # The binary as linked and the copy that ships, each within 1.5% of its
      # line in tools/size_budget.txt. The measured line is printed either
      # way, so this log is all it takes to update the file.
      - name: Within its size budget
        run: python3 tools/size_check.py linux-x64-musl "build/release/${{ inputs.project_name }}" "package/${{ inputs.project_name }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: linux-x64-musl-build
          path: linux-x64-musl-build.zip
          retention-days: 7

  musl-x64-run:
    # AND IT ACTUALLY RUNS ON ALPINE. Everything in `musl` proves the binary is
    # musl-shaped; only this proves musl was the right shape. Twice: the
    # headless build renders the golden frame, and the archive a player
    # downloads -- packed, where [upx] packs it -- starts on an Alpine desktop
    # and draws.
    #
    # ALPINE IS NOT THE JOB'S CONTAINER, and that is not a style choice: the
    # runner injects its own Node into a container job so that actions/checkout
    # and friends can run, and that Node is linked against glibc. In a musl-only
    # image it does not start, and the job dies before reaching anything of
    # ours. So the job runs on the ordinary runner, where the actions work, and
    # Alpine is entered with `docker run` for the commands that matter.
    #
    # THE ALPINE IS OURS, and the job downloads nothing. RUN_IMAGE is
    # ghcr.io/omardev29/raylib-run-alpine, built by the raylib-build-image
    # repository (alpine/, alpine-image.yaml): Alpine 3.20.10 pinned by digest,
    # plus exactly what an Alpine desktop needs to start the shipped binary --
    # Xvfb and xvfb-run, Mesa with llvmpipe, and the X libraries GLFW opens --
    # proved at image build time by drawing a triangle on llvmpipe under
    # xvfb-run. It is pinned here by digest, and the same digest is
    # run_alpine_digest in thirdparty/FROZEN_VERSIONS.md; versions_check.sh
    # fails if the two disagree. It used to be `alpine@sha256:...` from Docker
    # Hub with an `apk add` of the desktop at job time. Every container here
    # runs with --network none, so nothing can be fetched from inside it either.
    needs: musl-x64
    if: inputs.full && contains(fromJSON(inputs.targets), 'linux-x64-musl')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      RUN_IMAGE: 'ghcr.io/omardev29/raylib-run-alpine@sha256:5823e1e4fa870083781977cfa30878c4c88f913a9dc0cd19b47a3f82ac409841'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: linux-x64-musl-headless
          path: musl-bin

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: linux-x64-musl-build
          path: musl-zip

      # The Alpine and the Mesa this log is about, first, like the build
      # image's manifest in every container job.
      - name: Run image manifest
        run: |
          set -euo pipefail
          # A digest of zeros is the placeholder that stood here before the
          # image was first published. It fails here, saying so, and not as a
          # pull error that reads like a registry outage.
          case "${RUN_IMAGE##*@sha256:}" in
            *[!0]*) ;;
            *) echo "FAIL: RUN_IMAGE is the placeholder digest. Publish raylib-run-alpine"
               echo "      (raylib-build-image, alpine-image.yaml) and pin the digest from its"
               echo "      run summary here and as run_alpine_digest in thirdparty/FROZEN_VERSIONS.md."
               exit 1 ;;
          esac
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull -q "$RUN_IMAGE"
          docker run --rm --network none "$RUN_IMAGE" cat /etc/raylib-run-alpine.json

      # WHAT IT NEEDS, read out of the binary, because the boot below can no
      # longer say it: the Alpine it boots on carries X and Mesa for the
      # shipped binary, and booting in a plain Alpine was all that said "it
      # needs nothing but musl". The headless build is statically linked --
      # no interpreter, no DT_NEEDED -- so it asks the system for nothing at
      # all; a glibc loader or a glibc library would fail here. (The release
      # is dynamic, and musl-x64 reads it the same way before UPX packs it:
      # musl's loader and libc.so, and nothing else.)
      - name: It needs nothing but musl
        run: python3 tools/binary_check.py elf --musl "musl-bin/${{ inputs.project_name }}"

      - name: Boot and render the headless build on Alpine
        run: |
          set -euo pipefail
          chmod +x "musl-bin/${{ inputs.project_name }}"
          # The binary is a PRODUCTION_BUILD, so it looks for ./resources/ next
          # to itself. That layout gets assembled on the host and mounted as ONE
          # directory, because a second -v nested underneath a :ro mount asks
          # docker to create the mountpoint inside a read-only rootfs:
          #   make mountpoint "/app/resources": read-only file system
          # podman allows exactly that and docker does not, which is why the
          # nesting survived being tested on a laptop and died on the runner.
          cp -r resources musl-bin/resources
          # Started from / and not from /app: a release has to find the
          # resources/ next to itself, wherever it is started from.
          OUT=$(docker run --rm --network none \
            -v "$PWD/musl-bin:/app:ro" \
            -w / -e RAY_TEST_MAX_FRAMES=10 \
            "$RUN_IMAGE" \
            "/app/${{ inputs.project_name }}" 2>&1) || true
          echo "$OUT" | tail -20
          echo "$OUT" | grep -q "RAY_TEST_BOOT_OK assets_failed=0 " \
            || { echo "FAIL: did not boot on Alpine, or an asset failed to load"; exit 1; }
          echo "$OUT" | grep -q RAY_TEST_RENDER_OK   || { echo "FAIL: drew nothing"; exit 1; }
          echo "$OUT" | grep -q RAY_TEST_DONE_FRAMES || { echo "FAIL: died before the end"; exit 1; }
          # The exact frame only where there is a golden one: the framework.
          # A game checks the boot, the pixels and the clean exit above.
          if [ -f tests/fixtures/render_hash.txt ]; then
            GOT=$(echo "$OUT" | grep -o "hash=[0-9a-f]*" | head -1 | cut -d= -f2)
            WANT=$(cat tests/fixtures/render_hash.txt)
            echo "  software-render hash=$GOT want=$WANT"
            test "$GOT" = "$WANT" || { echo "FAIL: musl renders a different frame"; exit 1; }
          fi
          echo "PASS: booted and rendered on Alpine"

      # THE ARCHIVE A PLAYER DOWNLOADS, unzipped and started on Alpine: the
      # step above starts a headless build, and the binary that ships is a
      # different one -- linked for a desktop, and packed by UPX where [upx]
      # packs it, which the default does. A desktop program needs what an
      # Alpine desktop has, an X server and Mesa, and RUN_IMAGE has them: this
      # is the step that image exists for.
      - name: The archive it ships starts on Alpine
        run: |
          set -euo pipefail
          mkdir -p musl-ship
          unzip -q musl-zip/linux-x64-musl-build.zip -d musl-ship
          BIN="musl-ship/${{ inputs.project_name }}"
          test -f "$BIN" || { echo "FAIL: the archive has no ${{ inputs.project_name }}"; exit 1; }
          if grep -q -a 'UPX!' "$BIN"; then echo "  packed by UPX: $(wc -c < "$BIN") bytes"
          else echo "  not packed ([upx] leaves linux-x64-musl alone): $(wc -c < "$BIN") bytes"; fi
          # Started from / and not from /app, like the step above: it has to
          # find the resources/ the archive put next to it. And its exit status
          # is read: a crash on the way out is a crash a player sees.
          #
          # --init, or it hangs until the job times out. Without one, xvfb-run
          # is the container's PID 1 -- and there Xvfb came up, the game never
          # started (xvfb-run waits for Xvfb's SIGUSR1 to say the server is
          # ready), and `timeout` could not end it, because busybox timeout
          # execs what it runs and PID 1 ignores a SIGTERM it has no handler
          # for. With an init as PID 1 it took five seconds. Found by running
          # this very step under podman, before any runner did. The init is the
          # engine's own (docker-init), not something the image carries.
          if OUT=$(docker run --rm --init --network none \
            -v "$PWD/musl-ship:/app:ro" \
            -w / -e RAY_TEST_MAX_FRAMES=10 \
            "$RUN_IMAGE" \
            timeout 180 xvfb-run -a -s "-screen 0 1280x720x24" \
            "/app/${{ inputs.project_name }}" 2>&1); then RC=0; else RC=$?; fi
          echo "$OUT" | tail -20
          test "$RC" -eq 0 || { echo "FAIL: it exited with status $RC"; exit 1; }
          echo "$OUT" | grep -q "RAY_TEST_BOOT_OK assets_failed=0 " \
            || { echo "FAIL: the shipped binary did not boot on Alpine, or an asset failed to load"; exit 1; }
          echo "$OUT" | grep -q RAY_TEST_RENDER_OK   || { echo "FAIL: it drew nothing"; exit 1; }
          echo "$OUT" | grep -q RAY_TEST_DONE_FRAMES || { echo "FAIL: it died before the end"; exit 1; }
          echo "PASS: the archive's binary booted and rendered on Alpine"

  riscv64:
    # Cross-compiled inside the amd64 container: the image ships the riscv64
    # X11/GL multiarch libraries. Static checks only — there is no riscv64
    # runner to boot it on.
    if: inputs.full && contains(fromJSON(inputs.targets), 'linux-riscv64-glibc')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ inputs.build_image }}
    defaults:
      run:
        # Container jobs default to `sh -e {0}`, which has no `pipefail`;
        # `set -euo pipefail` dies with "Illegal option". Be explicit.
        shell: bash
    steps:
      - name: Build image manifest
        run: cat /etc/raylib-build-image.json

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Configure (riscv64 toolchain)
        run: >
          cmake -B build/release -G Ninja
          -DCMAKE_BUILD_TYPE=Release -DPRODUCTION_BUILD=ON
          -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-riscv64-linux.cmake

      - name: Build
        run: cmake --build build/release

      # Held to its OWN floor, not [linux] glibc's. This target is
      # cross-compiled with the image's riscv64 GNU toolchain against Ubuntu
      # 24.04's riscv64 glibc, not with tools/linux_build.sh, so [linux] glibc
      # does not reach it. What it needs is 2.38 (one symbol, __isoc23_strtol),
      # and that number is in the .toml's [linux] glibc note, where a player's
      # minimum is looked for. A test holds the two to each other: a binary
      # that grows past it fails here, and the note changes with this line.
      - name: The glibc it needs, against the floor the .toml gives it
        run: bash tools/glibc_check.sh build/release/${{ inputs.project_name }} 2.38

      # The hardening CMakeLists.txt links a release with (RMP_RELEASE_PIE and
      # the measured flags around it) read off the binary itself, before UPX
      # packs it: RELRO, BIND_NOW, a stack that is not executable, and PIE
      # where that option is on. A flag a toolchain ignores was never there.
      - name: Linked hardened
        run: |
          set -euo pipefail
          PIE=""
          CACHE=build/release/CMakeCache.txt
          # A cache that is not there would read as "PIE off", and pass.
          grep -q '^RMP_RELEASE_PIE:BOOL=' "$CACHE" || { echo "FAIL: $CACHE says nothing of RMP_RELEASE_PIE"; exit 1; }
          if grep -q '^RMP_RELEASE_PIE:BOOL=ON' "$CACHE"; then PIE=--pie; fi
          python3 tools/binary_check.py elf ${PIE:+"$PIE"} "build/release/${{ inputs.project_name }}"

      - name: Test (static) — binary exists, is RISC-V ELF, executable
        run: |
          set -e
          BIN=build/release/${{ inputs.project_name }}
          test -f "$BIN" || { echo "FAIL: $BIN not found"; exit 1; }
          test -x "$BIN" || { echo "FAIL: $BIN not executable"; exit 1; }
          test -s "$BIN" || { echo "FAIL: $BIN empty"; exit 1; }
          # Portable ELF checks with od: magic + e_machine (RISC-V = 0x00F3 -> "f300").
          MAGIC=$(od -An -tx1 -N4 "$BIN" | tr -d ' \n')
          [ "$MAGIC" = "7f454c46" ] || { echo "FAIL: not an ELF (magic=$MAGIC)"; exit 1; }
          MACHINE=$(od -An -tx1 -j18 -N2 "$BIN" | tr -d ' \n')
          [ "$MACHINE" = "f300" ] || { echo "FAIL: not RISC-V (e_machine=$MACHINE)"; exit 1; }
          echo "PASS: static binary checks ($(wc -c < "$BIN") bytes)"

      - name: Package
        run: |
          mkdir -p package/resources
          # LICENSES.txt: the full notice of everything vendored, generated by
          # tools/configure.py from the licence files in thirdparty/. Absent
          # when [deploy] licenses = false, which is why this is not a hard cp.
          if [ -f cmake/generated/LICENSES.txt ]; then
            cp cmake/generated/LICENSES.txt package/
          fi
          cp build/release/${{ inputs.project_name }} package/
          # UPX, if [upx] in the .toml asked for this target, on the copy that
          # ships: build/release/ keeps the binary the linker wrote, and the
          # size budget reads the unpacked size from it. A no-op where [upx]
          # does not apply.
          bash tools/upx_pack.sh linux-riscv64-glibc "package/${{ inputs.project_name }}"
          # LOOSE RESOURCES, said out loud in the zip. rres_pack is built for
          # riscv64 here and cannot run on the amd64 host, so there is no pack
          # to ship. The game reads loose files when there is none.
          cp -r resources package/
          printf '%s\n' \
            "resources.rres was NOT built for this archive." \
            "linux-riscv64-glibc is cross-compiled, so the rres packer comes out as a" \
            "riscv64 binary and cannot run on the amd64 host that builds it. The loose" \
            "files next to this note are the same assets; the game reads them when" \
            "there is no pack. See .github/workflows/_linux.yml." \
            > package/resources/PACK_SKIPPED.txt
          cd package && zip -r ../linux-riscv64-glibc-build.zip .

      # The binary as linked and the copy that ships, each within 1.5% of its
      # line in tools/size_budget.txt. The measured line is printed either
      # way, so this log is all it takes to update the file.
      - name: Within its size budget
        run: python3 tools/size_check.py linux-riscv64-glibc "build/release/${{ inputs.project_name }}" "package/${{ inputs.project_name }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: linux-riscv64-glibc-build
          path: linux-riscv64-glibc-build.zip
          retention-days: 7

  # DRM/KMS: the game draws straight to the screen through the kernel, with no
  # X11 and no Wayland. A Raspberry Pi, an arcade cabinet, a kiosk, or a bare
  # TTY.
  #
  # It runs when linux-x64-glibc-drm is in [targets] -- which the "all" group
  # includes, so a default config builds it -- in the full matrix.
  #
  # This job builds and packages: what it proves is that the DRM backend still
  # compiles and links, the failure that actually happens -- libdrm moving, or
  # EGL/GBM headers going missing. drm-x64-run, below, then boots this binary
  # on a vkms virtual display and requires a rendered frame.
  drm-x64:
    if: inputs.full && contains(fromJSON(inputs.targets), 'linux-x64-glibc-drm')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ inputs.build_image }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Build image manifest
        run: cat /etc/raylib-build-image.json

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # No dependency step: libdrm, gbm, EGL and GLES are in the image. They used
      # to be an apt-get here, which is one network failure away from taking the
      # job down for a reason that has nothing to do with DRM.

      - name: Configure
        # The native compiler and not tools/linux_build.sh, which every other
        # Linux target uses. zig cannot link this one: libdrm/libgbm/libEGL come
        # from the distribution and are built against ITS glibc, so an older
        # stub set fails on the .so ("undefined reference:
        # __isoc23_strtol@GLIBC_2.38, referenced by /usr/lib/libdrm.so").
        run: cmake --preset release -DRMP_TARGET_DRM=ON

      - name: Build
        run: cmake --build build/release

      - name: The floor this one actually has
        # `report`, not a gate: see the DRM note in tools/glibc_check.sh. The
        # number belongs in the log of every run rather than in a player's
        # error message.
        run: bash tools/glibc_check.sh build/release/${{ inputs.project_name }} report

      # The hardening CMakeLists.txt links a release with (RMP_RELEASE_PIE and
      # the measured flags around it) read off the binary itself, before UPX
      # packs it: RELRO, BIND_NOW, a stack that is not executable, and PIE
      # where that option is on. A flag a toolchain ignores was never there.
      - name: Linked hardened
        run: |
          set -euo pipefail
          PIE=""
          CACHE=build/release/CMakeCache.txt
          # A cache that is not there would read as "PIE off", and pass.
          grep -q '^RMP_RELEASE_PIE:BOOL=' "$CACHE" || { echo "FAIL: $CACHE says nothing of RMP_RELEASE_PIE"; exit 1; }
          if grep -q '^RMP_RELEASE_PIE:BOOL=ON' "$CACHE"; then PIE=--pie; fi
          python3 tools/binary_check.py elf ${PIE:+"$PIE"} "build/release/${{ inputs.project_name }}"

      - name: Test (static) — the DRM backend is really what got linked
        run: |
          set -euo pipefail
          BIN="build/release/${{ inputs.project_name }}"
          [ -x "$BIN" ] || { echo "FAIL: no binary"; exit 1; }
          # The point of the job. Without this the build could quietly fall back
          # to the desktop backend and the job would pass while proving nothing.
          if ldd "$BIN" | grep -q "libdrm"; then
            echo "PASS: linked against libdrm"
          else
            echo "FAIL: not linked against libdrm — did PLATFORM=DRM take effect?"
            ldd "$BIN"
            exit 1
          fi
          # And GLFW must be gone: on DRM there is no windowing system to talk to.
          if ldd "$BIN" | grep -qE "libX11|libwayland"; then
            echo "FAIL: still linked against a windowing system"
            ldd "$BIN"
            exit 1
          fi
          echo "PASS: no X11 and no Wayland"

      # The DRM jobs build NATIVELY (`cmake --preset release -DRMP_TARGET_DRM=ON`,
      # not tools/linux_build.sh), so rres_pack is a host binary and this can
      # ship the same one file every other native archive ships. It used to
      # `cp -r resources` for no stated reason while x64 and arm64 next door
      # packed -- two archive shapes from one pipeline.
      - name: Pack resources
        run: cmake --build build/release --target pack_resources

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p package/resources
          if [ -f cmake/generated/LICENSES.txt ]; then
            cp cmake/generated/LICENSES.txt package/
          fi
          cp build/release/${{ inputs.project_name }} package/
          # UPX, if [upx] in the .toml asked for this target, on the copy that
          # ships: build/release/ keeps the binary the linker wrote, and the
          # size budget reads the unpacked size from it. A no-op where [upx]
          # does not apply.
          bash tools/upx_pack.sh linux-x64-glibc-drm "package/${{ inputs.project_name }}"
          sh tools/ship_resources.sh package   # the pack; loose files for a plain C game
          cd package && zip -r ../linux-x64-glibc-drm-build.zip .

      # The binary as linked and the copy that ships, each within 1.5% of its
      # line in tools/size_budget.txt. The measured line is printed either
      # way, so this log is all it takes to update the file.
      - name: Within its size budget
        run: python3 tools/size_check.py linux-x64-glibc-drm "build/release/${{ inputs.project_name }}" "package/${{ inputs.project_name }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: linux-x64-glibc-drm-build
          path: linux-x64-glibc-drm-build.zip
          retention-days: 7

  # DRM has no windowing system, so there is nothing for xvfb to fake: the
  # backend talks to a card through /dev/dri, and a runner has no screen. So the
  # kernel provides one. vkms is mainline Virtual Kernel Mode Setting -- a DRM
  # device with a CRTC, an encoder and a connector and no hardware behind any of
  # them -- and Mesa's kms_swrast rasterises into it on the CPU. Between the two
  # the binary meets a real DRM/KMS stack and a real GBM surface.
  #
  # A bare runner rather than a container job, because modprobe needs the host's
  # kernel and a container job has no way to reach it. The binary then runs
  # inside the build image through `docker run --device /dev/dri`, so the
  # libraries it meets are the ones it was linked against and nothing is
  # installed at job time.
  #
  # THE BINARY IS THE ONE THAT SHIPS: drm-x64's archive, unzipped, packed by
  # UPX where [upx] packs it, which the default does. It used to be a copy
  # uploaded before the Package step, unpacked, so that a stub that would not
  # start could not be confused with a DRM failure -- and the packed binary a
  # player gets was never started by anything. That second suspect is cheap
  # to rule out: the log says whether the binary is packed, and drm-x64's
  # build/release/ still holds the unpacked one.
  drm-x64-run:
    needs: drm-x64
    if: inputs.full && contains(fromJSON(inputs.targets), 'linux-x64-glibc-drm')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: linux-x64-glibc-drm-build
          path: drm-zip

      - name: A virtual display, from the kernel
        run: |
          set -euo pipefail
          echo "kernel: $(uname -r)"
          # Printed, not assumed: if the module is not there, the failure has to
          # say which half was at fault rather than leaving a bare exit code.
          if ! modinfo vkms > /dev/null 2>&1; then
            # The Azure kernel the runners boot ships a trimmed module set and
            # vkms is not in it -- `modprobe: FATAL: Module vkms not found in
            # directory /lib/modules/6.17.0-1022-azure`. It lives in
            # linux-modules-extra, which is a download, and a download is the
            # one thing the Linux jobs avoid. This job is the exception and it
            # is a narrow one: the alternative is not testing a shipped target
            # at all, and there is no build depending on it -- drm-x64 has
            # already built and uploaded the binary before this job starts.
            echo "vkms is not in the booted kernel; fetching the extra modules"
            sudo apt-get update -qq
            sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)" \
              || { echo "FAIL: no linux-modules-extra for $(uname -r) in the archive"; exit 1; }
          fi
          modinfo vkms 2>&1 | head -3 || echo "  (this kernel has no vkms module)"
          sudo modprobe vkms || { echo "FAIL: the runner kernel cannot load vkms"; exit 1; }
          # udev takes a moment to create the nodes.
          for _ in 1 2 3 4 5; do [ -e /dev/dri/card0 ] && break; sleep 1; done
          ls -la /dev/dri || { echo "FAIL: vkms loaded and /dev/dri is still empty"; exit 1; }

      - name: Boot and render through DRM/KMS
        run: |
          set -euo pipefail
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          # The archive as a player unzips it: the binary and resources/ next
          # to it, which PRODUCTION_BUILD looks for. One read-only mount and
          # not two nested ones: docker cannot create a mountpoint inside a
          # read-only rootfs and podman can, so the nested form passes on a
          # laptop and dies here.
          mkdir -p drm-bin
          unzip -q drm-zip/linux-x64-glibc-drm-build.zip -d drm-bin
          BIN="drm-bin/${{ inputs.project_name }}"
          test -f "$BIN" || { echo "FAIL: the archive has no ${{ inputs.project_name }}"; exit 1; }
          if grep -q -a 'UPX!' "$BIN"; then echo "  packed by UPX: $(wc -c < "$BIN") bytes"
          else echo "  not packed ([upx] leaves linux-x64-glibc-drm alone): $(wc -c < "$BIN") bytes"; fi
          # What the container actually sees. vkms has a card node and no
          # render node, which is the first thing to suspect when EGL says no.
          docker run --rm --device /dev/dri --entrypoint ls \
            "${{ inputs.build_image }}" -la /dev/dri || true
          # Started from / and not from /app: a release has to find the
          # resources/ next to itself, wherever it is started from.
          OUT=$(docker run --rm --device /dev/dri \
            -v "$PWD/drm-bin:/app:ro" \
            -w / -e RAY_TEST_MAX_FRAMES=10 \
            -e LIBGL_ALWAYS_SOFTWARE=1 \
            -e EGL_LOG_LEVEL=debug \
            "${{ inputs.build_image }}" \
            "/app/${{ inputs.project_name }}" 2>&1) || true
          echo "$OUT" | tail -30
          echo "$OUT" | grep -q "RAY_TEST_BOOT_OK assets_failed=0 " \
            || { echo "FAIL: it did not boot on DRM, or an asset failed to load"; exit 1; }
          echo "$OUT" | grep -q RAY_TEST_RENDER_OK   || { echo "FAIL: it drew nothing"; exit 1; }
          echo "$OUT" | grep -q RAY_TEST_DONE_FRAMES || { echo "FAIL: it died before the end"; exit 1; }
          echo "PASS: booted and rendered through DRM/KMS"


  drm-arm64:
    # Built and checked, not run. drm-x64-run gets a virtual display out of the
    # kernel with vkms, and GitHub's arm64 runners could too -- but the thing
    # this target exists for is a Raspberry Pi, where the display pipeline is
    # the Pi's own vc4/v3d KMS driver and Mesa's v3d, neither of which vkms and
    # llvmpipe resemble. A green run here would say the binary starts on a
    # virtual display, which is not the question. The hardware answers it.
    #
    # (There is deliberately no drm-arm64-run job. A copy of drm-x64-run's
    # header comment used to sit at the end of this file with no job under it,
    # describing one -- twelve lines directly contradicting the paragraph
    # above. It is gone; this note is here so nobody restores it from a diff.)
    if: inputs.full && contains(fromJSON(inputs.targets), 'linux-arm64-glibc-drm')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ inputs.build_image }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Build image manifest
        run: cat /etc/raylib-build-image.json

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # No dependency step: libdrm, gbm, EGL and GLES are in the image. They used
      # to be an apt-get here, which is one network failure away from taking the
      # job down for a reason that has nothing to do with DRM.

      - name: Configure
        # The native compiler and not tools/linux_build.sh, which every other
        # Linux target uses. zig cannot link this one: libdrm/libgbm/libEGL come
        # from the distribution and are built against ITS glibc, so an older
        # stub set fails on the .so ("undefined reference:
        # __isoc23_strtol@GLIBC_2.38, referenced by /usr/lib/libdrm.so").
        run: cmake --preset release -DRMP_TARGET_DRM=ON

      - name: Build
        run: cmake --build build/release

      - name: The floor this one actually has
        # `report`, not a gate: see the DRM note in tools/glibc_check.sh. The
        # number belongs in the log of every run rather than in a player's
        # error message.
        run: bash tools/glibc_check.sh build/release/${{ inputs.project_name }} report

      # The hardening CMakeLists.txt links a release with (RMP_RELEASE_PIE and
      # the measured flags around it) read off the binary itself, before UPX
      # packs it: RELRO, BIND_NOW, a stack that is not executable, and PIE
      # where that option is on. A flag a toolchain ignores was never there.
      - name: Linked hardened
        run: |
          set -euo pipefail
          PIE=""
          CACHE=build/release/CMakeCache.txt
          # A cache that is not there would read as "PIE off", and pass.
          grep -q '^RMP_RELEASE_PIE:BOOL=' "$CACHE" || { echo "FAIL: $CACHE says nothing of RMP_RELEASE_PIE"; exit 1; }
          if grep -q '^RMP_RELEASE_PIE:BOOL=ON' "$CACHE"; then PIE=--pie; fi
          python3 tools/binary_check.py elf ${PIE:+"$PIE"} "build/release/${{ inputs.project_name }}"

      - name: Test (static) — an aarch64 DRM binary is really what got linked
        run: |
          set -euo pipefail
          BIN="build/release/${{ inputs.project_name }}"
          # e_machine at offset 0x12: aarch64 is 0x00B7 -> "b700" little-endian.
          # Cheap, and it is the one thing a cross-build can get wrong silently.
          MACHINE=$(od -An -tx1 -j18 -N2 "$BIN" | tr -d ' \n')
          [ "$MACHINE" = "b700" ] || { echo "FAIL: not aarch64 (e_machine=$MACHINE)"; exit 1; }
          [ -x "$BIN" ] || { echo "FAIL: no binary"; exit 1; }
          # The point of the job. Without this the build could quietly fall back
          # to the desktop backend and the job would pass while proving nothing.
          if ldd "$BIN" | grep -q "libdrm"; then
            echo "PASS: linked against libdrm"
          else
            echo "FAIL: not linked against libdrm — did PLATFORM=DRM take effect?"
            ldd "$BIN"
            exit 1
          fi
          # And GLFW must be gone: on DRM there is no windowing system to talk to.
          if ldd "$BIN" | grep -qE "libX11|libwayland"; then
            echo "FAIL: still linked against a windowing system"
            ldd "$BIN"
            exit 1
          fi
          echo "PASS: no X11 and no Wayland"

      # Native aarch64 build on an arm64 runner, so the packer runs. Same
      # archive shape as every other native target.
      - name: Pack resources
        run: cmake --build build/release --target pack_resources

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p package/resources
          if [ -f cmake/generated/LICENSES.txt ]; then
            cp cmake/generated/LICENSES.txt package/
          fi
          cp build/release/${{ inputs.project_name }} package/
          # UPX, if [upx] in the .toml asked for this target, on the copy that
          # ships: build/release/ keeps the binary the linker wrote, and the
          # size budget reads the unpacked size from it. A no-op where [upx]
          # does not apply.
          bash tools/upx_pack.sh linux-arm64-glibc-drm "package/${{ inputs.project_name }}"
          sh tools/ship_resources.sh package   # the pack; loose files for a plain C game
          cd package && zip -r ../linux-arm64-glibc-drm-build.zip .

      # The binary as linked and the copy that ships, each within 1.5% of its
      # line in tools/size_budget.txt. The measured line is printed either
      # way, so this log is all it takes to update the file.
      - name: Within its size budget
        run: python3 tools/size_check.py linux-arm64-glibc-drm "build/release/${{ inputs.project_name }}" "package/${{ inputs.project_name }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: linux-arm64-glibc-drm-build
          path: linux-arm64-glibc-drm-build.zip
          retention-days: 7

